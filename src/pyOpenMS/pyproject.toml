# pyOpenMS - Python bindings for OpenMS
# Build system configuration using PEP 517/518/621 with py-build-cmake
#
# Prerequisites:
#   OpenMS C++ library must be built and installed/accessible
#   Set OpenMS_ROOT environment variable to point to OpenMS build/install directory
#
# Build with:
#   pip wheel . --no-build-isolation  (after setting OpenMS_ROOT)
#   uv build --wheel
#   pip install . --config-settings=cmake.options.OpenMS_ROOT=/path/to/openms
#
# This uses py-build-cmake to drive the build process:
# 1. pip/uv installs build dependencies automatically
# 2. py-build-cmake invokes CMake with correct Python hints
# 3. CMake builds the extension modules
# 4. py-build-cmake packages the result into a wheel

[build-system]
requires = [
    "py-build-cmake>=0.3.0",
    "autowrap>=0.24.0",
    "Cython>=3.1.0",
    "numpy>=2.0",
]
build-backend = "py_build_cmake.build"

[project]
name = "pyopenms"
# Version is set here; CI will update this dynamically for nightly builds (appends .devYYYYMMDD)
version = "3.6.0"
description = "Python wrapper for C++ LC-MS library OpenMS"
readme = "README.rst"
license = {text = "BSD-3-Clause"}
requires-python = ">=3.10"
authors = [
    {name = "OpenMS team", email = "webmaster@openms.de"},
]
maintainers = [
    {name = "The OpenMS team", email = "open-ms-general@lists.sourceforge.net"},
]
keywords = [
    "mass spectrometry",
    "proteomics",
    "metabolomics",
    "LC-MS",
    "bioinformatics",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "numpy>=2.0",
    "matplotlib>=3.5",
]

[project.urls]
Homepage = "https://openms.de"
Documentation = "https://pyopenms.readthedocs.io"
"Source Code" = "https://github.com/OpenMS/OpenMS/tree/develop/src/pyOpenMS"
"Bug Tracker" = "https://github.com/OpenMS/OpenMS/issues"
"Documentation Source" = "https://github.com/OpenMS/pyopenms-docs"

[project.optional-dependencies]
dataframes = ["pandas"]
arrow = ["pyarrow"]
all = ["pandas", "pyarrow"]

# Dependency groups (PEP 735) - installable with: uv sync --only-group <name>
[dependency-groups]
build = [
    "py-build-cmake>=0.3.0",
    "autowrap>=0.24.0",
    "Cython>=3.1.0",
    "numpy>=2.0",
]
test = [
    "pytest",
    "pytest-cov",
    "pandas",  # tests need pandas for DataFrame functionality
]
dev = [
    {include-group = "build"},
    {include-group = "test"},
    "matplotlib>=3.5",
]

#------------------------------------------------------------------------------
# py-build-cmake configuration
#------------------------------------------------------------------------------

[tool.py-build-cmake.module]
# The Python package is partially generated by CMake (compiled extensions)
name = "pyopenms"
directory = "pyopenms"
generated = "package"

[tool.py-build-cmake.sdist]
# Files to include in source distribution
include = [
    "CMakeLists.txt",
    "pyproject.toml",
    "README.rst",
    "MANIFEST.in",
    "pyopenms/*.py",
    "pyopenms/*.pyi",
    "pyopenms/py.typed",
    "pxds/*.pxd",
    "addons/*.pyx",
    "converters/*",
    "extra_includes/*",
    "create_cpp_extension.py",
    "fix_pyi_imports.py",
]

[tool.py-build-cmake.cmake]
# CMake build configuration
generator = "Ninja"
build_type = "Release"
source_path = "."
# Do NOT pass -j here! It would override CMAKE_BUILD_PARALLEL_LEVEL env var.
# CMake docs: "CMAKE_BUILD_PARALLEL_LEVEL specifies a default parallel level
# when this option [--parallel/-j] is not given."
# CI sets CMAKE_BUILD_PARALLEL_LEVEL=2 to prevent OOM on limited-memory runners.
# Local builds will use Ninja's default (all cores) when env var is not set.
build_args = []
install_components = ["python_modules"]

[tool.py-build-cmake.cmake.options]
# CMake options - OpenMS_ROOT should be set via environment or config-settings
# Example: pip install . --config-settings=cmake.options.OpenMS_ROOT=/path/to/openms
# Or set environment variable: export OpenMS_ROOT=/path/to/openms
#
# PY_NUM_MODULES: Number of submodules to split pyopenms into (reduces per-module memory)
# PY_NUM_THREADS: Number of parallel Cython compilations (each uses 2-4GB RAM)
# Defaults are conservative for CI (~7GB RAM). Local builds with more RAM can increase:
#   pip install . --config-settings=cmake.options.PY_NUM_THREADS=4
PY_NUM_MODULES = "8"
PY_NUM_THREADS = "2"
# Skip dependency bundling - wheel repair tools will handle this
NO_DEPENDENCIES = "ON"


#------------------------------------------------------------------------------
# cibuildwheel configuration
#------------------------------------------------------------------------------

[tool.cibuildwheel]
# Build for Python 3.10-3.14
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
# Skip 32-bit, musllinux, and PyPy builds
skip = "*-win32 *-musllinux_* pp*"

# Test the wheel after building
# IMPORTANT: Run pytest from home directory (not from source tree) to force Python to import
# from the installed wheel in site-packages, not from the source tree.
# The source tree is missing generated files like _version.py which causes import errors.
# Using --import-mode=importlib ensures pytest uses standard Python imports.
test-requires = ["pytest", "numpy", "pandas", "pyarrow"]
test-command = "cd ~ && pytest {package}/tests/unittests -v --tb=short --import-mode=importlib"

# Build in isolated environment
build-verbosity = 1

[tool.cibuildwheel.linux]
# Use OpenMS manylinux containers with pre-built dependencies
archs = ["x86_64", "aarch64"]
manylinux-x86_64-image = "ghcr.io/openms/contrib_manylinux_2_34:latest-amd64"
manylinux-aarch64-image = "ghcr.io/openms/contrib_manylinux_2_34:latest-arm64"

# Install additional build tools
before-all = [
    "yum install -y cmake ninja-build",
]

# Bundle shared libraries into wheel
repair-wheel-command = [
    "auditwheel repair -w {dest_dir} {wheel}",
]

[tool.cibuildwheel.linux.environment]
# OpenMS is pre-built in the container at /contrib-build
OpenMS_ROOT = "/openms-build"
CMAKE_PREFIX_PATH = "/contrib-build"
LD_LIBRARY_PATH = "/openms-build/lib:$LD_LIBRARY_PATH"

[tool.cibuildwheel.macos]
# Build for Apple Silicon (ARM64) only - x86_64 would need separate OpenMS build
archs = ["arm64"]

# Install dependencies via Homebrew
before-all = [
    "brew install cmake ninja boost eigen xerces-c sqlite coinutils cbc cgl clp qtbase qtsvg apache-arrow libomp",
]

# Use delocate to bundle shared libraries
repair-wheel-command = [
    "pip install delocate",
    "delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}",
]

[tool.cibuildwheel.macos.environment]
# Homebrew paths
CMAKE_PREFIX_PATH = "$(brew --prefix):$(brew --prefix libomp)"
# TODO we get warnings about mismatch to _PYTHON_HOST_PLATFORM 
# (which cibuildwheel computes as macos-11.0-arm64) which is probably a default
# We should fix this, although wheels seem to be produced correctly (with 14.0)
# This is required because we use brew dependencies which do not set any
# MACOSX_DEPLOYMENT_TARGET by default (therefore are built for the current OS version)
MACOSX_DEPLOYMENT_TARGET = "14.0"
# OpenMS must be built separately and OpenMS_ROOT set in CI
# OpenMS_ROOT = "$GITHUB_WORKSPACE/openms-build"

[tool.cibuildwheel.windows]
archs = ["AMD64"]

# Install delvewheel for DLL bundling
before-build = "pip install delvewheel"

# Bundle DLLs into wheel
repair-wheel-command = [
    "delvewheel repair -w {dest_dir} {wheel}",
]

[tool.cibuildwheel.windows.environment]
# OpenMS must be built separately and OpenMS_ROOT set in CI
# CMAKE_PREFIX_PATH should include Qt and contrib paths

#------------------------------------------------------------------------------
# pytest configuration
#------------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
