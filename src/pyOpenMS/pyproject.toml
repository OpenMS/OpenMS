# pyOpenMS - Python bindings for OpenMS
# Build system configuration using PEP 517/518/621 with py-build-cmake
#
# Build with: pip wheel . (after setting OpenMS_ROOT environment variable)
# Or: pip install . --config-settings=cmake.options.OpenMS_ROOT=/path/to/openms
#
# This uses py-build-cmake to drive the build process:
# 1. pip installs build dependencies automatically
# 2. py-build-cmake invokes CMake with correct Python hints
# 3. CMake builds the extension modules
# 4. py-build-cmake packages the result into a wheel

[build-system]
requires = [
    "py-build-cmake>=0.3.0",
    "autowrap>=0.24.0",
    "Cython>=3.1.0",
    "numpy>=2.0",
]
build-backend = "py_build_cmake.build"

[project]
name = "pyopenms"
# Version is set here; for nightly builds, update via config-settings or CI
version = "3.4.0"
description = "Python wrapper for C++ LC-MS library OpenMS"
readme = "README.rst"
license = {text = "BSD-3-Clause"}
requires-python = ">=3.9"
authors = [
    {name = "OpenMS team", email = "webmaster@openms.de"},
]
maintainers = [
    {name = "The OpenMS team", email = "open-ms-general@lists.sourceforge.net"},
]
keywords = [
    "mass spectrometry",
    "proteomics",
    "metabolomics",
    "LC-MS",
    "bioinformatics",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "numpy>=2.0",
    "pandas",
    "matplotlib>=3.5",
]

[project.urls]
Homepage = "https://openms.de"
Documentation = "https://pyopenms.readthedocs.io"
"Source Code" = "https://github.com/OpenMS/OpenMS/tree/develop/src/pyOpenMS"
"Bug Tracker" = "https://github.com/OpenMS/OpenMS/issues"
"Documentation Source" = "https://github.com/OpenMS/pyopenms-docs"

# Dependency groups (PEP 735) - installable with: uv sync --only-group <name>
# These are NOT included when installing the package, only when explicitly requested
[dependency-groups]
# Dependencies needed for pyOpenMS build (matches [build-system].requires)
# Install with: uv sync --only-group build --no-install-project --active
build = [
    "py-build-cmake>=0.3.0",
    "autowrap>=0.24.0",
    "Cython>=3.1.0",
    "numpy>=2.0",
]
# Full development environment (build + test + coverage)
dev = [
    "py-build-cmake>=0.3.0",
    "autowrap>=0.24.0",
    "Cython>=3.1.0",
    "numpy>=2.0",
    "pytest",
    "pytest-cov",
    "pandas",
    "matplotlib>=3.5",
]
# Testing only
test = [
    "pytest",
    "pytest-cov",
]

#------------------------------------------------------------------------------
# py-build-cmake configuration
#------------------------------------------------------------------------------

[tool.py-build-cmake.module]
# The Python package is partially generated by CMake (compiled extensions)
# The source Python files are in pyopenms/, but the extensions are generated
name = "pyopenms"
directory = "pyopenms"
generated = "package"

[tool.py-build-cmake.sdist]
# Files to include in source distribution
include = [
    "CMakeLists.txt",
    "pyproject.toml",
    "README.rst",
    "MANIFEST.in",
    "pyopenms/*.py",
    "pyopenms/*.pyi",
    "pyopenms/py.typed",
    "pxds/*.pxd",
    "addons/*.pyx",
    "converters/*",
    "extra_includes/*",
    "create_cpp_extension.py",
]

[tool.py-build-cmake.cmake]
# CMake build configuration
build_type = "Release"
source_path = "."
# Build parallelism
build_args = ["-j"]
# Install only the python_modules component
install_components = ["python_modules"]
# py-build-cmake automatically sets Python hints for CMake

[tool.py-build-cmake.cmake.options]
# CMake options - OpenMS_ROOT should be set via environment or config-settings
# Example: pip install . --config-settings=cmake.options.OpenMS_ROOT=/path/to/openms
# Or set environment variable: export OpenMS_ROOT=/path/to/openms
PY_NUM_MODULES = "8"
PY_NUM_THREADS = "1"

# Environment variables for CMake
# These can be overridden via shell environment or --config-settings
[tool.py-build-cmake.cmake.env]
# CMAKE_PREFIX_PATH should include paths to OpenMS dependencies (Eigen3, Qt6, etc.)
# Example: CMAKE_PREFIX_PATH = "/path/to/contrib;/path/to/qt6"
# If building against a build directory, also set OpenMS_ROOT:
# Example: OpenMS_ROOT = "/path/to/OpenMS-build"

[tool.py-build-cmake.stubgen]
# Generate .pyi stub files for type hints (if supported by autowrap output)
# This is optional - autowrap may already generate stubs
args = ["-v"]
