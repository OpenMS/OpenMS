# pyOpenMS - Python bindings for OpenMS
# Build system configuration using PEP 517/518/621

[build-system]
requires = [
    "setuptools>=61.0",
    "wheel",
    "autowrap>=0.24.0",
    "Cython>=3.1.0",
    "numpy>=2.0",
    "pytest",  # for running tests after build
    "pandas",  # runtime dep needed for tests
    "matplotlib>=3.5",  # runtime dep needed for tests
]
build-backend = "setuptools.build_meta"

[project]
name = "pyopenms"
# Version is set dynamically by setup.py based on git branch (nightly vs release)
# We use a placeholder here; the actual version comes from env.py generated by CMake
dynamic = ["version"]
description = "Python wrapper for C++ LC-MS library OpenMS"
readme = "README.rst"
license = {text = "BSD-3-Clause"}
requires-python = ">=3.9"
authors = [
    {name = "OpenMS team", email = "webmaster@openms.de"},
]
maintainers = [
    {name = "The OpenMS team", email = "open-ms-general@lists.sourceforge.net"},
]
keywords = [
    "mass spectrometry",
    "proteomics",
    "metabolomics",
    "LC-MS",
    "bioinformatics",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "numpy>=2.0",
    "pandas",
    "matplotlib>=3.5",
]

[project.urls]
Homepage = "https://openms.de"
Documentation = "https://pyopenms.readthedocs.io"
"Source Code" = "https://github.com/OpenMS/OpenMS/tree/develop/src/pyOpenMS"
"Bug Tracker" = "https://github.com/OpenMS/OpenMS/issues"
"Documentation Source" = "https://github.com/OpenMS/pyopenms-docs"

# Dependency groups (PEP 735) - installable with: uv sync --group <name>
# These are NOT included when installing the package, only when explicitly requested
[dependency-groups]
# Dependencies needed for CMake code generation phase (autowrap/Cython)
build = [
    "setuptools>=61.0",
    "wheel",
    "autowrap>=0.24.0",
    "Cython>=3.1.0",
    "numpy>=2.0",
    "tomli>=2.0; python_version < '3.11'",  # for TOML parsing on Python < 3.11
]
# Full development environment (build + test)
dev = [
    "pytest",
    "pytest-cov",
    "autowrap>=0.24.0",
    "Cython>=3.1.0",
    "numpy>=2.0",
    "tomli>=2.0; python_version < '3.11'",
]
# Testing only
test = [
    "pytest",
    "pytest-cov",
]

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["pyopenms*"]

[tool.setuptools.package-data]
pyopenms = ["py.typed", "*.pyi", "*.so", "*.pyd", "*.dylib", "*.dll"]

# Note: Version is provided dynamically by setup.py, not read from a file.
# This is because the version depends on env.py which is generated by CMake.
