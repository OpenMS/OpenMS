# pyOpenMS - nanobind-based Python bindings for OpenMS
# Build system configuration using PEP 517/518/621 with py-build-cmake
#
# Prerequisites:
#   OpenMS C++ library must be built and installed/accessible
#   Set OpenMS_ROOT environment variable to point to OpenMS build/install directory
#
# Build with:
#   pip wheel . --no-build-isolation  (after setting OpenMS_ROOT)
#   uv build --wheel
#   pip install . --config-settings=cmake.options.OpenMS_ROOT=/path/to/openms

[build-system]
# Also update dependency-group.build when making changes here!!!
requires = [
    "build>=1.3.0",
    "py-build-cmake>=0.3.0",
    "nanobind>=2.4.0",
    "numpy>=2.0",
    "auditwheel; sys_platform == 'linux'",
    "delocate; sys_platform == 'darwin'",
    "delvewheel; sys_platform == 'win32'",
]
build-backend = "py_build_cmake.build"

[project]
name = "pyopenms"
# Version is set here; CI will update this dynamically for nightly builds (appends .devYYYYMMDD)
version = "3.6.0"
description = "Python wrapper for C++ LC-MS library OpenMS"
readme = "README.rst"
license = {text = "BSD-3-Clause"}
requires-python = ">=3.10"
authors = [
    {name = "The OpenMS team", email = "webmaster@openms.de"},
]
maintainers = [
    {name = "The OpenMS team", email = "open-ms-general@lists.sourceforge.net"},
]
keywords = [
    "mass spectrometry",
    "proteomics",
    "metabolomics",
    "LC-MS",
    "bioinformatics",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "numpy>=2.0",
    "matplotlib>=3.5",
]

[project.urls]
Homepage = "https://openms.de"
Documentation = "https://pyopenms.readthedocs.io"
"Source Code" = "https://github.com/OpenMS/OpenMS/tree/develop/src/pyOpenMS"
"Bug Tracker" = "https://github.com/OpenMS/OpenMS/issues"
"Documentation Source" = "https://github.com/OpenMS/pyopenms-docs"

[project.optional-dependencies]
dataframes = ["pandas"]
# pyarrow 24.0.0 on PyPI only shipped cp310 wheels (no source distribution),
# breaking uv sync on cp311/cp312/cp313 runners. Pin out of 24.0.0 until a
# release with complete wheel coverage lands.
arrow = ["pyarrow!=24.0.0"]
all = ["pandas", "pyarrow!=24.0.0"]

# Dependency groups (PEP 735) - installable with: uv sync --only-group <name>
[dependency-groups]
build = [
    "build>=1.3.0",
    "py-build-cmake>=0.3.0",
    "nanobind>=2.4.0",
    "numpy>=2.0",
    "auditwheel; sys_platform == 'linux'",
    "delocate; sys_platform == 'darwin'",
    "delvewheel; sys_platform == 'win32'",
]
test = [
    "pytest",
    "pytest-cov",
    "pandas",  # tests need pandas for DataFrame functionality
    "pyarrow!=24.0.0",  # see [project.optional-dependencies].arrow for the 24.0.0 exclusion rationale
]
dev = [
    {include-group = "build"},
    {include-group = "test"},
    "matplotlib>=3.5",
]

#------------------------------------------------------------------------------
# py-build-cmake configuration
#------------------------------------------------------------------------------

[tool.py-build-cmake.module]
# The Python package is partially generated by CMake (compiled extensions)
name = "pyopenms"
directory = "pyopenms"
generated = "package"

[tool.py-build-cmake.sdist]
# Files to include in source distribution
include = [
    "CMakeLists.txt",
    "pyproject.toml",
    "README.rst",
    "MANIFEST.in",
    "pyopenms/*.py",
    "pyopenms/*.pyi",
    "pyopenms/py.typed",
    "pyopenms/addons/*.py",
    "bindings/bind_*.cpp",
    "bindings/main_module.cpp",
    "bindings/arrow_zerocopy.cpp",
    "bindings/type_casters/*.h",
    "fix_stubs.py",
    "stubs.patch",
]

[tool.py-build-cmake.cmake]
# CMake build configuration
build_type = "Release"
source_path = "."
install_args = ["--strip"]
build_args = []
install_components = ["python_modules"]

[tool.py-build-cmake.cmake.options]
# CMake options - OpenMS_ROOT should be set via environment or config-settings
# Example: pip install . --config-settings=cmake.options.OpenMS_ROOT=/path/to/openms
# Or set environment variable: export OpenMS_ROOT=/path/to/openms
#
# Skip dependency bundling - wheel repair tools will usually handle this
NO_DEPENDENCIES = "ON"


#------------------------------------------------------------------------------
# cibuildwheel configuration
#------------------------------------------------------------------------------

[tool.cibuildwheel]
# Build for Python 3.10-3.14 (usually overwritten by GitHub Actions)
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
# Skip 32-bit, musllinux, and PyPy builds
skip = "*-win32 *-musllinux_* pp*"

# Test the wheel after building
test-requires = ["pytest", "numpy", "pandas", "pyarrow!=24.0.0"]
test-command = "pytest \"{package}/tests\" --import-mode=importlib"
build-verbosity = 1

# Override cmake options for wheel building with repair tools
[tool.cibuildwheel.config-settings]
"override" = [
    "cmake.options.NO_DEPENDENCIES=ON",
    "cmake.options.PYOPENMS_PREPARE_WHEEL_REPAIR=ON"
]

[tool.cibuildwheel.linux]
# Use OpenMS manylinux containers with pre-built dependencies
archs = ["x86_64", "aarch64"]
manylinux-x86_64-image = "ghcr.io/openms/contrib_manylinux_2_34:latest-amd64"
manylinux-aarch64-image = "ghcr.io/openms/contrib_manylinux_2_34:latest-arm64"

# Install additional build tools
before-all = [
    "yum install -y cmake ninja-build",
]

# Bundle shared libraries into wheel
repair-wheel-command = [
    "auditwheel repair -w {dest_dir} {wheel}",
]

[tool.cibuildwheel.macos]
# Build for Apple Silicon (ARM64) only - x86_64 would need separate OpenMS build
archs = ["arm64"]

# Install dependencies via Homebrew
before-all = [
    "brew install cmake ninja boost eigen xerces-c sqlite coinutils cbc cgl clp apache-arrow libomp",
]

# Use delocate to bundle shared libraries
repair-wheel-command = [
    "delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}",
]

[tool.cibuildwheel.macos.environment]
# Homebrew paths
CMAKE_PREFIX_PATH = "$(brew --prefix):$(brew --prefix libomp)"
MACOSX_DEPLOYMENT_TARGET = "14.0"

[tool.cibuildwheel.windows]
archs = ["AMD64"]
# apparently cibuildwheel gives a sh1t about build requirements in the repair step
before-build = "pip install delvewheel"
# Bundle DLLs into wheel
repair-wheel-command = [
    "delvewheel repair -w {dest_dir} {wheel}",
]

#------------------------------------------------------------------------------
# pytest configuration
#------------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test*"]
addopts = "-v --tb=short"
