<?xml version="1.0" encoding="ISO-8859-1"?>
<PARAMETERS version="1.8.0" xsi:noNamespaceSchemaLocation="https://raw.githubusercontent.com/OpenMS/OpenMS/develop/share/OpenMS/SCHEMAS/Param_1_8_0.xsd" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
  <NODE name="RNAMassCalculator" description="Calculates masses, mass-to-charge ratios and sum formulas of RNA sequences">
    <ITEM name="version" value="3.5.0-pre-nuc-dia-2025-07-24" type="string" description="Version of the tool that generated this parameters file." required="false" advanced="true" />
    <NODE name="1" description="Instance &apos;1&apos; section for &apos;RNAMassCalculator&apos;">
      <ITEM name="in" value="" type="input-file" description="Input file with RNA sequences and optionally charge numbers (mutually exclusive to &apos;in_seq&apos;)" required="false" advanced="false" supported_formats="*.txt" />
      <ITEMLIST name="in_seq" type="string" description="List of RNA sequences (mutually exclusive to &apos;in&apos;)" required="false" advanced="false">
      </ITEMLIST>
      <ITEM name="out" value="" type="output-file" description="Output file; if empty, output is written to the screen" required="false" advanced="false" supported_formats="*.txt" />
      <ITEMLIST name="charge" type="int" description="List of charge states; required if &apos;in_seq&apos; is given" required="false" advanced="false">
        <LISTITEM value="0"/>
      </ITEMLIST>
      <ITEM name="format" value="list" type="string" description="Output format (&apos;list&apos;: human-readable list, &apos;table&apos;: CSV-like table, &apos;mass_only&apos;: mass values only, &apos;mz_only&apos;: m/z values only, &apos;formula_only&apos;: sum formula only)#br#" required="false" advanced="false" restrictions="list,table,mass_only,mz_only,formula_only" />
      <ITEM name="average_mass" value="false" type="bool" description="Compute average (instead of monoisotopic) oligonucleotide masses" required="false" advanced="false" />
      <ITEM name="fragment_type" value="full" type="string" description="For what type of sequence/fragment the mass should be computed#br#" required="false" advanced="false" restrictions="full,internal,5-prime,3-prime,a-B-ion,a-ion,b-ion,c-ion,d-ion,w-ion,x-ion,y-ion,z-ion" />
      <ITEM name="separator" value="" type="string" description="Field separator for &apos;table&apos; output format; by default, the &apos;tab&apos; character is used" required="false" advanced="false" />
      <ITEM name="log" value="" type="string" description="Name of log file (created only when specified)" required="false" advanced="true" />
      <ITEM name="debug" value="0" type="int" description="Sets the debug level" required="false" advanced="true" />
      <ITEM name="threads" value="1" type="int" description="Sets the number of threads allowed to be used by the TOPP tool" required="false" advanced="false" />
      <ITEM name="no_progress" value="false" type="bool" description="Disables progress logging to command line" required="false" advanced="true" />
      <ITEM name="force" value="false" type="bool" description="Overrides tool-specific checks" required="false" advanced="true" />
      <ITEM name="test" value="false" type="bool" description="Enables the test mode (needed for internal use only)" required="false" advanced="true" />
    </NODE>
  </NODE>
</PARAMETERS>
