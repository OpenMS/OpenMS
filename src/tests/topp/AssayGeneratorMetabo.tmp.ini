<?xml version="1.0" encoding="ISO-8859-1"?>
<PARAMETERS version="1.8.0" xsi:noNamespaceSchemaLocation="https://raw.githubusercontent.com/OpenMS/OpenMS/develop/share/OpenMS/SCHEMAS/Param_1_8_0.xsd" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
  <NODE name="AssayGeneratorMetabo" description="Assay library generation from DDA data (Metabolomics)">
    <ITEM name="version" value="3.5.0-pre-nuc-dia-2025-07-24" type="string" description="Version of the tool that generated this parameters file." required="false" advanced="true" />
    <NODE name="1" description="Instance &apos;1&apos; section for &apos;AssayGeneratorMetabo&apos;">
      <ITEMLIST name="in" type="input-file" description="MzML input file(s) used for assay library generation" required="true" advanced="false" supported_formats="*.mzML">
      </ITEMLIST>
      <ITEMLIST name="in_featureinfo" type="input-file" description="FeatureXML input file(s) containing identification information (e.g. AccurateMassSearch)" required="true" advanced="false" supported_formats="*.featureXML">
      </ITEMLIST>
      <ITEM name="out" value="" type="output-file" description="Assay library output file" required="true" advanced="false" supported_formats="*.tsv,*.traML,*.pqp" />
      <ITEM name="ambiguity_resolution_mz_tolerance" value="10.0" type="double" description="Mz tolerance for the resolution of identification ambiguity over multiple files" required="false" advanced="false" />
      <ITEM name="ambiguity_resolution_mz_tolerance_unit" value="ppm" type="string" description="Unit of the ambiguity_resolution_mz_tolerance" required="false" advanced="true" restrictions="ppm,Da" />
      <ITEM name="ambiguity_resolution_rt_tolerance" value="10.0" type="double" description="RT tolerance in seconds for the resolution of identification ambiguity over multiple files" required="false" advanced="false" />
      <ITEM name="total_occurrence_filter" value="0.1" type="double" description="Filter compound based on total occurrence in analysed samples" required="false" advanced="false" restrictions="0.0:1.0" />
      <ITEM name="method" value="highest_intensity" type="string" description="Spectrum with the highest precursor intensity or a consensus spectrum is used for assay library construction (if no fragment annotation is used)." required="false" advanced="false" restrictions="highest_intensity,consensus_spectrum" />
      <ITEM name="exclude_ms2_precursor" value="false" type="bool" description="Excludes precursor in ms2 from transition list" required="false" advanced="false" />
      <ITEM name="use_known_unknowns" value="false" type="bool" description="Use features without identification information" required="false" advanced="false" />
      <ITEM name="min_transitions" value="3" type="int" description="Minimal number of transitions" required="false" advanced="false" />
      <ITEM name="max_transitions" value="6" type="int" description="Maximal number of transitions" required="false" advanced="false" />
      <ITEM name="cosine_similarity_threshold" value="0.98" type="double" description="Threshold for cosine similarity of MS2 spectra from the same precursor used in consensus spectrum creation" required="false" advanced="false" />
      <ITEM name="transition_threshold" value="5.0" type="double" description="Further transitions need at least x% of the maximum intensity (default 5%)" required="false" advanced="false" />
      <ITEM name="min_fragment_mz" value="0.0" type="double" description="Minimal m/z of a fragment ion choosen as a transition" required="false" advanced="true" />
      <ITEM name="max_fragment_mz" value="2000.0" type="double" description="Maximal m/z of a fragment ion choosen as a transition" required="false" advanced="true" />
      <ITEM name="precursor_mz_distance" value="1.0e-04" type="double" description="Max m/z distance of the precursor entries of two spectra to be merged in [Da]." required="false" advanced="false" />
      <ITEM name="precursor_recalibration_window" value="0.01" type="double" description="Tolerance window for precursor selection (Annotation of precursor mz and intensity)" required="false" advanced="true" />
      <ITEM name="precursor_recalibration_window_unit" value="Da" type="string" description="Unit of the precursor_mz_tolerance_annotation" required="false" advanced="true" restrictions="Da,ppm" />
      <ITEM name="precursor_consensus_spectrum_rt_tolerance" value="5.0" type="double" description="Tolerance window (left and right) for precursor selection [seconds], for consensus spectrum generation (only available without fragment annotation)" required="false" advanced="false" />
      <ITEM name="deisotoping_use_deisotoper" value="false" type="bool" description="Use Deisotoper (if no fragment annotation is used)" required="false" advanced="false" />
      <ITEM name="deisotoping_fragment_tolerance" value="1.0" type="double" description="Tolerance used to match isotopic peaks" required="false" advanced="false" />
      <ITEM name="deisotoping_fragment_unit" value="ppm" type="string" description="Unit of the fragment tolerance" required="false" advanced="false" restrictions="ppm,Da" />
      <ITEM name="deisotoping_min_charge" value="1" type="int" description="The minimum charge considered" required="false" advanced="false" restrictions="1:" />
      <ITEM name="deisotoping_max_charge" value="1" type="int" description="The maximum charge considered" required="false" advanced="false" restrictions="1:" />
      <ITEM name="deisotoping_min_isopeaks" value="2" type="int" description="The minimum number of isotopic peaks (at least 2) required for an isotopic cluster" required="false" advanced="false" restrictions="2:" />
      <ITEM name="deisotoping_max_isopeaks" value="3" type="int" description="The maximum number of isotopic peaks (at least 2) considered for an isotopic cluster" required="false" advanced="false" restrictions="3:" />
      <ITEM name="deisotoping_keep_only_deisotoped" value="false" type="bool" description="Only monoisotopic peaks of fragments with isotopic pattern are retained" required="false" advanced="false" />
      <ITEM name="deisotoping_annotate_charge" value="false" type="bool" description="Annotate the charge to the peaks" required="false" advanced="false" />
      <ITEM name="filter_by_num_masstraces" value="1" type="int" description="Number of mass traces each feature has to have to be included. To use this parameter, setting the feature_only flag is necessary" required="false" advanced="false" restrictions="1:" />
      <ITEM name="precursor_mz_tolerance" value="10.0" type="double" description="Tolerance window for precursor selection (Feature selection in regard to the precursor)" required="false" advanced="false" />
      <ITEM name="precursor_mz_tolerance_unit" value="ppm" type="string" description="Unit of the preprocessing_precursor_mz_tolerance" required="false" advanced="false" restrictions="ppm,Da" />
      <ITEM name="precursor_rt_tolerance" value="5.0" type="double" description="Tolerance window (left and right) for precursor selection [seconds]" required="false" advanced="false" />
      <ITEM name="feature_only" value="false" type="string" description="Uses the feature information from in_featureinfo to reduce the search space to MS2 associated with a feature" required="false" advanced="false" restrictions="false,true" />
      <ITEM name="log" value="" type="string" description="Name of log file (created only when specified)" required="false" advanced="true" />
      <ITEM name="debug" value="0" type="int" description="Sets the debug level" required="false" advanced="true" />
      <ITEM name="threads" value="1" type="int" description="Sets the number of threads allowed to be used by the TOPP tool" required="false" advanced="false" />
      <ITEM name="no_progress" value="false" type="bool" description="Disables progress logging to command line" required="false" advanced="true" />
      <ITEM name="force" value="false" type="bool" description="Overrides tool-specific checks" required="false" advanced="true" />
      <ITEM name="test" value="false" type="bool" description="Enables the test mode (needed for internal use only)" required="false" advanced="true" />
    </NODE>
  </NODE>
</PARAMETERS>
