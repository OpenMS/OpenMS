<?xml version="1.0" encoding="ISO-8859-1"?>
<PARAMETERS version="1.8.0" xsi:noNamespaceSchemaLocation="https://raw.githubusercontent.com/OpenMS/OpenMS/develop/share/OpenMS/SCHEMAS/Param_1_8_0.xsd" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
  <NODE name="PhosphoScoring" description="Scores potential phosphorylation sites in order to localize the most probable sites.">
    <ITEM name="version" value="3.5.0-pre-nuc-dia-2025-07-24" type="string" description="Version of the tool that generated this parameters file." required="false" advanced="true" />
    <NODE name="1" description="Instance &apos;1&apos; section for &apos;PhosphoScoring&apos;">
      <ITEM name="in" value="" type="input-file" description="Input file with MS/MS spectra" required="true" advanced="false" supported_formats="*.mzML" />
      <ITEM name="id" value="" type="input-file" description="Identification input file which contains a search against a concatenated sequence database" required="true" advanced="false" supported_formats="*.idXML" />
      <ITEM name="out" value="" type="output-file" description="Identification output annotated with phosphorylation scores" required="true" advanced="false" supported_formats="*.idXML" />
      <ITEM name="fragment_mass_tolerance" value="0.05" type="double" description="Fragment mass tolerance for spectrum comparisons" required="false" advanced="false" restrictions="0.0:" />
      <ITEM name="fragment_mass_unit" value="Da" type="string" description="Unit of fragment mass tolerance" required="false" advanced="false" restrictions="Da,ppm" />
      <ITEM name="max_peptide_length" value="40" type="int" description="Restrict scoring to peptides with a length no greater than this value (&apos;0&apos; for &apos;no restriction&apos;)" required="false" advanced="true" restrictions="0:" />
      <ITEM name="max_num_perm" value="16384" type="int" description="Maximum number of permutations a sequence can have to be processed (&apos;0&apos; for &apos;no restriction&apos;)" required="false" advanced="true" restrictions="0:" />
      <ITEM name="unambiguous_score" value="1000" type="int" description="Score to use for unambiguous assignments, where all sites on a peptide are phosphorylated. (Note: If a peptide is not phosphorylated at all, its score is set to &apos;-1&apos;.)" required="false" advanced="true" />
      <ITEM name="log" value="" type="string" description="Name of log file (created only when specified)" required="false" advanced="true" />
      <ITEM name="debug" value="0" type="int" description="Sets the debug level" required="false" advanced="true" />
      <ITEM name="threads" value="1" type="int" description="Sets the number of threads allowed to be used by the TOPP tool" required="false" advanced="false" />
      <ITEM name="no_progress" value="false" type="bool" description="Disables progress logging to command line" required="false" advanced="true" />
      <ITEM name="force" value="false" type="bool" description="Overrides tool-specific checks" required="false" advanced="true" />
      <ITEM name="test" value="false" type="bool" description="Enables the test mode (needed for internal use only)" required="false" advanced="true" />
    </NODE>
  </NODE>
</PARAMETERS>
