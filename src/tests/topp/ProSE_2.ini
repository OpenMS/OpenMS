<?xml version="1.0" encoding="ISO-8859-1"?>
<PARAMETERS version="1.7.0" xsi:noNamespaceSchemaLocation="https://raw.githubusercontent.com/OpenMS/OpenMS/develop/share/OpenMS/SCHEMAS/Param_1_7_0.xsd" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
  <NODE name="ProSE" description="Annotates bottom-up MS/MS spectra using ProSE.">
    <ITEM name="version" value="3.6.0" type="string" description="Version of the tool that generated this parameters file." required="false" advanced="true" />
    <NODE name="1" description="Instance &apos;1&apos; section for &apos;ProSE&apos;">
      <ITEM name="in" value="" type="input-file" description="input file " required="true" advanced="false" supported_formats="*.mzML" />
      <ITEM name="database" value="" type="input-file" description="input file " required="true" advanced="false" supported_formats="*.fasta" />
      <ITEMLIST name="out_idxml" type="output-file" description="output file " required="false" advanced="false" supported_formats="*.idXML">
      </ITEMLIST>
      <ITEM name="log" value="" type="string" description="Name of log file (created only when specified)" required="false" advanced="true" />
      <ITEM name="debug" value="0" type="int" description="Sets the debug level" required="false" advanced="true" />
      <ITEM name="threads" value="1" type="int" description="Sets the number of threads allowed to be used by the TOPP tool (0 = all available cores)" required="false" advanced="false" />
      <ITEM name="no_progress" value="false" type="bool" description="Disables progress logging to command line" required="false" advanced="true" />
      <ITEM name="force" value="false" type="bool" description="Overrides tool-specific checks" required="false" advanced="true" />
      <ITEM name="test" value="false" type="bool" description="Enables the test mode (needed for internal use only)" required="false" advanced="true" />
      <NODE name="Search" description="">
        <ITEM name="enzyme" value="Trypsin" type="string" description="The enzyme used for peptide digestion." required="false" advanced="false" />
        <ITEM name="decoys" value="false" type="bool" description="Should decoys be generated?" required="false" advanced="false" />
        <NODE name="precursor" description="Precursor (Parent Ion) Options">
          <ITEM name="mass_tolerance_lower" value="10.0" type="double" description="Lower-side precursor-mass tolerance (positive magnitude; effective window is [-lower, +upper])." required="false" advanced="false" />
          <ITEM name="mass_tolerance_upper" value="10.0" type="double" description="Upper-side precursor-mass tolerance (positive magnitude)." required="false" advanced="false" />
          <ITEM name="mass_tolerance_unit" value="ppm" type="string" description="Unit of precursor mass tolerance." required="false" advanced="false" restrictions="ppm,Da" />
          <ITEM name="min_charge" value="2" type="int" description="Minimum precursor charge to be considered." required="false" advanced="false" />
          <ITEM name="max_charge" value="5" type="int" description="Maximum precursor charge to be considered." required="false" advanced="false" />
          <ITEMLIST name="isotopes" type="int" description="Corrects for mono-isotopic peak misassignments. (E.g.: 1 = prec. may be misassigned to first isotopic peak)" required="false" advanced="false">
            <LISTITEM value="0"/>
            <LISTITEM value="1"/>
          </ITEMLIST>
        </NODE>
        <NODE name="fragment" description="Fragments (Product Ion) Options">
          <ITEM name="mass_tolerance" value="0.1" type="double" description="Fragment mass tolerance" required="false" advanced="false" />
          <ITEM name="mass_tolerance_unit" value="Da" type="string" description="Unit of fragment m" required="false" advanced="false" restrictions="ppm,Da" />
        </NODE>
        <NODE name="modifications" description="Modifications Options">
          <ITEMLIST name="fixed" type="string" description="Fixed modifications, specified using UniMod (www.unimod.org) terms, e.g. &apos;Carbamidomethyl (C)&apos;" required="false" advanced="false">
            <LISTITEM value="Carbamidomethyl (C)"/>
          </ITEMLIST>
          <ITEMLIST name="variable" type="string" description="Variable modifications, specified using UniMod (www.unimod.org) terms, e.g. &apos;Oxidation (M)&apos;" required="false" advanced="false">
            <LISTITEM value="Oxidation (M)"/>
          </ITEMLIST>
          <ITEM name="variable_max_per_peptide" value="2" type="int" description="Maximum number of residues carrying a variable modification per candidate peptide" required="false" advanced="false" />
        </NODE>
        <NODE name="annotate" description="Annotation Options">
          <ITEMLIST name="PSM" type="string" description="Annotations added to each PSM." required="false" advanced="false">
            <LISTITEM value="ALL"/>
          </ITEMLIST>
        </NODE>
        <NODE name="peptide" description="Peptide Options">
          <ITEM name="min_size" value="7" type="int" description="Minimum size a peptide must have after digestion to be considered in the search." required="false" advanced="false" />
          <ITEM name="max_size" value="40" type="int" description="Maximum size a peptide must have after digestion to be considered in the search (0 = disabled)." required="false" advanced="false" />
          <ITEM name="missed_cleavages" value="1" type="int" description="Number of missed cleavages." required="false" advanced="false" />
          <ITEM name="motif" value="" type="string" description="If set, only peptides that contain this motif (provided as RegEx) will be considered." required="false" advanced="false" />
        </NODE>
        <NODE name="report" description="Reporting Options">
          <ITEM name="top_hits" value="1" type="int" description="Maximum number of top scoring hits per spectrum that are reported." required="false" advanced="false" />
        </NODE>
      </NODE>
    </NODE>
  </NODE>
</PARAMETERS>