<?xml version="1.0" encoding="ISO-8859-1"?>
<PARAMETERS version="1.8.0" xsi:noNamespaceSchemaLocation="https://raw.githubusercontent.com/OpenMS/OpenMS/develop/share/OpenMS/SCHEMAS/Param_1_8_0.xsd" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
  <NODE name="SpectraSTSearchAdapter" description="Interface to the SEARCH Mode of the SpectraST executable">
    <ITEM name="version" value="3.5.0-pre-nuc-dia-2025-07-24" type="string" description="Version of the tool that generated this parameters file." required="false" advanced="true" />
    <NODE name="1" description="Instance &apos;1&apos; section for &apos;SpectraSTSearchAdapter&apos;">
      <ITEM name="executable" value="spectrast" type="input-file" description="Path to the SpectraST executable to use; may be empty if the executable is globally available." required="true" advanced="false" />
      <ITEMLIST name="spectra_files" type="input-file" description="File names(s) of spectra to be searched." required="true" advanced="false" supported_formats="*.mzML,*.mzXML,*.mzData,*.mgf,*.dta,*.msp">
      </ITEMLIST>
      <ITEMLIST name="output_files" type="output-file" description="Output files. Make sure to specify one output file for each input file" required="true" advanced="false" supported_formats="*.txt,*.tsv,*.xml,*.pepXML,*.html">
      </ITEMLIST>
      <ITEM name="library_file" value="" type="input-file" description="Specify library file." required="true" advanced="false" supported_formats="*.splib" />
      <ITEM name="sequence_database_file" value="" type="input-file" description="The sequence database." required="false" advanced="false" supported_formats="*.fasta" />
      <ITEM name="sequence_database_type" value="AA" type="string" description="Specify type of sequence database" required="false" advanced="false" restrictions="DNA,AA" />
      <ITEM name="search_file" value="" type="input-file" description="Only search a subset of the query spectra in the search file" required="false" advanced="false" supported_formats="*.txt,*. dat" />
      <ITEM name="params_file" value="" type="input-file" description="Read search options from file. All options set in the file will be overridden by command-line options, if specified." required="false" advanced="false" supported_formats="*.params" />
      <ITEM name="precursor_mz_tolerance" value="3.0" type="double" description="m/z (in Th) tolerance within which candidate entries are compared to the query. Monoisotopic mass is assumed." required="false" advanced="false" restrictions="0.0:" />
      <ITEM name="use_isotopically_averaged_mass" value="false" type="bool" description="Use isotopically averaged mass instead of monoisotopic mass" required="false" advanced="true" />
      <ITEM name="use_all_charge_states" value="false" type="bool" description="Search library spectra of all charge states, i.e., ignore specified charge state (if any) of the query spectrum" required="false" advanced="true" />
      <ITEM name="user_mod_file" value="" type="input-file" description="Specify name of user-defined modifications file. Default is &quot;spectrast.usermods&quot;." required="false" advanced="true" />
      <ITEM name="log" value="" type="string" description="Name of log file (created only when specified)" required="false" advanced="true" />
      <ITEM name="debug" value="0" type="int" description="Sets the debug level" required="false" advanced="true" />
      <ITEM name="threads" value="1" type="int" description="Sets the number of threads allowed to be used by the TOPP tool" required="false" advanced="false" />
      <ITEM name="no_progress" value="false" type="bool" description="Disables progress logging to command line" required="false" advanced="true" />
      <ITEM name="force" value="false" type="bool" description="Overrides tool-specific checks" required="false" advanced="true" />
      <ITEM name="test" value="false" type="bool" description="Enables the test mode (needed for internal use only)" required="false" advanced="true" />
    </NODE>
  </NODE>
</PARAMETERS>
