<?xml version="1.0" encoding="ISO-8859-1"?>
<PARAMETERS version="1.8.0" xsi:noNamespaceSchemaLocation="https://raw.githubusercontent.com/OpenMS/OpenMS/develop/share/OpenMS/SCHEMAS/Param_1_8_0.xsd" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
  <NODE name="ProteinInference" description="Protein inference based on an aggregation of the scores of the identified peptides.">
    <ITEM name="version" value="3.5.0-pre-nuc-dia-2025-07-24" type="string" description="Version of the tool that generated this parameters file." required="false" advanced="true" />
    <NODE name="1" description="Instance &apos;1&apos; section for &apos;ProteinInference&apos;">
      <ITEMLIST name="in" type="input-file" description="input file(s)" required="true" advanced="false" supported_formats="*.idXML,*.consensusXML">
      </ITEMLIST>
      <ITEM name="out" value="" type="output-file" description="output file" required="true" advanced="false" supported_formats="*.idXML,*.consensusXML" />
      <ITEM name="out_type" value="" type="string" description="output file type" required="false" advanced="false" restrictions="idXML,consensusXML" />
      <ITEM name="merge_runs" value="all" type="string" description="If your idXML contains multiple runs, merge them beforehand? Otherwise performs inference separately per run." required="false" advanced="false" restrictions="no,all" />
      <ITEM name="protein_fdr" value="false" type="bool" description="Additionally calculate the target-decoy FDR on protein-level after inference" required="false" advanced="false" />
      <ITEM name="conservative_fdr" value="true" type="string" description="Use (D+1)/(T) instead of (D+1)/(T+D) for reporting protein FDRs." required="false" advanced="true" restrictions="true,false" />
      <ITEM name="picked_fdr" value="true" type="string" description="Use picked protein FDRs." required="false" advanced="true" restrictions="true,false" />
      <ITEM name="picked_decoy_string" value="" type="string" description="If using picked protein FDRs, which decoy string was used? Leave blank for auto-detection." required="false" advanced="true" />
      <ITEM name="picked_decoy_prefix" value="prefix" type="string" description="If using picked protein FDRs, was the decoy string a prefix or suffix? Ignored during auto-detection." required="false" advanced="true" restrictions="prefix,suffix" />
      <ITEM name="log" value="" type="string" description="Name of log file (created only when specified)" required="false" advanced="true" />
      <ITEM name="debug" value="0" type="int" description="Sets the debug level" required="false" advanced="true" />
      <ITEM name="threads" value="1" type="int" description="Sets the number of threads allowed to be used by the TOPP tool" required="false" advanced="false" />
      <ITEM name="no_progress" value="false" type="bool" description="Disables progress logging to command line" required="false" advanced="true" />
      <ITEM name="force" value="false" type="bool" description="Overrides tool-specific checks" required="false" advanced="true" />
      <ITEM name="test" value="false" type="bool" description="Enables the test mode (needed for internal use only)" required="false" advanced="true" />
      <NODE name="Merging" description="">
        <ITEM name="annotate_origin" value="true" type="string" description="If true, adds a map_index MetaValue to the PeptideIDs to annotate the IDRun they came from." required="false" advanced="false" restrictions="true,false" />
        <ITEM name="allow_disagreeing_settings" value="false" type="bool" description="Force merging of disagreeing runs. Use at your own risk." required="false" advanced="false" />
      </NODE>
      <NODE name="Algorithm" description="">
        <ITEM name="min_peptides_per_protein" value="1" type="int" description="Minimal number of peptides needed for a protein identification. If set to zero, unmatched proteins get a score of -Infinity. If bigger than zero, proteins with less peptides are filtered and evidences removed from the PSMs. PSMs that do not reference any proteins anymore are removed but the spectrum info is kept." required="false" advanced="false" restrictions="0:" />
        <ITEM name="score_aggregation_method" value="best" type="string" description="How to aggregate scores of peptides matching to the same protein?" required="false" advanced="false" restrictions="best,product,sum,maximum" />
        <ITEM name="treat_charge_variants_separately" value="true" type="string" description="If this is true, different charge variants of the same peptide sequence count as individual evidences." required="false" advanced="false" restrictions="true,false" />
        <ITEM name="treat_modification_variants_separately" value="true" type="string" description="If this is true, different modification variants of the same peptide sequence count as individual evidences." required="false" advanced="false" restrictions="true,false" />
        <ITEM name="use_shared_peptides" value="true" type="string" description="If this is true, shared peptides are used as evidences. Note: shared_peptides are not deleted and potentially resolved in postprocessing as well." required="false" advanced="false" restrictions="true,false" />
        <ITEM name="skip_count_annotation" value="false" type="bool" description="If this is set, peptide counts won&apos;t be annotated at the proteins." required="false" advanced="false" />
        <ITEM name="annotate_indistinguishable_groups" value="true" type="string" description="If this is true, calculates and annotates indistinguishable protein groups." required="false" advanced="false" restrictions="true,false" />
        <ITEM name="greedy_group_resolution" value="false" type="bool" description="If this is true, shared peptides will be associated to best proteins only (i.e. become potentially quantifiable razor peptides)." required="false" advanced="false" />
        <ITEM name="score_type" value="" type="string" description="PSM score type to use for inference. (default: empty = main score)" required="false" advanced="false" restrictions=",PEP,q-value,RAW" />
      </NODE>
    </NODE>
  </NODE>
</PARAMETERS>
