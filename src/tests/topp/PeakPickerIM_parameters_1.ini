<?xml version="1.0" encoding="ISO-8859-1"?>
<PARAMETERS version="1.8.0" xsi:noNamespaceSchemaLocation="https://raw.githubusercontent.com/OpenMS/OpenMS/develop/share/OpenMS/SCHEMAS/Param_1_8_0.xsd" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
  <NODE name="PeakPickerIM" description="Applies PeakPickerIM to an mzML file">
    <ITEM name="version" value="3.5.0-pre-im-types-v2-2025-08-18" type="string" description="Version of the tool that generated this parameters file." required="false" advanced="true" />
    <NODE name="1" description="Instance &apos;1&apos; section for &apos;PeakPickerIM&apos;">
      <ITEM name="in" value="" type="input-file" description="Input mzML file" required="true" advanced="false" supported_formats="*.mzML" />
      <ITEM name="out" value="" type="output-file" description="Output mzML file" required="true" advanced="false" supported_formats="*.mzML" />
      <ITEM name="processOption" value="inmemory" type="string" description="Whether to load all data and process them in-memory or process on-the-fly (lowmemory) without loading the whole file into memory first" required="false" advanced="true" restrictions="inmemory,lowmemory" />
      <ITEM name="method" value="mobilogram" type="string" description="Method to pick peaks in IM dimension" required="false" advanced="true" restrictions="mobilogram,cluster,traces" />
      <ITEM name="log" value="" type="string" description="Name of log file (created only when specified)" required="false" advanced="true" />
      <ITEM name="debug" value="0" type="int" description="Sets the debug level" required="false" advanced="true" />
      <ITEM name="threads" value="1" type="int" description="Sets the number of threads allowed to be used by the TOPP tool" required="false" advanced="false" />
      <ITEM name="no_progress" value="false" type="bool" description="Disables progress logging to command line" required="false" advanced="true" />
      <ITEM name="force" value="false" type="bool" description="Overrides tool-specific checks" required="false" advanced="true" />
      <ITEM name="test" value="false" type="bool" description="Enables the test mode (needed for internal use only)" required="false" advanced="true" />
      <NODE name="algorithm" description="Algorithm parameters for PeakPickerIM (organized into pickIMTraces, pickIMCluster, pickIMElutionProfiles).">
        <NODE name="pickIMTraces" description="">
          <ITEM name="sum_tolerance_mz" value="1.0" type="double" description="Tolerance for summing adjacent m/z peaks (ppm)" required="false" advanced="false" />
          <ITEM name="gauss_ppm_tolerance" value="5.0" type="double" description="Gaussian smoothing m/z tolerance in ppm" required="false" advanced="false" />
          <ITEM name="sum_tolerance_im" value="6.0e-04" type="double" description="Tolerance for summing adjacent ion mobility peaks (1/k0)" required="false" advanced="false" />
          <ITEM name="sgolay_frame_length" value="5" type="int" description="Savitzky-Golay smoothing frame length" required="false" advanced="false" />
          <ITEM name="sgolay_polynomial_order" value="3" type="int" description="Savitzky-Golay smoothing polynomial order" required="false" advanced="false" />
        </NODE>
        <NODE name="pickIMCluster" description="">
          <ITEM name="ppm_tolerance_cluster" value="50.0" type="double" description="m/z tolerance in ppm for clustering" required="false" advanced="false" />
          <ITEM name="im_tolerance_cluster" value="0.1" type="double" description="Ion mobility tolerance in 1/k for clustering" required="false" advanced="false" />
        </NODE>
        <NODE name="pickIMElutionProfiles" description="">
          <ITEM name="ppm_tolerance_elution" value="50.0" type="double" description="Mass trace m/z tolerance in ppm" required="false" advanced="false" />
        </NODE>
      </NODE>
    </NODE>
  </NODE>
</PARAMETERS>
