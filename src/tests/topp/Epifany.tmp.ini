<?xml version="1.0" encoding="ISO-8859-1"?>
<PARAMETERS version="1.8.0" xsi:noNamespaceSchemaLocation="https://raw.githubusercontent.com/OpenMS/OpenMS/develop/share/OpenMS/SCHEMAS/Param_1_8_0.xsd" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
  <NODE name="Epifany" description="Runs a Bayesian protein inference.">
    <ITEM name="version" value="3.5.0-pre-nuc-dia-2025-07-24" type="string" description="Version of the tool that generated this parameters file." required="false" advanced="true" />
    <NODE name="1" description="Instance &apos;1&apos; section for &apos;Epifany&apos;">
      <ITEMLIST name="in" type="input-file" description="Input: identification results" required="true" advanced="false" supported_formats="*.idXML,*.consensusXML">
      </ITEMLIST>
      <ITEM name="exp_design" value="" type="input-file" description="(Currently unused) Input: experimental design" required="false" advanced="false" supported_formats="*.tsv" />
      <ITEM name="out" value="" type="output-file" description="Output: identification results with scored/grouped proteins" required="true" advanced="false" supported_formats="*.idXML,*.consensusXML" />
      <ITEM name="out_type" value="" type="string" description="Output type: auto detected by file extension but can be overwritten here." required="false" advanced="false" restrictions="idXML,consensusXML" />
      <ITEM name="protein_fdr" value="false" type="bool" description="Additionally calculate the target-decoy FDR on protein-level based on the posteriors" required="false" advanced="false" />
      <ITEM name="conservative_fdr" value="true" type="string" description="Use (D+1)/(T) instead of (D+1)/(T+D) for reporting protein FDRs." required="false" advanced="true" restrictions="true,false" />
      <ITEM name="picked_fdr" value="true" type="string" description="Use picked protein FDRs." required="false" advanced="true" restrictions="true,false" />
      <ITEM name="picked_decoy_string" value="" type="string" description="If using picked protein FDRs, which decoy string was used? Leave blank for auto-detection." required="false" advanced="true" />
      <ITEM name="picked_decoy_prefix" value="prefix" type="string" description="If using picked protein FDRs, was the decoy string a prefix or suffix? Ignored during auto-detection." required="false" advanced="true" restrictions="prefix,suffix" />
      <ITEM name="greedy_group_resolution" value="none" type="string" description="Post-process inference output with greedy resolution of shared peptides based on the parent protein probabilities. Also adds the resolved ambiguity groups to output." required="false" advanced="false" restrictions="none,remove_associations_only,remove_proteins_wo_evidence" />
      <ITEM name="min_psms_extreme_probability" value="0.0" type="double" description="Set PSMs with probability lower than this to this minimum probability." required="false" advanced="true" />
      <ITEM name="max_psms_extreme_probability" value="1.0" type="double" description="Set PSMs with probability higher than this to this maximum probability." required="false" advanced="false" />
      <ITEM name="log" value="" type="string" description="Name of log file (created only when specified)" required="false" advanced="true" />
      <ITEM name="debug" value="0" type="int" description="Sets the debug level" required="false" advanced="true" />
      <ITEM name="threads" value="1" type="int" description="Sets the number of threads allowed to be used by the TOPP tool" required="false" advanced="false" />
      <ITEM name="no_progress" value="false" type="bool" description="Disables progress logging to command line" required="false" advanced="true" />
      <ITEM name="force" value="false" type="bool" description="Overrides tool-specific checks" required="false" advanced="true" />
      <ITEM name="test" value="false" type="bool" description="Enables the test mode (needed for internal use only)" required="false" advanced="true" />
      <NODE name="algorithm" description="Parameters for the Algorithm section">
        <ITEM name="psm_probability_cutoff" value="1.0e-03" type="double" description="Remove PSMs with probabilities less than this cutoff" required="false" advanced="false" restrictions="0.0:1.0" />
        <ITEM name="top_PSMs" value="1" type="int" description="Consider only top X PSMs per spectrum. 0 considers all." required="false" advanced="false" restrictions="0:" />
        <ITEM name="keep_best_PSM_only" value="true" type="string" description="Epifany uses the best PSM per peptide for inference. Discard the rest (true) or keepe.g. for quantification/reporting?" required="false" advanced="false" restrictions="true,false" />
        <ITEM name="update_PSM_probabilities" value="true" type="string" description="(Experimental:) Update PSM probabilities with their posteriors under consideration of the protein probabilities." required="false" advanced="false" restrictions="true,false" />
        <ITEM name="user_defined_priors" value="false" type="bool" description="(Experimental:) Uses the current protein scores as user-defined priors." required="false" advanced="false" />
        <ITEM name="annotate_group_probabilities" value="true" type="string" description="Annotates group probabilities for indistinguishable protein groups (indistinguishable by experimentally observed PSMs)." required="false" advanced="false" restrictions="true,false" />
        <ITEM name="use_ids_outside_features" value="false" type="bool" description="(Only consensusXML) Also use IDs without associated features for inference?" required="false" advanced="false" />
        <NODE name="model_parameters" description="Model parameters for the Bayesian network">
          <ITEM name="prot_prior" value="-1.0" type="double" description="Protein prior probability (&apos;gamma&apos; parameter). Negative values enable grid search for this param." required="false" advanced="false" restrictions="-1.0:1.0" />
          <ITEM name="pep_emission" value="-1.0" type="double" description="Peptide emission probability (&apos;alpha&apos; parameter). Negative values enable grid search for this param." required="false" advanced="false" restrictions="-1.0:1.0" />
          <ITEM name="pep_spurious_emission" value="-1.0" type="double" description="Spurious peptide identification probability (&apos;beta&apos; parameter). Usually much smaller than emission from proteins. Negative values enable grid search for this param." required="false" advanced="false" restrictions="-1.0:1.0" />
          <ITEM name="pep_prior" value="0.1" type="double" description="Peptide prior probability (experimental, should be covered by combinations of the other params)." required="false" advanced="false" restrictions="0.0:1.0" />
          <ITEM name="regularize" value="false" type="bool" description="Regularize the number of proteins that produce a peptide together (experimental, should be activated when using higher p-norms)." required="false" advanced="false" />
          <ITEM name="extended_model" value="false" type="bool" description="Uses information from different peptidoforms also across runs (automatically activated if an experimental design is given!)" required="false" advanced="false" />
        </NODE>
        <NODE name="loopy_belief_propagation" description="Settings for the loopy belief propagation algorithm.">
          <ITEM name="scheduling_type" value="priority" type="string" description="(Not used yet) How to pick the next message: priority = based on difference to last message (higher = more important). fifo = first in first out. subtree = message passing follows a random spanning tree in each iteration" required="false" advanced="false" restrictions="priority,fifo,subtree" />
          <ITEM name="convergence_threshold" value="1.0e-05" type="double" description="Initial threshold under which MSE difference a message is considered to be converged." required="false" advanced="false" restrictions="1.0e-09:1.0" />
          <ITEM name="dampening_lambda" value="1.0e-03" type="double" description="Initial value for how strongly should messages be updated in each step. 0 = new message overwrites old completely (no dampening; only recommended for trees),0.5 = equal contribution of old and new message (stay below that),In-between it will be a convex combination of both. Prevents oscillations but hinders convergence." required="false" advanced="false" restrictions="0.0:0.49999" />
          <ITEM name="max_nr_iterations" value="2147483647" type="int" description="(Usually auto-determined by estimated but you can set a hard limit here). If not all messages converge, how many iterations should be done at max per connected component?" required="false" advanced="false" />
          <ITEM name="p_norm_inference" value="1.0" type="double" description="P-norm used for marginalization of multidimensional factors. 1 == sum-product inference (all configurations vote equally) (default),&lt;= 0 == infinity = max-product inference (only best configurations propagate)The higher the value the more important high probability configurations get." required="false" advanced="false" />
        </NODE>
        <NODE name="param_optimize" description="Settings for the parameter optimization.">
          <ITEM name="aucweight" value="0.3" type="double" description="How important is target decoy AUC vs calibration of the posteriors? 0 = maximize calibration only, 1 = maximize AUC only, between = convex combination." required="false" advanced="false" restrictions="0.0:1.0" />
          <ITEM name="conservative_fdr" value="true" type="string" description="Use (D+1)/(T) instead of (D+1)/(T+D) for parameter estimation." required="false" advanced="false" restrictions="true,false" />
          <ITEM name="regularized_fdr" value="true" type="string" description="Use a regularized FDR for proteins without unique peptides." required="false" advanced="false" restrictions="true,false" />
        </NODE>
      </NODE>
    </NODE>
  </NODE>
</PARAMETERS>
