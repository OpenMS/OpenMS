<?xml version="1.0" encoding="ISO-8859-1"?>
<PARAMETERS version="1.8.0" xsi:noNamespaceSchemaLocation="https://raw.githubusercontent.com/OpenMS/OpenMS/develop/share/OpenMS/SCHEMAS/Param_1_8_0.xsd" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
  <NODE name="FLASHDeconv" description="Ultra-fast high-quality deconvolution enables online processing of top-down MS data">
    <ITEM name="version" value="3.5.0-pre-nuc-dia-2025-07-24" type="string" description="Version of the tool that generated this parameters file." required="false" advanced="true" />
    <NODE name="1" description="Instance &apos;1&apos; section for &apos;FLASHDeconv&apos;">
      <ITEM name="in" value="" type="input-file" description="Input file (mzML)" required="true" advanced="false" supported_formats="*.mzML" />
      <ITEM name="in_log" value="" type="string" description="log file generated by FLASHIda (IDA*.log). Only needed for coupling with FLASHIda acquisition" required="false" advanced="true" />
      <ITEM name="out" value="" type="output-file" description="Default output tsv file containing deconvolved features" required="true" advanced="false" supported_formats="*.tsv" />
      <ITEMLIST name="out_spec" type="output-file" description="Output tsv files containing deconvolved spectra (per MS level)" required="false" advanced="false" supported_formats="*.tsv">
        <LISTITEM value=""/>
      </ITEMLIST>
      <ITEM name="out_mzml" value="" type="output-file" description="Output mzml file containing deconvolved spectra (of all MS levels)" required="false" advanced="false" supported_formats="*.mzML" />
      <ITEM name="out_annotated_mzml" value="" type="output-file" description="Output mzml file containing annotated spectra. For each annotated peak, monoisotopic mass, charge, and isotope index are stored as meta data. Unannotated peaks are also copied as well without meta data." required="false" advanced="false" supported_formats="*.mzML" />
      <ITEM name="out_promex" value="" type="output-file" description="Output ms1ft (promex compatible) file containing deconvolved spectra. Only for MS1 level" required="false" advanced="false" supported_formats="*.ms1ft" />
      <ITEMLIST name="out_topFD" type="output-file" description="Output msalign (topFD compatible) files containing deconvolved spectra (per MS level). The file name for MSn should end with msn.msalign to be able to be recognized by TopPIC GUI. For example, -out_topFD [name]_ms1.msalign [name]_ms2.msalign" required="false" advanced="false" supported_formats="*.msalign">
        <LISTITEM value=""/>
      </ITEMLIST>
      <ITEMLIST name="out_topFD_feature" type="output-file" description="Output feature (topFD compatible) files containing deconvolved features (per MS level). The feature files are necessary for TopPIC feature intensity output" required="false" advanced="false" supported_formats="*.feature">
        <LISTITEM value=""/>
      </ITEMLIST>
      <ITEM name="min_precursor_snr" value="1.0" type="double" description="Minimum precursor SNR (SNR within the precursor envelope range) for identification. Similar to precursor interference level, but far more stringent as it also considers the isotope distribution shape of signal.When FLASHIda log file is used, this parameter is ignored. Applied only for topFD msalign outputs." required="false" advanced="false" />
      <ITEM name="target_precursor_charge" value="0" type="int" description="Charge state of the target precursor. All precursor charge is fixed to this value. This parameter is useful for targeted studies where MS2 spectra are generated from a fixed precursor (e.g., Native-MS). This option also gives the maximum charge and masses (together with precursor m/z) of fragment ions, which overrides -Algorithm:max_charge and -Algorithm:max_mass." required="false" advanced="false" />
      <ITEM name="target_precursor_mz" value="0.0" type="double" description="Target precursor m/z value. This option must be used with -target_precursor_charge option. Otherwise it will be ignored. If -target_precursor_charge option is used but this option is not used, the precursor m/z value written in MS2 spectra will be used by default. Together with -target_precursor_charge, this option overrides -Algorithm:max_mass." required="false" advanced="false" />
      <ITEM name="mzml_mass_charge" value="0" type="int" description="Charge state of deconvolved masses in mzml output (specified by out_mzml)" required="false" advanced="false" restrictions="-1:1" />
      <ITEM name="preceding_MS1_count" value="3" type="int" description="Specifies the number of preceding MS1 spectra for MS2 precursor determination. In TDP, the precursor peak of a MS2 spectrum may not belong to any deconvolved masses in the MS1 spectrum immediately preceding the MS2 spectrum. Increasing this parameter to N allows for the search for the deconvolved masses in the N preceding MS1 spectra from the MS2 spectrum, increasing the chance that its precursor is deconvolved." required="false" advanced="false" restrictions="1:" />
      <ITEM name="write_detail" value="0" type="int" description="To write peak information per deconvolved mass in detail or not in tsv files for deconvolved spectra. If set to 1, all peak information (m/z, intensity, charge and isotope index) per mass is reported." required="false" advanced="false" restrictions="0:1" />
      <ITEM name="max_MS_level" value="3" type="int" description="Maximum MS level (inclusive) for deconvolution." required="false" advanced="true" restrictions="1:" />
      <ITEM name="forced_MS_level" value="0" type="int" description="If set to an integer N, MS level of all spectra will be set to N regardless of original MS level. Useful when deconvolving datasets containing only MS2 spectra." required="false" advanced="true" restrictions="0:" />
      <ITEM name="merging_method" value="0" type="int" description="Method for spectra merging before deconvolution. 0: No merging 1: Average gaussian method to perform moving gaussian averaging of spectra per MS level. Effective to increase proteoform ID sensitivity (in particular for Q-TOF datasets). 2: Block method to perform merging of all spectra into a single one per MS level (e.g., for NativeMS datasets)" required="false" advanced="false" restrictions="0:2" />
      <ITEM name="report_FDR" value="0" type="int" description="Report qvalues (roughly, point-wise FDR) for deconvolved masses in the tsv files for deconvolved spectra. Dummy masses to calculate qvalues and FDR are also reported. Beta version." required="false" advanced="false" restrictions="0:1" />
      <ITEM name="use_RNA_averagine" value="0" type="int" description="If set to 1, RNA averagine model is used" required="false" advanced="true" restrictions="0:1" />
      <ITEM name="log" value="" type="string" description="Name of log file (created only when specified)" required="false" advanced="true" />
      <ITEM name="debug" value="0" type="int" description="Sets the debug level" required="false" advanced="true" />
      <ITEM name="threads" value="1" type="int" description="Sets the number of threads allowed to be used by the TOPP tool" required="false" advanced="false" />
      <ITEM name="no_progress" value="false" type="bool" description="Disables progress logging to command line" required="false" advanced="true" />
      <ITEM name="force" value="false" type="bool" description="Overrides tool-specific checks" required="false" advanced="true" />
      <ITEM name="test" value="false" type="bool" description="Enables the test mode (needed for internal use only)" required="false" advanced="true" />
      <NODE name="Algorithm" description="">
        <ITEMLIST name="tol" type="double" description="ppm tolerance for MS1, MS2, ... " required="false" advanced="false">
          <LISTITEM value="10"/>
          <LISTITEM value="10"/>
          <LISTITEM value="10"/>
        </ITEMLIST>
        <ITEM name="min_mass" value="50.0" type="double" description="Minimum mass (Da)" required="false" advanced="false" />
        <ITEM name="max_mass" value="1.0e05" type="double" description="Maximum mass (Da)" required="false" advanced="false" />
        <ITEM name="min_charge" value="1" type="int" description="Minimum charge state for MS1 spectra (can be negative for negative mode)" required="false" advanced="false" />
        <ITEM name="max_charge" value="100" type="int" description="Maximum charge state for MS1 spectra (can be negative for negative mode)" required="false" advanced="false" />
        <ITEM name="min_mz" value="-1.0" type="double" description="If set to positive value, minimum m/z to deconvolve." required="false" advanced="true" />
        <ITEM name="max_mz" value="-1.0" type="double" description="If set to positive value, maximum m/z to deconvolve." required="false" advanced="true" />
        <ITEM name="min_rt" value="-1.0" type="double" description="If set to positive value, minimum RT to deconvolve." required="false" advanced="true" />
        <ITEM name="max_rt" value="-1.0" type="double" description="If set to positive value, maximum RT to deconvolve." required="false" advanced="true" />
        <ITEM name="isolation_window" value="5.0" type="double" description="Default isolation window with. If the input mzML file does not contain isolation window width information, this width will be used." required="false" advanced="true" />
        <ITEMLIST name="min_isotope_cosine" type="double" description="Cosine similarity thresholds between avg. and observed isotope patterns for MS1, 2, ... (e.g., -min_isotope_cosine 0.8 0.6 to specify 0.8 and 0.6 for MS1 and MS2, respectively)" required="false" advanced="false">
          <LISTITEM value="0.85"/>
          <LISTITEM value="0.85"/>
          <LISTITEM value="0.85"/>
        </ITEMLIST>
        <ITEM name="allowed_isotope_error" value="1" type="int" description="Allowed isotope index error for decoy and qvalue report. If it is set to 1, for example, +-1 isotope errors are not counted as false. Beta version." required="false" advanced="true" />
        <ITEM name="min_intensity" value="0.0" type="double" description="Intensity threshold" required="false" advanced="true" />
      </NODE>
      <NODE name="FeatureTracing" description="">
        <ITEM name="mass_error_ppm" value="-1.0" type="double" description="Feature tracing mass ppm tolerance. When negative, MS1 tolerance for mass deconvolution will be used (e.g., 16 ppm is used when -Algorithm:tol 16)." required="false" advanced="false" />
        <ITEM name="quant_method" value="area" type="string" description="Method of quantification for mass traces. For LC data &apos;area&apos; is recommended, &apos;median&apos; for direct injection data. &apos;max_height&apos; simply uses the most intense peak in the trace." required="false" advanced="true" restrictions="area,median,max_height" />
        <ITEM name="min_sample_rate" value="0.05" type="double" description="Minimum fraction of scans along the feature trace that must contain a peak. To raise feature detection sensitivity, lower this value close to 0." required="false" advanced="false" />
        <ITEM name="min_trace_length" value="10.0" type="double" description="Minimum expected length of a mass trace (in seconds)." required="false" advanced="false" />
        <ITEM name="max_trace_length" value="-1.0" type="double" description="Maximum expected length of a mass trace (in seconds). Set to a negative value to disable maximal length check during mass trace detection." required="false" advanced="true" />
        <ITEM name="min_isotope_cosine" value="-1.0" type="double" description="Cosine similarity threshold between avg. and observed isotope pattern for mass features. if not set, controlled by -Algorithm:min_isotope_cosine_ option" required="false" advanced="true" />
      </NODE>
    </NODE>
  </NODE>
</PARAMETERS>
