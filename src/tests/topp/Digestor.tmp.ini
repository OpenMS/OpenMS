<?xml version="1.0" encoding="ISO-8859-1"?>
<PARAMETERS version="1.8.0" xsi:noNamespaceSchemaLocation="https://raw.githubusercontent.com/OpenMS/OpenMS/develop/share/OpenMS/SCHEMAS/Param_1_8_0.xsd" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
  <NODE name="Digestor" description="Digests a protein database in-silico.">
    <ITEM name="version" value="3.5.0-pre-nuc-dia-2025-07-24" type="string" description="Version of the tool that generated this parameters file." required="false" advanced="true" />
    <NODE name="1" description="Instance &apos;1&apos; section for &apos;Digestor&apos;">
      <ITEM name="in" value="" type="input-file" description="input file" required="true" advanced="false" supported_formats="*.fasta" />
      <ITEM name="out" value="" type="output-file" description="Output file (peptides)" required="true" advanced="false" supported_formats="*.idXML,*.fasta" />
      <ITEM name="out_type" value="" type="string" description="Set this if you cannot control the filename of &apos;out&apos;, e.g., in TOPPAS." required="false" advanced="false" restrictions="idXML,fasta" />
      <ITEM name="missed_cleavages" value="1" type="int" description="The number of allowed missed cleavages" required="false" advanced="false" restrictions="0:" />
      <ITEM name="min_length" value="6" type="int" description="Minimum length of peptide" required="false" advanced="false" />
      <ITEM name="max_length" value="40" type="int" description="Maximum length of peptide" required="false" advanced="false" />
      <ITEM name="enzyme" value="Trypsin" type="string" description="The type of digestion enzyme" required="false" advanced="false" restrictions="glutamyl endopeptidase,Alpha-lytic protease,no cleavage,unspecific cleavage,Trypsin,Arg-C,Arg-C/P,Asp-N,Asp-N/B,Glu-C+P,PepsinA + P,cyanogen-bromide,Clostripain/P,elastase-trypsin-chymotrypsin,Asp-N_ambic,Chymotrypsin,Chymotrypsin/P,CNBr,Formic_acid,Lys-C,Lys-N,Lys-C/P,PepsinA,TrypChymo,Trypsin/P,V8-DE,V8-E,leukocyte elastase,proline endopeptidase,2-iodobenzoate,iodosobenzoate,staphylococcal protease/D,proline-endopeptidase/HKR" />
      <ITEM name="log" value="" type="string" description="Name of log file (created only when specified)" required="false" advanced="true" />
      <ITEM name="debug" value="0" type="int" description="Sets the debug level" required="false" advanced="true" />
      <ITEM name="threads" value="1" type="int" description="Sets the number of threads allowed to be used by the TOPP tool" required="false" advanced="false" />
      <ITEM name="no_progress" value="false" type="bool" description="Disables progress logging to command line" required="false" advanced="true" />
      <ITEM name="force" value="false" type="bool" description="Overrides tool-specific checks" required="false" advanced="true" />
      <ITEM name="test" value="false" type="bool" description="Enables the test mode (needed for internal use only)" required="false" advanced="true" />
      <NODE name="FASTA" description="Options for FASTA output files">
        <ITEM name="ID" value="parent" type="string" description="Identifier to use for each peptide: copy from parent protein (parent); a consecutive number (number); parent ID + consecutive number (both)" required="false" advanced="false" restrictions="parent,number,both" />
        <ITEM name="description" value="remove" type="string" description="Keep or remove the (possibly lengthy) FASTA header description. Keeping it can increase resulting FASTA file significantly." required="false" advanced="false" restrictions="remove,keep" />
      </NODE>
    </NODE>
  </NODE>
</PARAMETERS>
