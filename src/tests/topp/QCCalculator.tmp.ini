<?xml version="1.0" encoding="ISO-8859-1"?>
<PARAMETERS version="1.8.0" xsi:noNamespaceSchemaLocation="https://raw.githubusercontent.com/OpenMS/OpenMS/develop/share/OpenMS/SCHEMAS/Param_1_8_0.xsd" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
  <NODE name="QCCalculator" description="Calculates basic quality parameters from MS experiments and subsequent analysis data as identification or feature detection.">
    <ITEM name="version" value="3.5.0-pre-nuc-dia-2025-07-24" type="string" description="Version of the tool that generated this parameters file." required="false" advanced="true" />
    <NODE name="1" description="Instance &apos;1&apos; section for &apos;QCCalculator&apos;">
      <ITEM name="in" value="" type="input-file" description="raw data input file (this is relevant if you want to look at MS1, MS2 and precursor peak information)" required="true" advanced="false" supported_formats="*.mzML" />
      <ITEM name="out" value="" type="output-file" description="Your QC file." required="true" advanced="false" supported_formats="*.mzQC,*.qcML" />
      <ITEM name="out_type" value="" type="string" description="Output file type -- default: determined from file extension or content" required="false" advanced="false" restrictions="mzQC,qcML" />
      <ITEM name="label" value="label" type="string" description="unique name for the run that can be used in a figure label" required="false" advanced="false" />
      <ITEM name="name" value="" type="string" description="name of the person creating this mzQC file" required="false" advanced="false" />
      <ITEM name="address" value="" type="string" description="contact address (mail/e-mail or phone)" required="false" advanced="false" />
      <ITEM name="description" value="" type="string" description="description and comments about the mzQC file contents" required="false" advanced="false" />
      <ITEM name="id" value="" type="input-file" description="Input idXML file containing the identifications. Your identifications will be exported in an easy-to-read format" required="false" advanced="false" supported_formats="*.idXML" />
      <ITEM name="feature" value="" type="input-file" description="feature input file (this is relevant for most QC issues)" required="false" advanced="false" supported_formats="*.featureXML" />
      <ITEM name="consensus" value="" type="input-file" description="consensus input file (this is only used for charge state deconvoluted output. Use the consensusXML output form the DeCharger)" required="false" advanced="false" supported_formats="*.consensusXML" />
      <ITEM name="remove_duplicate_features" value="false" type="bool" description="This flag should be set, if you work with a set of merged features." required="false" advanced="false" />
      <ITEM name="log" value="" type="string" description="Name of log file (created only when specified)" required="false" advanced="true" />
      <ITEM name="debug" value="0" type="int" description="Sets the debug level" required="false" advanced="true" />
      <ITEM name="threads" value="1" type="int" description="Sets the number of threads allowed to be used by the TOPP tool" required="false" advanced="false" />
      <ITEM name="no_progress" value="false" type="bool" description="Disables progress logging to command line" required="false" advanced="true" />
      <ITEM name="force" value="false" type="bool" description="Overrides tool-specific checks" required="false" advanced="true" />
      <ITEM name="test" value="false" type="bool" description="Enables the test mode (needed for internal use only)" required="false" advanced="true" />
    </NODE>
  </NODE>
</PARAMETERS>
