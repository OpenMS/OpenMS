<?xml version="1.0" encoding="ISO-8859-1"?>
<PARAMETERS version="1.8.0" xsi:noNamespaceSchemaLocation="https://raw.githubusercontent.com/OpenMS/OpenMS/develop/share/OpenMS/SCHEMAS/Param_1_8_0.xsd" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
  <NODE name="SemanticValidator" description="SemanticValidator for semantically validating certain XML files.">
    <ITEM name="version" value="3.5.0-pre-nuc-dia-2025-07-24" type="string" description="Version of the tool that generated this parameters file." required="false" advanced="true" />
    <NODE name="1" description="Instance &apos;1&apos; section for &apos;SemanticValidator&apos;">
      <ITEM name="in" value="" type="input-file" description="Input file (any xml file)" required="true" advanced="false" supported_formats="*.analysisXML,*.mzML,*.traML,*.mzid,*.mzData,*.xml" />
      <ITEM name="mapping_file" value="" type="input-file" description="Mapping file which is used to semantically validate the given XML file against this mapping file (see &apos;share/OpenMS/MAPPING&apos; for templates)." required="true" advanced="false" supported_formats="*.xml" />
      <ITEMLIST name="cv" type="input-file" description="Controlled Vocabulary files containg the CV terms (if left empty, a set of default files are used)" required="false" advanced="false" supported_formats="*.obo">
