<?xml version="1.0" encoding="ISO-8859-1"?>
<PARAMETERS version="1.8.0" xsi:noNamespaceSchemaLocation="https://raw.githubusercontent.com/OpenMS/OpenMS/develop/share/OpenMS/SCHEMAS/Param_1_8_0.xsd" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
  <NODE name="FeatureLinkerWNet" description="Groups corresponding features from multiple maps using Wasserstein optimal transport.">
    <ITEM name="version" value="3.6.0-pre-wnetalign-2026-03-25" type="string" description="Version of the tool that generated this parameters file." required="false" advanced="true" />
    <NODE name="1" description="Instance &apos;1&apos; section for &apos;FeatureLinkerWNet&apos;">
      <ITEMLIST name="in" type="input-file" description="input files separated by blanks" required="true" advanced="false" supported_formats="*.featureXML,*.consensusXML">
      </ITEMLIST>
      <ITEM name="out" value="" type="output-file" description="Output file" required="true" advanced="false" supported_formats="*.consensusXML" />
      <ITEM name="design" value="" type="input-file" description="input file containing the experimental design" required="false" advanced="false" supported_formats="*.tsv" />
      <ITEM name="keep_subelements" value="false" type="bool" description="For consensusXML input only: If set, the sub-features of the inputs are transferred to the output." required="false" advanced="false" />
      <ITEM name="log" value="" type="string" description="Name of log file (created only when specified)" required="false" advanced="true" />
      <ITEM name="debug" value="0" type="int" description="Sets the debug level" required="false" advanced="true" />
      <ITEM name="threads" value="1" type="int" description="Sets the number of threads allowed to be used by the TOPP tool" required="false" advanced="false" />
      <ITEM name="no_progress" value="false" type="bool" description="Disables progress logging to command line" required="false" advanced="true" />
      <ITEM name="force" value="false" type="bool" description="Overrides tool-specific checks" required="false" advanced="true" />
      <ITEM name="test" value="false" type="bool" description="Enables the test mode (needed for internal use only)" required="false" advanced="true" />
      <NODE name="algorithm" description="Algorithm parameters section">
        <ITEM name="distance_metric" value="LINF" type="string" description="Distance metric for comparing feature positions" required="false" advanced="true" restrictions="L1,L2,LINF" />
        <ITEM name="max_rt_shift" value="100.0" type="double" description="Maximum allowed RT difference (in seconds) for matching features." required="false" advanced="false" restrictions="0.0:" />
        <ITEM name="mz_unit" value="ppm" type="string" description="Unit for the m/z tolerance. 'Da' uses max_mz_shift_da; 'ppm' uses max_mz_shift_ppm and log-transforms the m/z axis." required="false" advanced="false" restrictions="Da,ppm" />
        <ITEM name="max_mz_shift_da" value="0.3" type="double" description="Maximum allowed m/z difference in Daltons. Used when mz_unit is 'Da'." required="false" advanced="false" restrictions="0.0:" />
        <ITEM name="max_mz_shift_ppm" value="10.0" type="double" description="Maximum allowed m/z difference in ppm. Used when mz_unit is 'ppm'." required="false" advanced="false" restrictions="0.0:" />
        <ITEM name="trash_cost" value="0.0" type="double" description="Cost of leaving a feature unmatched (in seconds). Set to 0 to auto-derive from max_rt_shift (a match at the boundary costs the same as no match). Increase to prefer matching over leaving features unmatched." required="false" advanced="true" restrictions="0.0:" />
        <ITEM name="normalize_intensities" value="true" type="string" description="Normalize feature intensities per map before alignment so that total intensity is equal across maps." required="false" advanced="false" restrictions="true,false" />
        <ITEM name="decharge_mz" value="false" type="string" description="Convert observed m/z values to their singly-charged (z=1) equivalent before alignment." required="false" advanced="false" restrictions="true,false" />
      </NODE>
    </NODE>
  </NODE>
</PARAMETERS>
