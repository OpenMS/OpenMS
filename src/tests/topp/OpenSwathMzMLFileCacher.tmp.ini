<?xml version="1.0" encoding="ISO-8859-1"?>
<PARAMETERS version="1.8.0" xsi:noNamespaceSchemaLocation="https://raw.githubusercontent.com/OpenMS/OpenMS/develop/share/OpenMS/SCHEMAS/Param_1_8_0.xsd" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
  <NODE name="OpenSwathMzMLFileCacher" description="Caches the spectra and chromatogram data of an mzML to disk.">
    <ITEM name="version" value="3.5.0-pre-nuc-dia-2025-07-24" type="string" description="Version of the tool that generated this parameters file." required="false" advanced="true" />
    <NODE name="1" description="Instance &apos;1&apos; section for &apos;OpenSwathMzMLFileCacher&apos;">
      <ITEM name="in" value="" type="input-file" description="Input mzML file" required="true" advanced="false" supported_formats="*.mzML,*.sqMass" />
      <ITEM name="in_type" value="" type="string" description="input file type -- default: determined from file extension or content#br#" required="false" advanced="false" restrictions="mzML,sqMass" />
      <ITEM name="out" value="" type="output-file" description="Output file" required="true" advanced="false" supported_formats="*.mzML,*.sqMass" />
      <ITEM name="out_type" value="" type="string" description="Output file type -- default: determined from file extension or content#br#Note: that not all conversion paths work or make sense." required="false" advanced="false" restrictions="mzML,sqMass" />
      <ITEM name="convert_back" value="false" type="bool" description="Convert back to mzML" required="false" advanced="false" />
      <ITEM name="lossy_compression" value="true" type="string" description="Use numpress compression to achieve optimally small file size (attention: may cause small loss of precision; only for mzML data)." required="false" advanced="false" restrictions="true,false" />
      <ITEM name="full_meta" value="true" type="string" description="Write full meta information into sqMass file (may require large amounts of memory)" required="false" advanced="false" restrictions="true,false" />
      <ITEM name="lossy_mass_accuracy" value="-1.0" type="double" description="Desired (absolute) m/z accuracy for lossy compression (e.g. use 0.0001 for a mass accuracy of 0.2 ppm at 500 m/z, default uses -1.0 for maximal accuracy)." required="false" advanced="true" />
      <ITEM name="process_lowmemory" value="false" type="bool" description="Whether to process the file on the fly without loading the whole file into memory first (only for conversions of mzXML/mzML to mzML).#br#Note: this flag will prevent conversion from spectra to chromatograms." required="false" advanced="true" />
      <ITEM name="lowmem_batchsize" value="500" type="int" description="The batch size of the low memory conversion" required="false" advanced="true" restrictions="0:" />
      <ITEM name="log" value="" type="string" description="Name of log file (created only when specified)" required="false" advanced="true" />
      <ITEM name="debug" value="0" type="int" description="Sets the debug level" required="false" advanced="true" />
      <ITEM name="threads" value="1" type="int" description="Sets the number of threads allowed to be used by the TOPP tool" required="false" advanced="false" />
      <ITEM name="no_progress" value="false" type="bool" description="Disables progress logging to command line" required="false" advanced="true" />
      <ITEM name="force" value="false" type="bool" description="Overrides tool-specific checks" required="false" advanced="true" />
      <ITEM name="test" value="false" type="bool" description="Enables the test mode (needed for internal use only)" required="false" advanced="true" />
    </NODE>
  </NODE>
</PARAMETERS>
