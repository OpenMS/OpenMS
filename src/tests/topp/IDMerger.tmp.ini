<?xml version="1.0" encoding="ISO-8859-1"?>
<PARAMETERS version="1.8.0" xsi:noNamespaceSchemaLocation="https://raw.githubusercontent.com/OpenMS/OpenMS/develop/share/OpenMS/SCHEMAS/Param_1_8_0.xsd" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
  <NODE name="IDMerger" description="Merges several protein/peptide identification files into one file.">
    <ITEM name="version" value="3.5.0-pre-nuc-dia-2025-07-24" type="string" description="Version of the tool that generated this parameters file." required="false" advanced="true" />
    <NODE name="1" description="Instance &apos;1&apos; section for &apos;IDMerger&apos;">
      <ITEMLIST name="in" type="input-file" description="Input files separated by blanks (all must have the same type)" required="true" advanced="false" supported_formats="*.idXML,*.oms">
      </ITEMLIST>
      <ITEM name="out" value="" type="output-file" description="Output file (must have the same type as the input files)" required="true" advanced="false" supported_formats="*.idXML,*.oms" />
      <ITEM name="out_type" value="" type="string" description="Output file type (default: determined from file extension)" required="false" advanced="false" restrictions="idXML,oms" />
      <ITEM name="add_to" value="" type="input-file" description="Optional input file. IDs from &apos;in&apos; are added to this file, but only if the (modified) peptide sequences are not present yet (considering only best hits per spectrum)." required="false" advanced="false" supported_formats="*.idXML" />
      <ITEM name="annotate_file_origin" value="true" type="string" description="Store the original filename in each protein/peptide identification (meta value: &apos;file_origin&apos;) - idXML input/output only" required="false" advanced="false" restrictions="true,false" />
      <ITEM name="pepxml_protxml" value="false" type="bool" description="Merge idXML files derived from a pepXML and corresponding protXML file.#br#Exactly two input files are expected in this case. Not compatible with &apos;add_to&apos;." required="false" advanced="false" />
      <ITEM name="merge_proteins_add_PSMs" value="false" type="bool" description="Merge all identified proteins by accession into one protein identification run but keep all the PSMs with updated links to potential new protein ID#s. Not compatible with &apos;add_to&apos;." required="false" advanced="false" />
      <ITEM name="log" value="" type="string" description="Name of log file (created only when specified)" required="false" advanced="true" />
      <ITEM name="debug" value="0" type="int" description="Sets the debug level" required="false" advanced="true" />
      <ITEM name="threads" value="1" type="int" description="Sets the number of threads allowed to be used by the TOPP tool" required="false" advanced="false" />
      <ITEM name="no_progress" value="false" type="bool" description="Disables progress logging to command line" required="false" advanced="true" />
      <ITEM name="force" value="false" type="bool" description="Overrides tool-specific checks" required="false" advanced="true" />
      <ITEM name="test" value="false" type="bool" description="Enables the test mode (needed for internal use only)" required="false" advanced="true" />
    </NODE>
  </NODE>
</PARAMETERS>
