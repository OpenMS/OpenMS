<?xml version="1.0" encoding="ISO-8859-1"?>
<PARAMETERS version="1.8.0" xsi:noNamespaceSchemaLocation="https://raw.githubusercontent.com/OpenMS/OpenMS/develop/share/OpenMS/SCHEMAS/Param_1_8_0.xsd" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
  <NODE name="HighResPrecursorMassCorrector" description="Corrects the precursor mass and charge determined by the instrument software.">
    <ITEM name="version" value="3.5.0-pre-nuc-dia-2025-07-24" type="string" description="Version of the tool that generated this parameters file." required="false" advanced="true" />
    <NODE name="1" description="Instance &apos;1&apos; section for &apos;HighResPrecursorMassCorrector&apos;">
      <ITEM name="in" value="" type="input-file" description="Input file (centroided data)" required="true" advanced="false" supported_formats="*.mzML" />
      <ITEM name="out" value="" type="output-file" description="Output file" required="true" advanced="false" supported_formats="*.mzML" />
      <ITEM name="out_csv" value="" type="output-file" description="Optional CSV output file for results on &apos;nearest_peak&apos; or &apos;highest_intensity_peak&apos; algorithm (see corresponding subsection) containing columns: RT, uncorrectedMZ, correctedMZ, deltaMZ." required="false" advanced="false" supported_formats="*.csv" />
      <ITEM name="log" value="" type="string" description="Name of log file (created only when specified)" required="false" advanced="true" />
      <ITEM name="debug" value="0" type="int" description="Sets the debug level" required="false" advanced="true" />
      <ITEM name="threads" value="1" type="int" description="Sets the number of threads allowed to be used by the TOPP tool" required="false" advanced="false" />
      <ITEM name="no_progress" value="false" type="bool" description="Disables progress logging to command line" required="false" advanced="true" />
      <ITEM name="force" value="false" type="bool" description="Overrides tool-specific checks" required="false" advanced="true" />
      <ITEM name="test" value="false" type="bool" description="Enables the test mode (needed for internal use only)" required="false" advanced="true" />
      <NODE name="feature" description="Use features for precursor mass correction.">
        <ITEM name="in" value="" type="input-file" description="Features used to correct precursor masses." required="false" advanced="false" supported_formats="*.featureXML" />
        <ITEM name="mz_tolerance" value="5.0" type="double" description="The precursor mass tolerance. Used to determine matching to feature mass traces." required="false" advanced="false" />
        <ITEM name="mz_tolerance_unit" value="ppm" type="string" description="Unit of precursor mass tolerance" required="false" advanced="false" restrictions="Da,ppm" />
        <ITEM name="rt_tolerance" value="0.0" type="double" description="Additional retention time tolerance added to feature boundaries." required="false" advanced="false" />
        <ITEM name="max_trace" value="2" type="int" description="Maximum isotopic trace considered in matching a precursor to a feature." required="false" advanced="true" />
        <ITEM name="believe_charge" value="false" type="bool" description="Assume precursor charge to be correct." required="false" advanced="false" />
        <ITEM name="keep_original" value="false" type="bool" description="Make a copy of the precursor and MS2 (true) or discard the original (false)." required="false" advanced="false" />
        <ITEM name="assign_all_matching" value="false" type="bool" description="Correct a precursor using all matching features (true) or only the nearest (false). Only evaluated if copies are created (feature:keep_original)." required="false" advanced="false" />
      </NODE>
      <NODE name="nearest_peak" description="Use nearest centroided MS1 peak for precursor mass correction.">
        <ITEM name="mz_tolerance" value="0.0" type="double" description="The precursor mass tolerance to find the closest MS1 peak. (Disable method by setting value to 0.0)" required="false" advanced="false" />
        <ITEM name="mz_tolerance_unit" value="ppm" type="string" description="Unit of precursor mass tolerance" required="false" advanced="false" restrictions="Da,ppm" />
      </NODE>
      <NODE name="highest_intensity_peak" description="Use centroided MS1 peak with the highest intensity in a certrain mass range - for precursor mass correction">
        <ITEM name="mz_tolerance" value="0.0" type="double" description="The precursor mass tolerance to find the highest intensity MS1 peak. Suggested value 1/max. expected charge. (Disable method by setting value to 0.0)" required="false" advanced="false" />
        <ITEM name="mz_tolerance_unit" value="ppm" type="string" description="Unit of precursor mass tolerance" required="false" advanced="false" restrictions="Da,ppm" />
      </NODE>
    </NODE>
  </NODE>
</PARAMETERS>
