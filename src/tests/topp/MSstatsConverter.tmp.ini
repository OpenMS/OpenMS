<?xml version="1.0" encoding="ISO-8859-1"?>
<PARAMETERS version="1.8.0" xsi:noNamespaceSchemaLocation="https://raw.githubusercontent.com/OpenMS/OpenMS/develop/share/OpenMS/SCHEMAS/Param_1_8_0.xsd" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
  <NODE name="MSstatsConverter" description="Converter to input for MSstats">
    <ITEM name="version" value="3.5.0-pre-nuc-dia-2025-07-24" type="string" description="Version of the tool that generated this parameters file." required="false" advanced="true" />
    <NODE name="1" description="Instance &apos;1&apos; section for &apos;MSstatsConverter&apos;">
      <ITEM name="in" value="" type="input-file" description="Input consensusXML with peptide intensities" required="true" advanced="false" supported_formats="*.consensusXML" />
      <ITEM name="in_design" value="" type="input-file" description="Experimental Design file" required="true" advanced="false" supported_formats="*.tsv" />
      <ITEM name="method" value="LFQ" type="string" description="Method used in the experiment(label free [LFQ], isobaric labeling [ISO]))" required="false" advanced="false" restrictions="LFQ,ISO" />
      <ITEM name="msstats_bioreplicate" value="MSstats_BioReplicate" type="string" description="Which column in the condition table should be used for MSstats &apos;BioReplicate&apos;" required="false" advanced="false" />
      <ITEM name="msstats_condition" value="MSstats_Condition" type="string" description="Which column in the condition table should be used for MSstats &apos;Condition&apos;" required="false" advanced="false" />
      <ITEM name="msstats_mixture" value="MSstats_Mixture" type="string" description="Which column in the condition table should be used for MSstats &apos;Mixture&apos;" required="false" advanced="false" />
      <ITEMLIST name="reannotate_filenames" type="input-file" description="Overwrite MS file names in consensusXML" required="false" advanced="true" supported_formats="*.mzML">
      </ITEMLIST>
      <ITEM name="labeled_reference_peptides" value="false" type="bool" description="If set, IsotopeLabelType is &apos;H&apos;, else &apos;L&apos;" required="false" advanced="false" />
      <ITEM name="retention_time_summarization_method" value="max" type="string" description="How indistinguishable peptidoforms at different retention times should be treated. This is usually necessary for LFQ experiments and therefore defaults to &apos;max&apos;. In case of TMT/iTRAQ, MSstatsTMT does the aggregation itself later and the parameter always resets to manual (i.e. is unused)." required="false" advanced="true" restrictions="manual,max,min,mean,sum" />
      <ITEM name="out" value="" type="output-file" description="Input CSV file for MSstats." required="true" advanced="false" supported_formats="*.csv" />
      <ITEM name="log" value="" type="string" description="Name of log file (created only when specified)" required="false" advanced="true" />
      <ITEM name="debug" value="0" type="int" description="Sets the debug level" required="false" advanced="true" />
      <ITEM name="threads" value="1" type="int" description="Sets the number of threads allowed to be used by the TOPP tool" required="false" advanced="false" />
      <ITEM name="no_progress" value="false" type="bool" description="Disables progress logging to command line" required="false" advanced="true" />
      <ITEM name="force" value="false" type="bool" description="Overrides tool-specific checks" required="false" advanced="true" />
      <ITEM name="test" value="false" type="bool" description="Enables the test mode (needed for internal use only)" required="false" advanced="true" />
    </NODE>
  </NODE>
</PARAMETERS>
