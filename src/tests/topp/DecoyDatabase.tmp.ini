<?xml version="1.0" encoding="ISO-8859-1"?>
<PARAMETERS version="1.8.0" xsi:noNamespaceSchemaLocation="https://raw.githubusercontent.com/OpenMS/OpenMS/develop/share/OpenMS/SCHEMAS/Param_1_8_0.xsd" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
  <NODE name="DecoyDatabase" description="Creates combined target+decoy sequence database from forward sequence database.">
    <ITEM name="version" value="3.5.0-pre-nuc-dia-2025-07-24" type="string" description="Version of the tool that generated this parameters file." required="false" advanced="true" />
    <NODE name="1" description="Instance &apos;1&apos; section for &apos;DecoyDatabase&apos;">
      <ITEMLIST name="in" type="input-file" description="Input FASTA file(s), each containing a database. It is recommended to include a contaminant database as well." required="true" advanced="false" supported_formats="*.fasta">
      </ITEMLIST>
      <ITEM name="out" value="" type="output-file" description="Output FASTA file where the decoy database (target + decoy or only decoy, see &apos;only_decoy&apos;) will be written to." required="true" advanced="false" supported_formats="*.fasta" />
      <ITEM name="decoy_string" value="DECOY_" type="string" description="String that is combined with the accession of the protein identifier to indicate a decoy protein." required="false" advanced="false" />
      <ITEM name="decoy_string_position" value="prefix" type="string" description="Should the &apos;decoy_string&apos; be prepended (prefix) or appended (suffix) to the protein accession?" required="false" advanced="false" restrictions="prefix,suffix" />
      <ITEM name="only_decoy" value="false" type="bool" description="Write only decoy proteins to the output database instead of a combined database." required="false" advanced="false" />
      <ITEM name="type" value="protein" type="string" description="Type of sequence. RNA sequences may contain modification codes, which will be handled correctly if this is set to &apos;RNA&apos;." required="false" advanced="false" restrictions="protein,RNA" />
      <ITEM name="method" value="reverse" type="string" description="Method by which decoy sequences are generated from target sequences. Note that all sequences are shuffled using the same random seed, ensuring that identical sequences produce the same shuffled decoy sequences. Shuffled sequences that produce highly similar output sequences are shuffled again (see shuffle_sequence_identity_threshold)." required="false" advanced="false" restrictions="reverse,shuffle" />
      <ITEM name="shuffle_max_attempts" value="30" type="int" description="shuffle: maximum attempts to lower the amino acid sequence identity between target and decoy for the shuffle algorithm" required="false" advanced="true" />
      <ITEM name="shuffle_sequence_identity_threshold" value="0.5" type="double" description="shuffle: target-decoy amino acid sequence identity threshold for the shuffle algorithm. If the sequence identity is above this threshold, shuffling is repeated. In case of repeated failure, individual amino acids are &apos;mutated&apos; to produce a different amino acid sequence." required="false" advanced="true" />
      <ITEM name="seed" value="1" type="string" description="Random number seed (use &apos;time&apos; for system time)" required="false" advanced="true" />
      <ITEM name="enzyme" value="Trypsin" type="string" description="Enzyme used for the digestion of the sample. Only applicable if parameter &apos;type&apos; is &apos;protein&apos;." required="false" advanced="false" restrictions="glutamyl endopeptidase,Alpha-lytic protease,no cleavage,unspecific cleavage,Trypsin,Arg-C,Arg-C/P,Asp-N,Asp-N/B,Glu-C+P,PepsinA + P,cyanogen-bromide,Clostripain/P,elastase-trypsin-chymotrypsin,Asp-N_ambic,Chymotrypsin,Chymotrypsin/P,CNBr,Formic_acid,Lys-C,Lys-N,Lys-C/P,PepsinA,TrypChymo,Trypsin/P,V8-DE,V8-E,leukocyte elastase,proline endopeptidase,2-iodobenzoate,iodosobenzoate,staphylococcal protease/D,proline-endopeptidase/HKR" />
      <ITEM name="log" value="" type="string" description="Name of log file (created only when specified)" required="false" advanced="true" />
      <ITEM name="debug" value="0" type="int" description="Sets the debug level" required="false" advanced="true" />
      <ITEM name="threads" value="1" type="int" description="Sets the number of threads allowed to be used by the TOPP tool" required="false" advanced="false" />
      <ITEM name="no_progress" value="false" type="bool" description="Disables progress logging to command line" required="false" advanced="true" />
      <ITEM name="force" value="false" type="bool" description="Overrides tool-specific checks" required="false" advanced="true" />
      <ITEM name="test" value="false" type="bool" description="Enables the test mode (needed for internal use only)" required="false" advanced="true" />
      <NODE name="NeighborSearch" description="Parameters for neighbor peptide search (&apos;in&apos; holds the neighbor candidates)">
        <ITEM name="in_relevant_proteins" value="" type="input-file" description="These are the relevant proteins, for which we seek neighbors" required="false" advanced="false" supported_formats="*.fasta" />
        <ITEM name="out_neighbor" value="" type="output-file" description="Output FASTA file with neighbors of relevant peptides (given in &apos;in_relevant_proteins&apos;)." required="false" advanced="false" />
        <ITEM name="out_relevant" value="" type="output-file" description="Output FASTA file with target+decoy of relevant peptides (given in &apos;in_relevant_proteins&apos;). Required for downstream filtering of search results via IDFilter and subsequent FDR." required="false" advanced="false" />
        <ITEM name="missed_cleavages" value="0" type="int" description="Number of missed cleavages for relevant and neighbor peptides." required="false" advanced="false" />
        <ITEM name="mz_bin_size" value="0.05" type="double" description="Bin size for spectra m/z comparison (the original study suggests 0.05 Th for high-res and 1.0005079 Th for low-res spectra)." required="false" advanced="false" />
        <ITEM name="pc_mass_tolerance" value="0.01" type="double" description="Maximal precursor mass difference (in Da or ppm; see &apos;pc_mass_tolerance_unit&apos;) between neighbor and relevant peptide." required="false" advanced="false" />
        <ITEM name="pc_mass_tolerance_unit" value="Da" type="string" description="Is &apos;pc_mass_tolerance&apos; in Da or ppm?" required="false" advanced="false" restrictions="Da,ppm" />
        <ITEM name="min_peptide_length" value="5" type="int" description="Minimum peptide length (relevant and neighbor peptides)" required="false" advanced="false" />
        <ITEM name="min_shared_ion_fraction" value="0.25" type="double" description="Minimal required overlap &apos;t_i&apos; of b/y ions shared between neighbor candidate and a relevant peptide (t_i &lt;= 2*B12/(B1+B2)). Higher values result in fewer neighbors." required="false" advanced="false" />
      </NODE>
      <NODE name="Decoy" description="Decoy parameters section">
        <ITEM name="non_shuffle_pattern" value="" type="string" description="Residues to not shuffle (keep at a constant position when shuffling). Separate by comma, e.g. use &apos;K,P,R&apos; here." required="false" advanced="false" />
        <ITEM name="keepPeptideNTerm" value="true" type="string" description="Whether to keep peptide N terminus constant when shuffling / reversing." required="false" advanced="true" restrictions="true,false" />
        <ITEM name="keepPeptideCTerm" value="true" type="string" description="Whether to keep peptide C terminus constant when shuffling / reversing." required="false" advanced="true" restrictions="true,false" />
      </NODE>
    </NODE>
  </NODE>
</PARAMETERS>
