<?xml version="1.0" encoding="ISO-8859-1"?>
<PARAMETERS version="1.8.0" xsi:noNamespaceSchemaLocation="https://raw.githubusercontent.com/OpenMS/OpenMS/develop/share/OpenMS/SCHEMAS/Param_1_8_0.xsd" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
  <NODE name="IDPosteriorErrorProbability" description="Estimates probabilities for incorrectly assigned peptide sequences and a set of search engine scores using a mixture model.">
    <ITEM name="version" value="3.5.0-pre-nuc-dia-2025-07-24" type="string" description="Version of the tool that generated this parameters file." required="false" advanced="true" />
    <NODE name="1" description="Instance &apos;1&apos; section for &apos;IDPosteriorErrorProbability&apos;">
      <ITEM name="in" value="" type="input-file" description="input file " required="true" advanced="false" supported_formats="*.idXML" />
      <ITEM name="out" value="" type="output-file" description="output file " required="true" advanced="false" supported_formats="*.idXML" />
      <ITEM name="out_plot" value="" type="output-file" description="txt file (if gnuplot is available, a corresponding PDF will be created as well.)" required="false" advanced="false" supported_formats="*.txt" />
      <ITEM name="split_charge" value="false" type="bool" description="The search engine scores are split by charge if this flag is set. Thus, for each charge state a new model will be computed." required="false" advanced="false" />
      <ITEM name="top_hits_only" value="false" type="bool" description="If set only the top hits of every PeptideIdentification will be used" required="false" advanced="false" />
      <ITEM name="fdr_for_targets_smaller" value="0.05" type="double" description="Only used, when top_hits_only set. Additionally, target/decoy information should be available. The score_type must be q-value from an previous False Discovery Rate run." required="false" advanced="true" />
      <ITEM name="ignore_bad_data" value="false" type="bool" description="If set errors will be written but ignored. Useful for pipelines with many datasets where only a few are bad, but the pipeline should run through." required="false" advanced="false" />
      <ITEM name="prob_correct" value="false" type="bool" description="If set scores will be calculated as &apos;1 - ErrorProbabilities&apos; and can be interpreted as probabilities for correct identifications." required="false" advanced="false" />
      <ITEM name="log" value="" type="string" description="Name of log file (created only when specified)" required="false" advanced="true" />
      <ITEM name="debug" value="0" type="int" description="Sets the debug level" required="false" advanced="true" />
      <ITEM name="threads" value="1" type="int" description="Sets the number of threads allowed to be used by the TOPP tool" required="false" advanced="false" />
      <ITEM name="no_progress" value="false" type="bool" description="Disables progress logging to command line" required="false" advanced="true" />
      <ITEM name="force" value="false" type="bool" description="Overrides tool-specific checks" required="false" advanced="true" />
      <ITEM name="test" value="false" type="bool" description="Enables the test mode (needed for internal use only)" required="false" advanced="true" />
      <NODE name="fit_algorithm" description="Algorithm parameter subsection">
        <ITEM name="number_of_bins" value="100" type="int" description="Number of bins used for visualization. Only needed if each iteration step of the EM-Algorithm will be visualized" required="false" advanced="true" />
        <ITEM name="incorrectly_assigned" value="Gumbel" type="string" description="for &apos;Gumbel&apos;, the Gumbel distribution is used to plot incorrectly assigned sequences. For &apos;Gauss&apos;, the Gauss distribution is used." required="false" advanced="true" restrictions="Gumbel,Gauss" />
        <ITEM name="max_nr_iterations" value="1000" type="int" description="Bounds the number of iterations for the EM algorithm when convergence is slow." required="false" advanced="true" />
        <ITEM name="neg_log_delta" value="6" type="int" description="The negative logarithm of the convergence threshold for the likelihood increase." required="false" advanced="false" />
        <ITEM name="outlier_handling" value="ignore_iqr_outliers" type="string" description="What to do with outliers:#br#- ignore_iqr_outliers: ignore outliers outside of 3*IQR from Q1/Q3 for fitting#br#- set_iqr_to_closest_valid: set IQR-based outliers to the last valid value for fitting#br#- ignore_extreme_percentiles: ignore everything outside 99th and 1st percentile (also removes equal values like potential censored max values in XTandem)#br#- none: do nothing" required="false" advanced="false" restrictions="ignore_iqr_outliers,set_iqr_to_closest_valid,ignore_extreme_percentiles,none" />
      </NODE>
    </NODE>
  </NODE>
</PARAMETERS>
