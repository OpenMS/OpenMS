<?xml version="1.0" encoding="ISO-8859-1"?>
<PARAMETERS version="1.8.0" xsi:noNamespaceSchemaLocation="https://raw.githubusercontent.com/OpenMS/OpenMS/develop/share/OpenMS/SCHEMAS/Param_1_8_0.xsd" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
  <NODE name="TagMatrix" description="INI exercising representative advanced/required attribute combinations. The 'required' attribute is optional per Param_1_8_0.xsd (default=&quot;false&quot;), and the schema default is not injected because loading does not run schema validation. Current OpenMS writers always emit it explicitly; the branches where it is absent are reached by hand-written and third-party files, and by OpenMS INIs written against the Param 1.0-1.2 schemas, which defined 'advanced' but had no 'required' attribute at all.">
    <ITEM name="adv_true_req_absent" value="1" type="int" description="advanced=true, required omitted -- must NOT become required" advanced="true"/>
    <ITEM name="adv_true_req_false" value="1" type="int" description="advanced=true, required=false" advanced="true" required="false"/>
    <ITEM name="adv_true_req_true" value="1" type="int" description="advanced=true, required=true" advanced="true" required="true"/>
    <ITEM name="adv_absent_req_true" value="1" type="int" description="advanced omitted, required=true" required="true"/>
    <ITEM name="adv_absent_req_absent" value="1" type="int" description="both omitted"/>
    <ITEM name="adv_false_req_absent" value="1" type="int" description="advanced=false, required omitted" advanced="false"/>
    <ITEMLIST name="list_adv_true_req_absent" type="int" description="ITEMLIST control: advanced=true, required omitted" advanced="true">
      <LISTITEM value="1"/>
    </ITEMLIST>
  </NODE>
</PARAMETERS>
