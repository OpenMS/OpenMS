name: "Install OpenMS Dependencies"
description: "Central action for all dependency management"
inputs:
  compiler:
    description: "The name of the compiler to use"
    required: true
  ssh_key:
    description: "SSH private key for the rsync cache archive"
    required: false
  ssh_host:
    description: "SSH host for the rsync cache archive"
    required: false
  ssh_port:
    description: "SSH port for the rsync cache archive"
    required: false
  ssh_user:
    description: "SSH user for the rsync cache archive"
    required: false
outputs:
  cmake_prefix:
    description: "Path to add to CMAKE_PREFIX"
    value: ${{ steps.combine.outputs.cmake_prefix }}
runs:
  using: "composite"
  steps:
    - name: Add THIRDPARTY
      shell: bash
      run: |
          # initialize THIRDPARTY
          git submodule update --init THIRDPARTY

          # add third-party binaries to PATH
          # use flat THIRDPARTY structure
          mkdir -p _thirdparty

          tp_folder=${{ runner.os }}
          if [ "$tp_folder" = "macOS" ]; then
            tp_folder=MacOS
          fi

          # Copy the correct architecture
          cp -R "THIRDPARTY/$tp_folder/$(uname -m)"/* _thirdparty/

          # Copy architecture independent tools
          cp -R THIRDPARTY/All/* _thirdparty/

          # add third-party binaries to PATH
          for thirdpartytool in '${{ github.workspace }}/_thirdparty'/*; do
            if [ "${{ runner.os }}" = "Windows" ]; then
              echo "${thirdpartytool//\//\\}" >> "$GITHUB_PATH"
            else
              echo "${thirdpartytool}" >> "$GITHUB_PATH"
            fi
          done

    - name: Install Conda
      if: runner.os == 'Windows'
      uses: conda-incubator/setup-miniconda@v3
      with:
        auto-update-conda: true
        activate-environment: "ci"
        python-version: 3.11
        use-mamba: true

    - name: Install Dependencies via Conda
      id: conda-setup
      if: runner.os == 'Windows'
      # NOTE: This weird shell line is needed in order to activate
      # conda (and put it in this shell's PATH) since the way it's
      # installed requires a login shell :(
      shell: bash -el {0}
      run: |
        # Dump out environment information for debugging:
        conda info

        # None of the other arrow sublibraries seemed necessary, but it's an easy addition.
        # doxygen is installed here (conda-forge) instead of via Chocolatey:
        #  - choco 'doxygen.portable' downloads from doxygen.nl, which intermittently returns
        #    HTTP 403 and aborts the whole job before it can build.
        # doxygen is needed for the docs (enable_docs=ON, built on Windows to catch errors
        # pre-merge); conda-forge ships it into Library/bin (already on PATH below).
        # Ghostscript is no longer required: LaTeX formulas are rendered client-side via
        # MathJax (USE_MATHJAX=YES in doc/doxygen/Doxyfile*.in).
        conda install -c conda-forge doxygen uv -y

        # Set variables required for the following steps so they
        # don't need a conda environment or login shell:
        CONDA_ENV_PREFIX=$(
          conda info --json |
            jq --raw-output .active_prefix |
            sed 's|\\|/|g'
        )

        echo "$CONDA_ENV_PREFIX/bin" >>"$GITHUB_PATH"
        echo "$CONDA_ENV_PREFIX/Library/bin" >>"$GITHUB_PATH"
        echo "cmake_prefix=$CONDA_ENV_PREFIX/Library" >>"$GITHUB_OUTPUT"

        # Some output for debugging:
        echo "CONDA_ENV_PREFIX=$CONDA_ENV_PREFIX"

        # Disable conda auto-activation to prevent race conditions during parallel
        # CMake builds. See https://github.com/conda/conda/issues/8733
        # The paths are already added to GITHUB_PATH above, so conda activation
        # is no longer needed for subsequent steps.
        conda init --reverse bash

    - name: Install Qt (Windows)
      if: runner.os == 'Windows'
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.8.3'    ## Qt 6.8.3 ships no msvc2026 build; the win64_msvc2022_64 binaries are
                            ## ABI-compatible with the VS2026 (v145) toolchain (shared v14x ABI).
        arch: 'win64_msvc2022_64'
        cache: 'false'
        archives: 'qtsvg qtimageformats qtbase'

    - name: "Dependencies: Windows"
      id: deps-windows
      if: runner.os == 'Windows'
      shell: bash
      run: |
        # NOTE: doxygen is installed via conda-forge in the Conda step above, not here:
        # choco 'doxygen.portable' frequently 403s from doxygen.nl. (Ghostscript is no
        # longer needed -- LaTeX formulas render client-side via MathJax.)
        choco install -y --no-progress \
          ccache \
          graphviz

        # Use a custom NSIS, which provides 8-k string support and has
        # UltraModernUI integrated already:
        curl --no-progress-meter -L -o NSIS.tar.gz https://github.com/OpenMS/NSIS/raw/main/NSIS.tar.gz
        7z x -so NSIS.tar.gz | 7z x -si -ttar -aoa -o"C:/Program Files (x86)/NSIS/"
        echo "C:\Program Files (x86)\NSIS" >> $GITHUB_PATH

        echo "cmake_prefix=" >>"$GITHUB_OUTPUT"

    - name: "Dependencies: Linux"
      id: deps-linux
      if: runner.os == 'Linux'
      shell: bash
      run: |
        bash tools/ci/deps-ubuntu.sh

        if [[ "${{ inputs.compiler }}" == clang* ]]; then
          major_ver=$(clang -dumpversion | cut -d. -f1)
          sudo apt-get -qq install -y "libomp-${major_ver}-dev" "llvm-${major_ver}"
          for tool in /usr/bin/llvm-*-${major_ver}; do
            base=$(basename "$tool" "-${major_ver}")
            sudo ln -sf "$tool" "/usr/local/bin/${base}"
          done
        fi

        echo "cmake_prefix=" >>$GITHUB_OUTPUT

    - name: "Dependencies: macOS"
      id: deps-macos
      if: runner.os == 'macOS'
      env:
        # We need to add this, otherwise brew "helpfully" updates all
        # of the GitHub preinstalled packages, which can cause issues:
        HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
      shell: bash
      run: |
        bash tools/ci/deps-macos.sh
        brew install ccache \
                      flex \
                      bison

        brew_path=$(brew --prefix)
        echo "$brew_path/bin" >>"$GITHUB_PATH"
        echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
        echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
        echo "cmake_prefix=$brew_path" >>"$GITHUB_OUTPUT"

    - name: Combine Outputs
      id: combine
      shell: bash
      run: |
        cmake_prefix_s=""
        cmake_prefix_a=(
          "${{ steps.conda-setup.outputs.cmake_prefix}}"
          "${{ steps.deps-windows.outputs.cmake_prefix}}"
          "${{ steps.deps-linux.outputs.cmake_prefix}}"
          "${{ steps.deps-macos.outputs.cmake_prefix}}"
        )

        for path in "${cmake_prefix_a[@]}"; do
          if [ -n "$path" ]; then
            if [ -n "$cmake_prefix_s" ]; then
              cmake_prefix_s="${cmake_prefix_s};"
            fi
            cmake_prefix_s="${cmake_prefix_s}${path}"
          fi
        done

        echo "cmake_prefix=${cmake_prefix_s}" >> "$GITHUB_OUTPUT"
    
    - uses: OpenMS/ci-tools/actions/rsync-cache@48558751d87bfaed314a1f5da0e15bcc07f94dc4
      with:
        name: vcpkg-cache
        path: ${{ github.workspace }}/.vcpkg-cache
        key: ${{ runner.os }}-${{ runner.arch }}-${{ inputs.compiler }}-vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
        ssh_key: ${{ inputs.ssh_key }}
        ssh_host: ${{ inputs.ssh_host }}
        ssh_port: ${{ inputs.ssh_port }}
        ssh_user: ${{ inputs.ssh_user }}

    - name: Init vcpkg submodule
      shell: bash
      run: |
        git submodule update --init vcpkg
    
    - name: Point vcpkg at the Local Binary Cache
      shell: bash
      run: |
        mkdir -p "${{ github.workspace }}/.vcpkg-cache"
        echo "VCPKG_BINARY_SOURCES=clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite" >> "$GITHUB_ENV"

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        doNotCache: true
