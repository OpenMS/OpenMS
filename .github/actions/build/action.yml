name: "Build OpenMS"
description: "Action for automating the OpenMS build process"
inputs:
  compiler:
    description: "The name of the compiler to use"
    required: true
  macosx_deployment_target:
    description: "Used to override -macos-version-min on macOS"
    default: 14.0
outputs:
  version:
    description: "The discovered compiler version number"
    value: ${{ steps.compiler.outputs.ver }}
runs:
  using: "composite"
  steps:

    ############################################################################
    # NOTE: x64 is hardcoded. No support for 32bit.
    - name: Emulate a Visual Studio shell (Windows)
      if: ${{ runner.os == 'Windows' }}
      uses: egor-tensin/vs-shell@v2
      with: { arch: x64 }

    ############################################################################
    - name: Install Dependencies
      id: deps
      uses: ./.github/actions/dependencies
      with:
        compiler: ${{ inputs.compiler }}

    ############################################################################
    - name: Compute the Compiler Version
      id: compiler
      env:
        compiler: ${{ inputs.compiler }}
      shell: bash
      run: |
        case ${compiler:-gcc} in
        clang*)
          ver=$(clang -dumpversion)
          name=$(type -p clang++)
          ;;

        cl*)
          ver=$(cl.exe 2>&1 |
            grep -E 'Version [0-9.]+' |
            sed -E 's/^.* Version ([0-9.]+) .*$/\1/')
          name=$compiler
          ;;

        gcc | g++)
          ver=$(gcc -dumpversion)
          name=$(type -p g++)
          ;;

        xcode)
          ver=$(clang -dumpversion)
          name=$(xcrun -f clang++)
          ;;

        *)
          ver="0.0"
          name=$compiler
          ;;
        esac

        major=$(cut -d. -f1 <<<"$ver")

        {
          echo "ver=$ver"
          echo "major=$major"
          echo "name=$name"
        } >>"$GITHUB_OUTPUT"

        {
          # All remaining steps should use this compiler.
          echo "CXX=$name"
        } >>"$GITHUB_ENV"

    ############################################################################
    # These are variables that don't need to be set for normal
    # (non-CI) builds.
    - name: Set CI-specific Environment Variables
      shell: bash
      run: |
        {
          # During building and testing several Qt apps are run.  This
          # is needed so they can start without having a graphical
          # environment:
          echo "QT_QPA_PLATFORM=offscreen"

        } >>"$GITHUB_ENV"

    ############################################################################
    # This is only really needed so we can set cache keys.
    - name: Extract the PR Number or Branch Name
      id: pr
      shell: bash
      run: echo "name=${{ github.event.pull_request && github.event.number || github.ref_name }}" >>$GITHUB_OUTPUT

    ############################################################################
    # NOTE: restore/save are deliberately split instead of using the combined
    # actions/cache action.  The combined action only writes the cache in its
    # post step when the *primary* key missed, so a static key (as used here
    # before) is written exactly once and then frozen forever -- every later
    # run restored a stale cache and recompiled everything from scratch.
    # Making the primary key unique per run guarantees a miss, so the save step
    # below always uploads a freshly populated cache, while the restore-keys
    # ladder still finds the most recent cache by prefix.
    - name: Try to Fetch Existing Build Cache
      id: ccache-restore
      uses: actions/cache/restore@v5
      with:
        path: .ccache
        key: ${{ runner.os }}-${{ runner.arch }}-${{ inputs.compiler }}-${{ steps.compiler.outputs.major }}-ccache-${{ steps.pr.outputs.name }}-${{ github.run_id }}-${{ github.run_attempt }}

        # Restoring: From current branch/PR, otherwise from develop, otherwise from any branch.
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-${{ inputs.compiler }}-${{ steps.compiler.outputs.major }}-ccache-${{ steps.pr.outputs.name }}-
          ${{ runner.os }}-${{ runner.arch }}-${{ inputs.compiler }}-${{ steps.compiler.outputs.major }}-ccache-develop-
          ${{ runner.os }}-${{ runner.arch }}-${{ inputs.compiler }}-${{ steps.compiler.outputs.major }}-ccache-

    ############################################################################
    - name: Configure Build Caching
      id: ccache-configure
      shell: bash
      env:
        # A full build produces ~1900 objects.  MSVC objects (built with
        # /bigobj) are considerably larger than the gcc/clang ones, and 1G was
        # not enough to hold a whole build -- the cache evicted itself while it
        # was still being filled, so it could never warm up.  Kept platform
        # specific because the total GitHub Actions cache budget is 10 GB per
        # repository and it has to cover five build jobs plus the ~1.6 GB
        # Windows contrib cache.
        maxsize: ${{ runner.os == 'Windows' && '2G' || '1G' }}
      run: |
        mkdir -p "$GITHUB_WORKSPACE/.ccache"

        {
          echo "CCACHE_COMPRESS=true"
          echo "CCACHE_COMPRESSLEVEL=6"
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache"
          echo "CCACHE_MAXSIZE=$maxsize"
          echo "CMAKE_C_COMPILER_LAUNCHER=ccache"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache"

        } >>"$GITHUB_ENV"

    ############################################################################
    # Reset the hit/miss counters (not the cached objects) so the statistics
    # printed after the build describe this run only.
    - name: Reset ccache Statistics
      id: ccache-reset
      shell: bash
      run: |
        ccache --version
        ccache --zero-stats

    ############################################################################
    # The actual commands to build OpenMS.
    - name: Build
      shell: bash
      env:
        # Official variables that need to be set to build OpenMS:
        CMAKE_PREFIX_PATH: "${{ steps.deps.outputs.cmake_prefix }}"
        OPENMS_CONTRIB_LIBS: "${{ github.workspace }}/contrib/build"
        SEARCH_ENGINES_DIRECTORY: ${{ github.workspace }}/_thirdparty
        BOOST_USE_STATIC: ${{ runner.os == 'Windows' && 'ON' || 'OFF' }}

        # FIXME: Do we actually need this?
        MACOSX_DEPLOYMENT_TARGET: "${{ inputs.macosx_deployment_target }}"

      run: |
        set -ex

        mkdir -p build
        cd build

        cmake \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH" \
          -DOPENMS_CONTRIB_LIBS="$OPENMS_CONTRIB_LIBS" \
          -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install" \
          -DPYOPENMS=ON \
          -DBOOST_USE_STATIC="$BOOST_USE_STATIC" \
          ..

        ninja --verbose

    ############################################################################
    # Hit rate and cache size for this run.  Without this there is no way to
    # tell from a build log whether compiler caching is working at all.
    - name: Report ccache Statistics
      if: ${{ !cancelled() && steps.ccache-configure.outcome == 'success' && steps.ccache-reset.outcome == 'success' }}
      shell: bash
      run: ccache --show-stats --verbose

    ############################################################################
    - name: Test
      shell: bash
      run: ctest --parallel --output-on-failure --test-dir build

    ############################################################################
    # Saved on every event, including pull requests.  A cache written by a PR
    # run is scoped to that PR, so it only speeds up later pushes to the same
    # PR -- but that is precisely the loop developers iterate in, and this
    # workflow has no push trigger for develop (only nightly and release/*), so
    # gating on non-PR events would mean the cache is effectively never written
    # at all.  Saved even when the build or the tests failed: the objects that
    # did compile are still worth keeping.
    #
    # NOTE: caches created on develop (the default branch) are the only ones
    # readable by *every* PR, so a first CI run on a new PR is only fast if
    # develop's cache is fresh.  Keeping it fresh needs test.yml to run on
    # develop regularly (a push trigger or a nightly schedule); until then a
    # PR's first run still pays for a cold build.
    #
    # Both this step and the statistics above additionally require the cache
    # setup itself to have succeeded.  `!cancelled()` is true after a *failed*
    # step too, so without this a failure in "Configure Build Caching" would
    # still upload a practically empty .ccache under this run's key -- and
    # because the restore-keys ladder picks the most recent prefix match, that
    # empty entry would then shadow a perfectly good older cache.
    - name: Save Build Cache
      if: ${{ !cancelled() && steps.ccache-configure.outcome == 'success' && steps.ccache-reset.outcome == 'success' }}
      uses: actions/cache/save@v5
      with:
        path: .ccache
        # Reuse the restore step's primary key so the two can never drift apart.
        key: ${{ steps.ccache-restore.outputs.cache-primary-key }}
