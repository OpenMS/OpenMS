name: Cherry-pick a merged PR onto a branch
description: Cherry-pick a merged PR's commit onto a branch and open a backport PR.

inputs:
  pr-number:
    description: "Merged source PR whose squash commit to cherry-pick"
    required: true
  target-branch:
    description: "Branch to cherry-pick onto (the current release branch)"
    required: true

runs:
  using: composite
  steps:
    - name: Cherry-pick and open backport PR
      uses: korthout/backport-action@v3.4.1
      with:
        source_pr_number: ${{ inputs.pr-number }}
        target_branches: ${{ inputs.target-branch }}
        github_token: ${{ github.token }}
        merge_commits: fail # Enforces squash
        experimental: '{"conflict_resolution": "draft_commit_conflicts"}'  # always open a PR; draft + instructions on conflict
        add_labels: backport
        add_author_as_assignee: true