name: Deploy container images
on:
  workflow_dispatch:
    inputs:
      tag-latest:
        description: 'Also tag images as latest'
        required: false
        default: 'false'
        type: boolean
  push:
    branches:
      - nightly
    tags:
      - "Release*"
      - "Release/*"

jobs:

  deploy-docker:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux/amd64
            arch: amd64
          - os: ubuntu-22.04-arm
            platform: linux/arm64
            arch: arm64
    outputs:
      tag_name: ${{ steps.tag_name.outputs.tag }}
      downcase_repo: ${{ steps.downcase_repo.outputs.repo }}
      tag_latest: ${{ steps.tag_name.outputs.tag_latest }}
    steps:
      - name: Free up space on the runner
        run: |
          # see: https://github.com/actions/runner-images/issues/2840
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "/opt/ghc"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Extract branch name
        shell: bash
        run: echo "branch=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT
        id: extract_branch

      - name: Define tag names
        shell: bash
        run: |
            BRANCH=${{ steps.extract_branch.outputs.branch }}
            TAG=${BRANCH#release/}

            # Determine if latest should also be used
            TAG_LATEST=""
            if [[ "$BRANCH" == "develop" || "$BRANCH" == "nightly" || "$BRANCH" == "feat/singularity" ]]; then
                TAG_LATEST="latest"
            fi

            if [[ "${{ github.event.inputs.tag-latest }}" == "true" ]]; then
                TAG_LATEST="latest"
            fi

            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "tag_latest=$TAG_LATEST" >> $GITHUB_OUTPUT
        id: tag_name

      - name: Downcase REPO
        run: echo "repo=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT
        id: downcase_repo

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Test docker build in runtime base
        uses: docker/build-push-action@v5
        with:
          load: true # so other build steps can make use of cache layers from this build
          file: dockerfiles/Dockerfile
          target: test
          platforms: ${{ matrix.platform }}
          build-args: |
            NUM_BUILD_CORES=4
            BUILDKIT_CONTEXT_KEEP_GIT_DIR=1
            OPENMS_VERSION_TAG=${{ steps.tag_name.outputs.tag }}
          # cache-from: type=gha
          # cache-to: type=gha,mode=max
          
      - name: Build and push library image
        uses: docker/build-push-action@v5
        with:
          push: true # Will only build if this is not here
          file: dockerfiles/Dockerfile
          target: library
          platforms: ${{ matrix.platform }}
          provenance: mode=max
          build-args: |
            NUM_BUILD_CORES=4
            BUILDKIT_CONTEXT_KEEP_GIT_DIR=1
            OPENMS_VERSION_TAG=${{ steps.tag_name.outputs.tag }}
          tags: |
            ghcr.io/${{ steps.downcase_repo.outputs.repo }}-library:${{ steps.tag_name.outputs.tag }}-${{ matrix.arch }}
            ${{ steps.tag_name.outputs.tag_latest != '' && format('ghcr.io/{0}-library:latest-{1}', steps.downcase_repo.outputs.repo, matrix.arch) || '' }}

          # cache-from: type=gha
          # cache-to: type=gha,mode=max

      - name: Build and push tools image
        uses: docker/build-push-action@v6
        with:
          push: true # Will only build if this is not here
          file: dockerfiles/Dockerfile
          target: tools
          platforms: ${{ matrix.platform }}
          provenance: mode=max
          build-args: |
            NUM_BUILD_CORES=4
            BUILDKIT_CONTEXT_KEEP_GIT_DIR=1
            OPENMS_VERSION_TAG=${{ steps.tag_name.outputs.tag }}
          tags: |
            ghcr.io/${{ steps.downcase_repo.outputs.repo }}-executables:${{ steps.tag_name.outputs.tag }}-${{ matrix.arch }}
            ghcr.io/${{ steps.downcase_repo.outputs.repo }}-tools:${{ steps.tag_name.outputs.tag }}-${{ matrix.arch }}
            ${{ steps.tag_name.outputs.tag_latest != '' && format('ghcr.io/{0}-executables:latest-{1}', steps.downcase_repo.outputs.repo, matrix.arch) || '' }}
            ${{ steps.tag_name.outputs.tag_latest != '' && format('ghcr.io/{0}-tools:latest-{1}', steps.downcase_repo.outputs.repo, matrix.arch) || '' }}
          # cache-from: type=gha
          # cache-to: type=gha,mode=max
          
      - name: Build and push tools + thirdparty image
        uses: docker/build-push-action@v5
        with:
          push: true # Will only build if this is not here
          file: dockerfiles/Dockerfile
          target: tools-thirdparty
          platforms: ${{ matrix.platform }}
          provenance: mode=max
          build-args: |
            NUM_BUILD_CORES=4
            BUILDKIT_CONTEXT_KEEP_GIT_DIR=1
            OPENMS_VERSION_TAG=${{ steps.tag_name.outputs.tag }}
          tags: |
            ghcr.io/${{ steps.downcase_repo.outputs.repo }}-tools-thirdparty:${{ steps.tag_name.outputs.tag }}-${{ matrix.arch }}
            ${{ steps.tag_name.outputs.tag_latest != '' && format('ghcr.io/{0}-tools-thirdparty:latest-{1}', steps.downcase_repo.outputs.repo, matrix.arch) || '' }}
          # cache-from: type=gha
          # cache-to: type=gha,mode=max

  create-manifests:
    needs: deploy-docker
    runs-on: ubuntu-latest
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifests
        run: |
          REPO="ghcr.io/${{ needs.deploy-docker.outputs.downcase_repo }}"
          TAG="${{ needs.deploy-docker.outputs.tag_name }}"
          TAG_LATEST="${{ needs.deploy-docker.outputs.tag_latest }}"

          # Main tag
          docker manifest rm $REPO-library:$TAG 2>/dev/null || true
          docker manifest create $REPO-library:$TAG \
            $REPO-library:$TAG-amd64 \
            $REPO-library:$TAG-arm64
          docker manifest push $REPO-library:$TAG

          docker manifest rm $REPO-executables:$TAG 2>/dev/null || true
          docker manifest create $REPO-executables:$TAG \
            $REPO-executables:$TAG-amd64 \
            $REPO-executables:$TAG-arm64
          docker manifest push $REPO-executables:$TAG

          docker manifest rm $REPO-tools:$TAG 2>/dev/null || true
          docker manifest create $REPO-tools:$TAG \
            $REPO-tools:$TAG-amd64 \
            $REPO-tools:$TAG-arm64
          docker manifest push $REPO-tools:$TAG

          docker manifest rm $REPO-tools-thirdparty:$TAG 2>/dev/null || true
          docker manifest create $REPO-tools-thirdparty:$TAG \
            $REPO-tools-thirdparty:$TAG-amd64 \
            $REPO-tools-thirdparty:$TAG-arm64
          docker manifest push $REPO-tools-thirdparty:$TAG

          # Latest tag (if exists)
          if [ -n "$TAG_LATEST" ]; then
            docker manifest rm $REPO-library:latest 2>/dev/null || true
            docker manifest create $REPO-library:latest \
              $REPO-library:latest-amd64 \
              $REPO-library:latest-arm64
            docker manifest push $REPO-library:latest

            docker manifest rm $REPO-executables:latest 2>/dev/null || true
            docker manifest create $REPO-executables:latest \
              $REPO-executables:latest-amd64 \
              $REPO-executables:latest-arm64
            docker manifest push $REPO-executables:latest

            docker manifest rm $REPO-tools:latest 2>/dev/null || true
            docker manifest create $REPO-tools:latest \
              $REPO-tools:latest-amd64 \
              $REPO-tools:latest-arm64
            docker manifest push $REPO-tools:latest

            docker manifest rm $REPO-tools-thirdparty:latest 2>/dev/null || true
            docker manifest create $REPO-tools-thirdparty:latest \
              $REPO-tools-thirdparty:latest-amd64 \
              $REPO-tools-thirdparty:latest-arm64
            docker manifest push $REPO-tools-thirdparty:latest
          fi

  deploy-singularity:
    runs-on: ${{ matrix.os }}
    needs: [deploy-docker, create-manifests]
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            arch: amd64
          - os: ubuntu-22.04-arm
            arch: arm64
    steps:
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libglib2.0-dev          

    - name: Singularity install
      uses: singularityhub/install-singularity@main
      with:
        singularity-version: '3.11.5'

    - name: Build arch-specific SIFs
      shell: bash
      run: |
        sudo singularity build library-${{ matrix.arch }}.sif docker://ghcr.io/${{ needs.deploy-docker.outputs.downcase_repo }}-library:${{ needs.deploy-docker.outputs.tag_name }}-${{ matrix.arch }}
        sudo singularity build executables-${{ matrix.arch }}.sif docker://ghcr.io/${{ needs.deploy-docker.outputs.downcase_repo }}-executables:${{ needs.deploy-docker.outputs.tag_name }}-${{ matrix.arch }}
        sudo singularity build executables-thirdparty-${{ matrix.arch }}.sif docker://ghcr.io/${{ needs.deploy-docker.outputs.downcase_repo }}-tools-thirdparty:${{ needs.deploy-docker.outputs.tag_name }}-${{ matrix.arch }}

    - name: Upload arch-specific SIFs
      shell: bash
      run: |
        echo ${{ secrets.GITHUB_TOKEN }} | singularity remote login -u jpfeuffer --password-stdin oras://ghcr.io
        singularity push library-${{ matrix.arch }}.sif oras://ghcr.io/${{ needs.deploy-docker.outputs.downcase_repo }}-library-sif:${{ needs.deploy-docker.outputs.tag_name }}-${{ matrix.arch }}
        singularity push executables-${{ matrix.arch }}.sif oras://ghcr.io/${{ needs.deploy-docker.outputs.downcase_repo }}-executables-sif:${{ needs.deploy-docker.outputs.tag_name }}-${{ matrix.arch }}
        singularity push executables-thirdparty-${{ matrix.arch }}.sif oras://ghcr.io/${{ needs.deploy-docker.outputs.downcase_repo }}-tools-thirdparty-sif:${{ needs.deploy-docker.outputs.tag_name }}-${{ matrix.arch }}

    - name: Upload arch-specific SIFs as latest
      if: ${{ needs.deploy-docker.outputs.tag_latest != '' }}
      shell: bash
      run: |
        echo ${{ secrets.GITHUB_TOKEN }} | singularity remote login -u jpfeuffer --password-stdin oras://ghcr.io
        singularity push library-${{ matrix.arch }}.sif oras://ghcr.io/${{ needs.deploy-docker.outputs.downcase_repo }}-library-sif:latest-${{ matrix.arch }}
        singularity push executables-${{ matrix.arch }}.sif oras://ghcr.io/${{ needs.deploy-docker.outputs.downcase_repo }}-executables-sif:latest-${{ matrix.arch }}
        singularity push executables-thirdparty-${{ matrix.arch }}.sif oras://ghcr.io/${{ needs.deploy-docker.outputs.downcase_repo }}-tools-thirdparty-sif:latest-${{ matrix.arch }}
