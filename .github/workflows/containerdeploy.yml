name: Deploy container images
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Name to publish the containers under in ghcr.io (e.g. 3.6.0-rc1, my-test). Run the workflow from the branch/commit you want to package. Leave empty to auto-derive (develop/nightly -> latest)."
        required: false
        default: ""
  push:
    branches:
      - nightly
    tags:
      - 'v[0-9]*'
      - "Release*"
      - "Release/*"

jobs:
  # Each matrix leg builds one platform and pushes it to ghcr.io by digest
  # only (untagged). The tags are created afterwards in merge-docker-manifests,
  # which combines the per-platform digests into one multi-arch manifest list
  # per image. Pushing tags directly from the matrix legs would race: whichever
  # leg finishes last overwrites the tag with its single-arch image
  # (https://github.com/OpenMS/OpenMS/issues/9951). Pattern from
  # https://docs.docker.com/build/ci/github-actions/multi-platform/
  deploy-docker:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux/amd64
          - os: ubuntu-22.04-arm
            platform: linux/arm64
    outputs:
      tag_name: ${{ steps.tag_name.outputs.tag }}
      downcase_repo: ${{ steps.downcase_repo.outputs.repo }}
    steps:
      - name: Free up space on the runner
        run: |
          # see: https://github.com/actions/runner-images/issues/2840
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "/opt/ghc"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h
      - name: Define tag name
        shell: bash
        # Pass externally-influenced values through env so they are never
        # expanded into the shell script directly (avoids script injection).
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
            if [[ -n "$INPUT_TAG" ]]; then
              ## Manual run: publish under the user-provided name
              TAG="$INPUT_TAG"
            elif [[ "$REF" == refs/tags/* ]]; then
              ## Release tag (e.g. Release3.6.0 or Release/3.6.0) -> 3.6.0
              TAG="${REF_NAME#Release}"
              TAG="${TAG#/}"
            elif [[ "$REF_NAME" == "develop" || "$REF_NAME" == "nightly" || "$REF_NAME" == "feat/singularity" ]]; then
              ## use latest to follow docker conventions
              TAG="latest"
            else
              ## Remove release/ from release branch name (or keep the non-release name)
              TAG="${REF_NAME#release/}"
            fi
            ## Docker/OCI tags may not contain '/' and have a limited charset
            TAG="${TAG//[^a-zA-Z0-9._-]/_}"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
        id: tag_name
      - name: Downcase REPO
        run: echo "repo=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT
        id: downcase_repo
      - name: Sanitize platform name for the digests artifact
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          # No authenticated git operations follow; the later steps only build
          # and push Docker images. Avoid leaving the token in the workspace.
          persist-credentials: false
      - name: Test docker build in runtime base
        uses: docker/build-push-action@v7
        with:
          load: true # so other build steps can make use of cache layers from this build
          file: dockerfiles/Dockerfile
          target: test
          platforms: ${{ matrix.platform }}
          build-args: |
            NUM_BUILD_CORES=4
            BUILDKIT_CONTEXT_KEEP_GIT_DIR=1
            OPENMS_VERSION_TAG=${{ steps.tag_name.outputs.tag }}
          # cache-from: type=gha
          # cache-to: type=gha,mode=max
      - name: Build and push library image by digest
        id: build-library
        uses: docker/build-push-action@v7
        with:
          file: dockerfiles/Dockerfile
          target: library
          platforms: ${{ matrix.platform }}
          provenance: mode=max
          build-args: |
            NUM_BUILD_CORES=4
            BUILDKIT_CONTEXT_KEEP_GIT_DIR=1
            OPENMS_VERSION_TAG=${{ steps.tag_name.outputs.tag }}
          outputs: type=image,name=ghcr.io/${{ steps.downcase_repo.outputs.repo }}-library,push-by-digest=true,name-canonical=true,push=true
          # cache-from: type=gha
          # cache-to: type=gha,mode=max
      - name: Build and push tools image by digest
        id: build-tools
        uses: docker/build-push-action@v7
        with:
          file: dockerfiles/Dockerfile
          target: tools
          platforms: ${{ matrix.platform }}
          provenance: mode=max
          build-args: |
            NUM_BUILD_CORES=4
            BUILDKIT_CONTEXT_KEEP_GIT_DIR=1
            OPENMS_VERSION_TAG=${{ steps.tag_name.outputs.tag }}
          # The tools image is published under two names; push the digest to
          # both repositories so each can be tagged from its own repository.
          outputs: type=image,"name=ghcr.io/${{ steps.downcase_repo.outputs.repo }}-executables,ghcr.io/${{ steps.downcase_repo.outputs.repo }}-tools",push-by-digest=true,name-canonical=true,push=true
          # cache-from: type=gha
          # cache-to: type=gha,mode=max
      - name: Build and push tools + thirdparty image by digest
        id: build-tools-thirdparty
        uses: docker/build-push-action@v7
        with:
          file: dockerfiles/Dockerfile
          target: tools-thirdparty
          platforms: ${{ matrix.platform }}
          provenance: mode=max
          build-args: |
            NUM_BUILD_CORES=4
            BUILDKIT_CONTEXT_KEEP_GIT_DIR=1
            OPENMS_VERSION_TAG=${{ steps.tag_name.outputs.tag }}
          outputs: type=image,name=ghcr.io/${{ steps.downcase_repo.outputs.repo }}-tools-thirdparty,push-by-digest=true,name-canonical=true,push=true
          # cache-from: type=gha
          # cache-to: type=gha,mode=max
      - name: Export image digests
        env:
          DIGEST_LIBRARY: ${{ steps.build-library.outputs.digest }}
          DIGEST_TOOLS: ${{ steps.build-tools.outputs.digest }}
          DIGEST_TOOLS_THIRDPARTY: ${{ steps.build-tools-thirdparty.outputs.digest }}
        run: |
          set -euo pipefail
          for digest_var in DIGEST_LIBRARY DIGEST_TOOLS DIGEST_TOOLS_THIRDPARTY; do
            if [[ -z "${!digest_var}" ]]; then
              echo "::error::Build did not report a digest for ${digest_var}"
              exit 1
            fi
          done
          mkdir -p "${RUNNER_TEMP}/digests/library" "${RUNNER_TEMP}/digests/tools" "${RUNNER_TEMP}/digests/tools-thirdparty"
          touch "${RUNNER_TEMP}/digests/library/${DIGEST_LIBRARY#sha256:}"
          touch "${RUNNER_TEMP}/digests/tools/${DIGEST_TOOLS#sha256:}"
          touch "${RUNNER_TEMP}/digests/tools-thirdparty/${DIGEST_TOOLS_THIRDPARTY#sha256:}"
      - name: Upload image digests
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1
          overwrite: true
  merge-docker-manifests:
    runs-on: ubuntu-latest
    needs: deploy-docker
    steps:
      - name: Download image digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push multi-arch manifest lists
        shell: bash
        working-directory: ${{ runner.temp }}/digests
        env:
          REPO_BASE: ghcr.io/${{ needs.deploy-docker.outputs.downcase_repo }}
          TAG: ${{ needs.deploy-docker.outputs.tag_name }}
        run: |
          set -euo pipefail
          create_manifest() {
            local digest_dir="$1" image_repo="$2"
            local sources=()
            for digest_file in "${digest_dir}"/*; do
              sources+=("${image_repo}@sha256:$(basename "${digest_file}")")
            done
            docker buildx imagetools create --tag "${image_repo}:${TAG}" "${sources[@]}"
            ## Fail loudly if the pushed manifest list misses a platform instead
            ## of publishing a silently single-arch tag again. Keep this list in
            ## sync with the deploy-docker matrix.
            local platforms
            platforms="$(docker buildx imagetools inspect \
              --format '{{range .Manifest.Manifests}}{{if .Platform}}{{.Platform.OS}}/{{.Platform.Architecture}}{{"\n"}}{{end}}{{end}}' \
              "${image_repo}:${TAG}")"
            echo "${image_repo}:${TAG} contains platforms:" "${platforms}"
            for platform in linux/amd64 linux/arm64; do
              if ! grep -qx "${platform}" <<< "${platforms}"; then
                echo "::error::${image_repo}:${TAG} is missing platform ${platform}"
                exit 1
              fi
            done
          }
          create_manifest library "${REPO_BASE}-library"
          ## The tools image is published under two names (see deploy-docker);
          ## its digests were pushed to both repositories.
          create_manifest tools "${REPO_BASE}-executables"
          create_manifest tools "${REPO_BASE}-tools"
          create_manifest tools-thirdparty "${REPO_BASE}-tools-thirdparty"
  deploy-singularity:
    runs-on: ubuntu-latest
    needs: [deploy-docker, merge-docker-manifests]
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # install glib2.0 development package needed by singularity
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev
      - name: Singularity install with defaults
        uses: singularityhub/install-singularity@main
        with:
          singularity-version: '3.11.5'
      - name: Build Singularity library image
        shell: bash
        run: |
            sudo singularity build library.sif docker://ghcr.io/${{ needs.deploy-docker.outputs.downcase_repo }}-library:${{ needs.deploy-docker.outputs.tag_name }}
      - name: Build Singularity tools image
        shell: bash
        run: |
            sudo singularity build executables.sif docker://ghcr.io/${{ needs.deploy-docker.outputs.downcase_repo }}-executables:${{ needs.deploy-docker.outputs.tag_name }}
      - name: Build Singularity tools + thirdparty image
        shell: bash
        run: |
            sudo singularity build executables-thirdparty.sif docker://ghcr.io/${{ needs.deploy-docker.outputs.downcase_repo }}-tools-thirdparty:${{ needs.deploy-docker.outputs.tag_name }}
      - name: Upload Singularity images to ghcr.io
        shell: bash
        run: |
            echo ${{ secrets.GITHUB_TOKEN }} | singularity remote login -u jpfeuffer --password-stdin oras://ghcr.io
            singularity push library.sif oras://ghcr.io/${{ needs.deploy-docker.outputs.downcase_repo }}-library-sif:${{ needs.deploy-docker.outputs.tag_name }}
            singularity push executables.sif oras://ghcr.io/${{ needs.deploy-docker.outputs.downcase_repo }}-executables-sif:${{ needs.deploy-docker.outputs.tag_name }}
            singularity push executables-thirdparty.sif oras://ghcr.io/${{ needs.deploy-docker.outputs.downcase_repo }}-tools-thirdparty-sif:${{ needs.deploy-docker.outputs.tag_name }}
