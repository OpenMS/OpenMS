name: "OpenMS Vcpkg CI"

on:
  workflow_dispatch:

jobs:
  configure-build-test:
    permissions:
      contents: read
    name: ${{ matrix.variant_name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - os: ubuntu-24.04
            compiler: g++
            compiler_ver: 13
            preset: linux-x64-ci
            variant_name: linux-x64-gcc

          - os: ubuntu-24.04
            compiler: clang++
            compiler_ver: 18
            preset: linux-x64-ci
            variant_name: linux-x64-clang

          - os: ubuntu-24.04-arm
            compiler: g++
            compiler_ver: 13
            preset: linux-arm64-ci
            variant_name: linux-arm64-gcc
          
          - os: macos-15
            compiler: xcode
            compiler_ver: "16.4"
            preset: macos-arm64-ci
            variant_name: macos-arm64-xcode

          - os: windows-2025
            compiler: cl.exe
            compiler_ver: "14.51"
            preset: windows-x64-ci
            variant_name: windows-x64-msvc

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - uses: lukka/get-cmake@latest

      - name: Emulate a Visual Studio shell (Windows)
        if: startsWith(matrix.os, 'windows')
        uses: egor-tensin/vs-shell@v2
        with:
          arch: x64

      - name: Install build dependencies
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            sudo add-apt-repository universe
            sudo apt-get update
            sudo apt-get -qq install -y \
              build-essential \
              ninja-build \
              autoconf \
              autoconf-archive \
              automake \
              ccache \
              libtool \
              patch \
              mono-complete \
            
            if [[ "${{ matrix.compiler }}" == clang* ]]; then
            sudo apt-get -qq install -y libomp-${{ matrix.compiler_ver }}-dev \
              clang-${{ matrix.compiler_ver }}
            fi
          
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            brew update

            brew install \
              ccache \
              ninja \
              bison \
              flex \
              autoconf \
              autoconf-archive \
              automake \
              libtool \
              pkg-config \
              mono \
              bash \
              uv
            
            echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
            echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"

          elif [[ "${{ runner.os }}" == "Windows" ]]; then

            choco install -y --no-progress \
              ccache
          fi

      - name: Add Homebrew to PATH
        if: runner.os == 'macOS'
        shell: bash
        run: |
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: Add THIRDPARTY
        shell: bash
        run: |
          # initialize THIRDPARTY
          git submodule update --init THIRDPARTY

          # add third-party binaries to PATH
          # use flat THIRDPARTY structure
          mkdir -p _thirdparty

          tp_folder=${{ runner.os }}
          if [ "$tp_folder" = "macOS" ]; then
            tp_folder=MacOS
          fi

          # Copy the correct architecture
          cp -R "THIRDPARTY/$tp_folder/$(uname -m)"/* _thirdparty/

          # Copy architecture independent tools
          cp -R THIRDPARTY/All/* _thirdparty/

          # add third-party binaries to PATH
          for thirdpartytool in '${{ github.workspace }}/_thirdparty'/*; do
            if [ "${{ runner.os }}" = "Windows" ]; then
              echo "${thirdpartytool//\//\\}" >> "$GITHUB_PATH"
            else
              echo "${thirdpartytool}" >> "$GITHUB_PATH"
            fi
          done

      - name: Percolator sanity check
        shell: bash
        run: |
          echo "--- percolator -h ---"
          percolator -h
          echo "exit: $?"
          echo "--- env vars ---"
          echo "PERCOLATOR_BINARY=${PERCOLATOR_BINARY:-<unset>}"
          echo "PERCOLATOR_ADAPTER_BINARY=${PERCOLATOR_ADAPTER_BINARY:-<unset>}"

      - name: Select compiler
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == macos* ]]; then
            sudo xcode-select -s "/Applications/Xcode_${{ matrix.compiler_ver }}.app/Contents/Developer"
            echo "CC=$(xcrun -f clang)" >> $GITHUB_ENV
            echo "CXX=$(xcrun -f clang++)" >> $GITHUB_ENV
          elif [[ "${{ matrix.compiler }}" == clang* ]]; then
            echo "CC=clang-${{ matrix.compiler_ver }}" >> $GITHUB_ENV
            echo "CXX=clang++-${{ matrix.compiler_ver }}" >> $GITHUB_ENV
          elif [[ "${{ runner.os }}" == "Windows" ]]; then
            echo "CC=cl.exe" >> $GITHUB_ENV
            echo "CXX=cl.exe" >> $GITHUB_ENV
          else
            echo "CC=gcc-${{ matrix.compiler_ver }}" >> $GITHUB_ENV
            echo "CXX=g++-${{ matrix.compiler_ver }}" >> $GITHUB_ENV
          fi

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          doNotCache: true

      - name: Disable vcpkg binary cache
        run: |
          echo "VCPKG_BINARY_SOURCES=clear" >> "$GITHUB_ENV"

      - name: Run CMake consuming CMakePreset.json and run vcpkg to build packages
        uses: lukka/run-cmake@v10
        with:
          configurePreset: ${{ matrix.preset }}
          buildPreset: ${{ matrix.preset }}
          testPreset: ${{ matrix.preset }}
      - name: Post percolator sanity check
        if: always()
        shell: bash
        run: |
          echo "--- env vars ---"
          echo "PERCOLATOR_BINARY=${PERCOLATOR_BINARY:-<unset>}"
          echo "PERCOLATOR_ADAPTER_BINARY=${PERCOLATOR_ADAPTER_BINARY:-<unset>}"
          grep -i percolator "${{ github.workspace }}/build/${{ matrix.preset }}/CMakeCache.txt"
