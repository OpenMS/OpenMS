name: Deploy to Bioconda

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy from"
        required: true
        default: "nightly"
  push:
    branches:
      - nightly

jobs:
  bioconda-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -le {0}  # Important! Use login shell for proper conda initialization

    steps:
      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: bioconda_env
          auto-update-conda: true
          python-version: "3.12"
          channels: conda-forge,bioconda,defaults
          channel-priority: true

      - name: Prepare output directory
        run: |
          mkdir -p $GITHUB_WORKSPACE/output/noarch
          mkdir -p $GITHUB_WORKSPACE/output/linux-64
          touch $GITHUB_WORKSPACE/output/noarch/repodata.json
          conda install bioconda-utils conda-index -y
          python -m conda_index $GITHUB_WORKSPACE/output
          # Register the local output directory as a conda channel so that
          # host-side metadata finalization can resolve packages built in
          # earlier steps (e.g. pyopenms finding libopenms==3.6.0dev).
          # Without this, only the Docker container sees the local channel.
          conda config --add channels file://$GITHUB_WORKSPACE/output
          ls -l
          ls -l $GITHUB_WORKSPACE/output

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Clone Bioconda recipes and overlay our dev recipes onto current bioconda/master
        run: |
          git clone https://github.com/OpenMS/bioconda-recipes.git bioconda-recipes
          cd bioconda-recipes
          git remote add bioconda https://github.com/bioconda/bioconda-recipes.git
          git fetch bioconda master
          # Start from a pristine, current bioconda/master (up-to-date build tooling,
          # global config and common scripts) and overlay ONLY the two recipe
          # directories OpenMS maintains. This replaces the previous
          # `git rebase bioconda/master`, which recurrently hard-failed with a merge
          # conflict whenever upstream touched recipes/pyopenms/meta.yaml -- e.g. right
          # after a new pyopenms release landed in master -- because the carried
          # dev-version commit could no longer be replayed cleanly onto the drifted base.
          # Overlaying the recipe dirs wholesale keeps the hand-maintained dev recipe as
          # the source of truth (no fragile patch regeneration) and can never conflict.
          # --no-overlay makes each dir an EXACT mirror of the nightly version, so any
          # master-only files in those dirs (e.g. a stale upstream build_failure.*.yaml
          # for the released version) are removed rather than silently retained.
          # See OpenMS/OpenMS#9721 (and the earlier recurrences #6989, #6201).
          git checkout -B nightly bioconda/master
          git checkout --no-overlay origin/nightly -- recipes/pyopenms recipes/openms-meta
          echo "=== OpenMS dev recipes overlaid on top of bioconda/master ==="
          git --no-pager diff --stat bioconda/master -- recipes/pyopenms recipes/openms-meta

      - name: Lint and build OpenMS Bioconda packages
        run: |
          cd bioconda-recipes
          bioconda-utils lint --packages pyopenms openms-meta
          bioconda-utils build --docker --pkg-dir $GITHUB_WORKSPACE/output --packages openms-meta || true
          python -m conda_index $GITHUB_WORKSPACE/output

      - name: Build pyopenms package
        run: |
          cd bioconda-recipes
          bioconda-utils build --docker --mulled-test --pkg-dir $GITHUB_WORKSPACE/output --packages pyopenms || true
          python -m conda_index $GITHUB_WORKSPACE/output

      - name: Upload Conda packages
        run: |
          pip install "anaconda-client>=1.14"  # bioconda-utils pulls 1.13.x which still uses removed pkg_resources
          ls -l $GITHUB_WORKSPACE/output
          shopt -s nullglob
          pkgs=($GITHUB_WORKSPACE/output/linux-64/*.tar.bz2 $GITHUB_WORKSPACE/output/linux-64/*.conda)
          if [ ${#pkgs[@]} -gt 0 ]; then
            anaconda -v -t ${{ secrets.ANACONDA_TOKEN }} upload -u openms --no-progress --force "${pkgs[@]}"
          else
            echo "No packages found to upload!"
            exit 1
          fi
