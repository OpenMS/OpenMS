name: Deploy to Bioconda

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy from"
        required: true
        default: "nightly"
  push:
    branches:
      - nightly

jobs:
  bioconda-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -le {0}  # Important! Use login shell for proper conda initialization

    steps:
      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: bioconda_env
          auto-update-conda: true
          # Deliberately no python-version: bioconda-utils is built for exactly one
          # python minor per release (4.2.0+ is python 3.13 only), so pinning python
          # here silently caps which bioconda-utils the solver may pick. That is what
          # broke #9905 -- python 3.12 held bioconda-utils at 4.1.0 and with it a
          # conda-forge-pinning snapshot from 2024. Letting conda choose the python
          # keeps this from recurring when bioconda-utils moves to 3.14.
          channels: conda-forge,bioconda,defaults
          channel-priority: true

      - name: Prepare output directory
        run: |
          mkdir -p $GITHUB_WORKSPACE/output/noarch
          mkdir -p $GITHUB_WORKSPACE/output/linux-64
          touch $GITHUB_WORKSPACE/output/noarch/repodata.json
          # Deliberately unpinned, including conda-forge-pinning. This nightly exists
          # to mimic upstream bioconda and surface breakage against the pinnings they
          # currently build with, so it has to track whatever bioconda-utils is
          # current. bioconda-utils declares the conda-forge-pinning snapshot it
          # wants, so that version decides the pinning; constraining either one here
          # would hide exactly the breakage this workflow is meant to catch.
          conda install bioconda-utils conda-index -y
          # #9905 was a *silent* downgrade to a bioconda-utils carrying a 2024
          # pinning, which is invisible unless you read the solver output. Record the
          # resolved versions so the next such drift is one grep away in the log.
          # python is included deliberately: it is the lever that caused #9905, since
          # each bioconda-utils release is built for exactly one python minor.
          echo "--- resolved build tooling ---"
          conda list --export | grep -E '^(python|bioconda-utils|conda-forge-pinning|conda-build|conda-index)=' || true
          # Prefer the build-env image matching the bioconda-utils we just resolved;
          # `--docker` derives that tag itself, but the image is published to quay.io
          # some time after the conda package, so a brand new release would fail the
          # pull (4.5.0 was current on the bioconda channel with no image tag on
          # 2026-08-12). Fall back to the rolling `latest` tag during that window.
          # Nothing is pinned here -- the tag tracks whatever we actually installed.
          #
          # Ask quay's API rather than `docker manifest inspect`: the API separates
          # "tag is not published" (HTTP 200 with an empty tag list) from "we could
          # not find out" (curl fails), which a single exit status cannot, and it
          # does not depend on `docker manifest` being enabled on the runner.
          image_repo=quay.io/bioconda/bioconda-utils-build-env-cos7
          tag_api="https://quay.io/api/v1/repository/bioconda/bioconda-utils-build-env-cos7/tag/"
          bu_version=$(conda list --export | sed -n 's/^bioconda-utils=\([^=]*\)=.*/\1/p')
          image_tag=latest
          if [ -n "$bu_version" ]; then
            for attempt in 1 2 3; do
              if tags=$(curl -fsSL --max-time 30 "${tag_api}?onlyActiveTags=true&specificTag=${bu_version}"); then
                if printf '%s' "$tags" | grep -q "\"name\": *\"${bu_version}\""; then
                  image_tag=$bu_version
                else
                  echo "quay.io has no build-env image for bioconda-utils ${bu_version} yet"
                fi
                break
              fi
              # Only a lookup failure is retried. Staying on :latest is a safe
              # outcome, so a flaky registry must not fail the nightly outright.
              echo "quay.io tag lookup failed (attempt ${attempt}/3)"
              if [ "$attempt" -lt 3 ]; then sleep $((attempt * 5)); fi
            done
          fi
          echo "Using build-env image ${image_repo}:${image_tag} (bioconda-utils ${bu_version:-unknown})"
          echo "BUILD_ENV_IMAGE=${image_repo}:${image_tag}" >> $GITHUB_ENV
          python -m conda_index $GITHUB_WORKSPACE/output
          # Register the local output directory as a conda channel so that
          # host-side metadata finalization can resolve packages built in
          # earlier steps (e.g. pyopenms finding libopenms==3.6.0dev).
          # Without this, only the Docker container sees the local channel.
          conda config --add channels file://$GITHUB_WORKSPACE/output
          ls -l
          ls -l $GITHUB_WORKSPACE/output

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Clone Bioconda recipes repository and add our changes (e.g., version with 'dev') on top of it
        run: |
          git clone https://github.com/OpenMS/bioconda-recipes.git bioconda-recipes
          cd bioconda-recipes
          git checkout -b nightly origin/nightly
          git remote add bioconda https://github.com/bioconda/bioconda-recipes.git
          git fetch bioconda master
          # Use a merge, not a rebase, to integrate upstream bioconda/master.
          # Rebase replays our nightly branch's commits one at a time, in their
          # original historical order, onto today's master. Since our nightly
          # branch already periodically merges upstream (so its tip is already
          # reconciled with a past state of master), replaying an older nightly
          # commit in isolation reintroduces conflicts upstream and nightly
          # resolved together long ago -- even though the two tips merge
          # cleanly. A merge diffs tip-vs-tip once instead of replaying stale
          # history, so it only conflicts on genuinely unresolved changes.
          git merge --no-edit bioconda/master

      # BUILD_ENV_IMAGE comes from the preflight in "Prepare output directory".
      - name: Lint and build OpenMS Bioconda packages
        run: |
          cd bioconda-recipes
          # bioconda-utils' --packages option must be repeated per package: it is a
          # Typer list option (one value per flag), not a single flag taking several
          # space-separated values. Passing "--packages pyopenms openms-meta" makes
          # "openms-meta" the positional recipe_folder argument instead of a second
          # package, which then fails with "path 'openms-meta' does not exist".
          bioconda-utils lint --packages pyopenms --packages openms-meta
          bioconda-utils build --docker --package-dir $GITHUB_WORKSPACE/output --packages openms-meta
          python -m conda_index $GITHUB_WORKSPACE/output

      - name: Build pyopenms package
        run: |
          cd bioconda-recipes
          bioconda-utils build --docker --mulled-test --package-dir $GITHUB_WORKSPACE/output --packages pyopenms
          python -m conda_index $GITHUB_WORKSPACE/output

      - name: Upload Conda packages
        run: |
          # Safety net: anaconda-client 1.13.x still uses the removed pkg_resources.
          # Current bioconda-utils already requires 1.14.*, so this is normally a
          # no-op; it only matters if the solver lands on an older one.
          pip install "anaconda-client>=1.14"
          ls -l $GITHUB_WORKSPACE/output
          shopt -s nullglob
          pkgs=($GITHUB_WORKSPACE/output/linux-64/*.tar.bz2 $GITHUB_WORKSPACE/output/linux-64/*.conda)
          if [ ${#pkgs[@]} -gt 0 ]; then
            anaconda -v -t ${{ secrets.ANACONDA_TOKEN }} upload -u openms --no-progress --force "${pkgs[@]}"
          else
            echo "No packages found to upload!"
            exit 1
          fi

  # The job above is the only thing that exercises the Bioconda recipes against
  # OpenMS develop, and until now a red night reported to nobody: the run is
  # dispatched by update_nightly.yml with GITHUB_TOKEN rather than owned by a
  # person, so no failure notification reaches an inbox. Both 2026 breakages
  # were found by hand, long after the nightly had caught them -- the
  # should_be_noarch_generic lint ran red from 2026-09-06, and the openms
  # package shipping no libOpenMS_CLI.so from 2026-09-17. The nightly did its
  # job on the first night each time; only the telling was missing.
  #
  # So turn the result into one tracking issue: opened on the first red night,
  # commented on each further one, closed when the nightly is green again. One
  # issue rather than one per night, because the interesting signal is "still
  # broken since <date>", not a pile of duplicates.
  report-status:
    needs: bioconda-deploy
    # always(), not failure(): a green night has to be able to close the issue
    # the red ones opened, otherwise it outlives the breakage.
    if: always()
    # The report must never change the verdict it reports on. Without this, an
    # issues:write refused by org policy, or a transient API error, would turn a
    # green nightly red and send everyone hunting for a packaging break that
    # never happened.
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Report nightly result
        uses: actions/github-script@v8
        env:
          DEPLOY_RESULT: ${{ needs.bioconda-deploy.result }}
        with:
          script: |
            const LABEL = 'bioconda-nightly';
            const TITLE = 'Nightly Bioconda deploy is failing';
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const result = process.env.DEPLOY_RESULT;

            // Only a clean pass or fail says anything about the recipes. A
            // cancelled or skipped run must neither open nor close an issue:
            // doing so would report breakage that was never observed, or
            // declare a fix that was never built.
            if (result !== 'success' && result !== 'failure') {
              core.info(`bioconda-deploy was '${result}'; nothing to report.`);
              return;
            }

            const tracking = (await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: LABEL, per_page: 100,
            })).find(issue => !issue.pull_request) ?? null;

            if (result === 'success') {
              if (!tracking) {
                core.info('Nightly is green and no tracking issue is open.');
                return;
              }
              await github.rest.issues.createComment({
                owner, repo, issue_number: tracking.number,
                body: `Nightly is green again: ${runUrl}`,
              });
              await github.rest.issues.update({
                owner, repo, issue_number: tracking.number,
                state: 'closed', state_reason: 'completed',
              });
              core.info(`Closed #${tracking.number}.`);
              return;
            }

            // Name the steps that actually failed, so the issue is readable
            // without opening the run. 'latest' drops superseded attempts.
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner, repo, run_id: context.runId, filter: 'latest', per_page: 100,
            });
            const failed = jobs.flatMap(job =>
              (job.steps ?? [])
                .filter(step => step.conclusion === 'failure')
                .map(step => `- \`${job.name}\` → \`${step.name}\``));
            const details = [
              `- Run: ${runUrl}`,
              `- Commit: ${context.sha}`,
              ...(failed.length ? ['- Failed steps:', ...failed.map(l => `  ${l}`)] : []),
            ].join('\n');

            if (tracking) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: tracking.number,
                body: `Still failing.\n\n${details}`,
              });
              core.info(`Commented on #${tracking.number}.`);
              return;
            }

            // issues.create only attaches labels that already exist, so make
            // sure of it first -- otherwise the issue opens unlabelled and the
            // next night cannot find it and opens another one.
            try {
              await github.rest.issues.getLabel({ owner, repo, name: LABEL });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner, repo, name: LABEL, color: 'd73a4a',
                description: 'Automated: the nightly Bioconda deploy is red',
              });
            }

            const { data: issue } = await github.rest.issues.create({
              owner, repo, title: TITLE, labels: [LABEL],
              body: [
                'The nightly **Deploy to Bioconda** run is failing.',
                '',
                details,
                '',
                'Opened automatically on the first red night, commented on each',
                'further one, and closed once the nightly is green again.',
              ].join('\n'),
            });
            core.info(`Opened #${issue.number}.`);
