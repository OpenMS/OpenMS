name: "Build and Test"

on:
  workflow_dispatch:
    inputs:
      debug_windows:
        description: Open a tmate session after the Windows build (also on failure)
        type: boolean
        default: false
  push:
    branches:
      - nightly
      - release/*
  pull_request:
    branches:
      - develop

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            compiler: cl.exe
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build OpenMS
        uses: ./.github/actions/build
        with:
          compiler: ${{ matrix.compiler }}
          ssh_key: ${{ secrets.ARCHIVE_RRSYNC_SSH }}
          ssh_host: ${{ secrets.ARCHIVE_RRSYNC_HOST }}
          ssh_port: ${{ secrets.ARCHIVE_RRSYNC_PORT }}
          ssh_user: ${{ secrets.ARCHIVE_RRSYNC_USER }}

      - name: Debug Windows build with tmate
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && runner.os == 'Windows' && inputs.debug_windows }}
        uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113 # v3
        timeout-minutes: 30
        env:
          MSYS2_PATH_TYPE: inherit
        with:
          limit-access-to-actor: true
