name: "Build and Test"

on:
  workflow_dispatch:
    inputs:
      use_pch:
        description: "Build OpenMS libraries with precompiled headers"
        type: boolean
        default: false
      compiler_cache:
        description: "Compiler cache storage"
        type: choice
        options: [github, archive]
        default: github
  push:
    branches:
      - nightly
      - release/*
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  pch-compatibility:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: egor-tensin/vs-shell@v2
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Test PCH configuration and consumption
        shell: bash
        run: cmake -DBINARY_DIR="$RUNNER_TEMP/pch-test" -P src/tests/pch/run.cmake
      - name: Install ccache for the MSVC launcher test
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/ci/setup_pch_ccache.ps1
      - name: Test MSVC PCH with ccache
        if: runner.os == 'Windows'
        shell: bash
        env:
          CCACHE_SLOPPINESS: pch_defines,time_macros
        run: |
          cmake -DBINARY_DIR="$RUNNER_TEMP/pch-ccache-test" \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -P src/tests/pch/run.cmake

  header-set-compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install the minimum supported CMake version
        shell: bash
        run: |
          python -m pip install --target "$RUNNER_TEMP/cmake324" cmake==3.24.3
      - name: Test header sets with CMake 3.24
        shell: bash
        run: |
          "$RUNNER_TEMP/cmake324/cmake/data/bin/cmake" \
            -DBINARY_DIR="$RUNNER_TEMP/header-sets" \
            -DGENERATOR="Unix Makefiles" \
            -P src/tests/header_sets/run.cmake

  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            compiler: cl.exe
          - os: macos-15
            compiler: xcode
          - os: ubuntu-24.04
            compiler: g++
          - os: ubuntu-24.04-arm
            compiler: g++
          - os: ubuntu-24.04
            compiler: clang++
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build OpenMS
        uses: ./.github/actions/build
        with:
          compiler: ${{ matrix.compiler }}
          use_pch: ${{ inputs.use_pch && 'true' || 'false' }}
          compiler_cache: ${{ inputs.compiler_cache || 'github' }}
          ssh_key: ${{ secrets.ARCHIVE_RRSYNC_SSH }}
          ssh_host: ${{ secrets.ARCHIVE_RRSYNC_HOST }}
          ssh_port: ${{ secrets.ARCHIVE_RRSYNC_PORT }}
          ssh_user: ${{ secrets.ARCHIVE_RRSYNC_USER }}
