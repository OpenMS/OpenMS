# pyOpenMS wheel building using cibuildwheel
#
# This workflow builds pyOpenMS wheels for multiple Python versions and platforms
# using cibuildwheel. It requires OpenMS to be built first on each platform.
#
# Trigger: Release tags, nightly branch, develop PRs, or manual dispatch
#
# Thermo RAW support: every wheel is built with WITH_THERMO_RAW=ON. The managed half of
# openms-thermo-bridge (ThermoWrapperManaged.dll and the Thermo CommonCore assemblies) is
# taken from the bridge's pre-built release zip via tools/ci/fetch_thermo_assets.sh
# (retried, SHA-256 pinned, cached between runs) when one is published for the pinned
# bridge revision; otherwise the bridge publishes it with the .NET SDK during the OpenMS
# build (NuGet restore + Thermo package download). The Linux wheels take the bridge from
# the openms-thermo-bridge vcpkg port, which publishes the managed half the same way.
# Compiling the native bridge always needs the nethost headers from a .NET SDK. The
# finished wheels are smoke-tested by loading a real RAW file.

name: pyopenms-wheels-cibuildwheel

on:
  workflow_dispatch:
    inputs:
      upload-to-pypi:
        type: boolean
        description: Upload release package to pypi.org
        default: false
  push:
    tags:
      - 'v[0-9]*'
    branches: [nightly, py_nightly_test]
  pull_request:
    branches: [develop]

jobs:
  #----------------------------------------------------------------------------
  # Setup job to read Python versions and calculate package version
  #----------------------------------------------------------------------------
  setup:
    runs-on: ubuntu-latest
    outputs:
      python-versions: ${{ steps.set-versions.outputs.versions }}
      python-versions-array: ${{ steps.set-versions.outputs.versions-array }}
      pyopenms-version: ${{ steps.set-versions.outputs.pyopenms-version }}
      is-nightly: ${{ steps.set-versions.outputs.is-nightly }}
      abi3-python: ${{ steps.set-versions.outputs.abi3-python }}
      cibw-build-linux-x64: ${{ steps.set-versions.outputs.cibw-build-linux-x64 }}
      cibw-build-linux-arm64: ${{ steps.set-versions.outputs.cibw-build-linux-arm64 }}
      cibw-build-macos-arm64: ${{ steps.set-versions.outputs.cibw-build-macos-arm64 }}
      cibw-build-windows-x64: ${{ steps.set-versions.outputs.cibw-build-windows-x64 }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github/workflows/python_versions.json
            src/pyOpenMS/pyproject.toml
            CMakeLists.txt
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Read Python versions and calculate package version
        id: set-versions
        run: |
          # Output Python versions as JSON array for matrix (compact to single line)
          echo "versions=$(jq -c . .github/workflows/python_versions.json)" >> $GITHUB_OUTPUT
          # Output as space-separated for display
          echo "versions-array=$(jq -r '.[]' .github/workflows/python_versions.json | tr '\n' ' ')" >> $GITHUB_OUTPUT

          # The bindings are built in nanobind split mode against CPython's stable
          # ABI, so exactly one frontend is compiled per platform and the
          # resulting cp<N>-abi3 wheel covers every version in
          # python_versions.json. That file is therefore purely the *test*
          # matrix now; the compiled version comes from the ABI floor declared in
          # pyproject.toml, so the two cannot drift apart.
          # Capture only the value: the key name contains a digit of its own
          # ("abi3_..."), so matching every number on the line yields "3 311".
          ABI3_MIN=$(sed -nE 's/^[[:space:]]*abi3_minimum_cpython_version[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' \
                       src/pyOpenMS/pyproject.toml)
          # Match the exact shape rather than just "non-empty", so a duplicated
          # or malformed key fails here instead of producing a broken tag.
          if [[ ! "$ABI3_MIN" =~ ^[0-9]+$ ]]; then
            echo "::error::could not read a single numeric abi3_minimum_cpython_version from src/pyOpenMS/pyproject.toml (got '${ABI3_MIN}')"
            exit 1
          fi
          CIBW_PY="cp${ABI3_MIN}"
          echo "Compiling the ${CIBW_PY} frontend; wheels are tagged ${CIBW_PY}-abi3"
          echo "abi3-python=${CIBW_PY}" >> $GITHUB_OUTPUT

          # Pre-calculate CIBW_BUILD for each platform
          echo "cibw-build-linux-x64=${CIBW_PY}-manylinux_x86_64" >> $GITHUB_OUTPUT
          echo "cibw-build-linux-arm64=${CIBW_PY}-manylinux_aarch64" >> $GITHUB_OUTPUT
          echo "cibw-build-macos-arm64=${CIBW_PY}-macosx_arm64" >> $GITHUB_OUTPUT
          echo "cibw-build-windows-x64=${CIBW_PY}-win_amd64" >> $GITHUB_OUTPUT

          # Extract OpenMS version from CMakeLists.txt
          MAJOR=$(grep 'OPENMS_PACKAGE_VERSION_MAJOR' CMakeLists.txt | head -1 | sed 's/.*"\([0-9]*\)".*/\1/')
          MINOR=$(grep 'OPENMS_PACKAGE_VERSION_MINOR' CMakeLists.txt | head -1 | sed 's/.*"\([0-9]*\)".*/\1/')
          PATCH=$(grep 'OPENMS_PACKAGE_VERSION_PATCH' CMakeLists.txt | head -1 | sed 's/.*"\([0-9]*\)".*/\1/')
          BASE_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "Base OpenMS version: $BASE_VERSION"

          # For nightly builds (develop, nightly, py_nightly_test branches or PRs targeting those), append .devYYYYMMDD
          BRANCH_NAME="${{ github.ref_name }}"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BRANCH_NAME="${{ github.base_ref }}"
          fi
          if [[ "$BRANCH_NAME" == "develop" || "$BRANCH_NAME" == "nightly" || "$BRANCH_NAME" == "py_nightly_test" ]]; then
            DATE_SUFFIX=$(date +%Y%m%d)
            PYOPENMS_VERSION="${BASE_VERSION}.dev${DATE_SUFFIX}"
            echo "is-nightly=true" >> $GITHUB_OUTPUT
          else
            PYOPENMS_VERSION="${BASE_VERSION}"
            echo "is-nightly=false" >> $GITHUB_OUTPUT
          fi

          echo "pyopenms-version=${PYOPENMS_VERSION}" >> $GITHUB_OUTPUT
          echo "pyOpenMS version: $PYOPENMS_VERSION"

  #----------------------------------------------------------------------------
  # Build OpenMS on each platform first
  #----------------------------------------------------------------------------
  # Linux x64: Build OpenMS and wheels in same job to preserve absolute library paths.
  # Both phases run in the stock manylinux image; the dependencies come from vcpkg,
  # built as static libraries (tools/ci/build_openms_manylinux.sh).
  build-wheels-linux:
    needs: [setup]
    runs-on: ubuntu-latest
    steps:
      # Cancel older builds if still running
      - uses: rokroskar/workflow-run-cleanup-action@ee1451b869ba1e381729b3d40489997021f0d562  # v0.3.3
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        if: "!startsWith(github.ref, 'refs/tags/') && github.ref != 'refs/heads/master' && github.ref != 'refs/heads/develop'"

      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Init vcpkg submodule
        run: git submodule update --init vcpkg

      # A cold vcpkg build (Arrow with the AWS SDK, Boost, ...) needs more disk than
      # the runner image leaves free. Nothing below uses these preinstalled toolchains:
      # the build runs in the manylinux container.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      # rclone is the cache action's read-only fallback when the SSH secrets are not
      # available (pull requests from forks).
      - name: Install the cache tools
        run: sudo apt-get -qq update && sudo apt-get -qq install -y rsync rclone

      # vcpkg binary cache, as in .github/actions/dependencies but under its own key:
      # the manylinux gcc-toolset is not the compiler the main CI builds with, so the
      # two sets of binaries never match, and the cache action replaces the whole
      # remote directory of a key when it saves. Saved when the job succeeds.
      - name: vcpkg binary cache
        uses: OpenMS/ci-tools/actions/rsync-cache@b0622a9a8ecfe12fa6e896795f45fddad12faa6c
        with:
          name: vcpkg-cache
          path: ${{ runner.temp }}/vcpkg-cache
          key: manylinux_2_34-${{ runner.arch }}-vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          ssh_key: ${{ secrets.ARCHIVE_RRSYNC_SSH }}
          ssh_host: ${{ secrets.ARCHIVE_RRSYNC_HOST }}
          ssh_port: ${{ secrets.ARCHIVE_RRSYNC_PORT }}
          ssh_user: ${{ secrets.ARCHIVE_RRSYNC_USER }}

      - name: Cache Thermo bridge assets
        uses: actions/cache@v4
        with:
          path: |
            thermo-managed
            thermo-testdata
          key: thermo-assets-linux-x64-${{ hashFiles('tools/ci/fetch_thermo_assets.sh') }}

      # Only the RAW test file is used here: the managed bridge assemblies come from
      # the openms-thermo-bridge vcpkg port. Idempotent: reuses cached files after
      # verifying their SHA-256, downloads (with retries) only what is missing.
      - name: Fetch Thermo RAW test file
        run: bash tools/ci/fetch_thermo_assets.sh linux-x64 "$GITHUB_WORKSPACE"

      - name: Build and install OpenMS in container
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/project" \
            -v "$RUNNER_TEMP/vcpkg-cache:/vcpkg-cache" \
            -e VCPKG_BINARY_SOURCES="clear;files,/vcpkg-cache,readwrite" \
            -w /project \
            quay.io/pypa/manylinux_2_34_x86_64 \
            bash tools/ci/build_openms_manylinux.sh /project

      - name: Upload vcpkg build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-logs-linux-x64
          path: |
            vcpkg/buildtrees/**/*.log
            vcpkg_installed/vcpkg/issue_body.md
          if-no-files-found: ignore

      - name: Set pyOpenMS version
        run: |
          # Update pyproject.toml with the calculated version (includes .devYYYYMMDD for nightlies)
          VERSION="${{ needs.setup.outputs.pyopenms-version }}"
          echo "Setting pyOpenMS version to: $VERSION"
          sed -i "s/^version = .*/version = \"${VERSION}\"/" src/pyOpenMS/pyproject.toml
          grep "^version" src/pyOpenMS/pyproject.toml

      - name: Build wheels with cibuildwheel
        uses: pypa/cibuildwheel@v3.3
        with:
          package-dir: src/pyOpenMS
          output-dir: wheelhouse
        env:
          CIBW_BUILD: ${{ needs.setup.outputs.cibw-build-linux-x64 }}
          CIBW_MANYLINUX_X86_64_IMAGE: quay.io/pypa/manylinux_2_34_x86_64
          # dotnet-runtime-8.0: the wheel test suite loads a Thermo RAW file. EPEL is
          # not needed and its mirrors can be out of sync (tools/ci/build_openms_manylinux.sh).
          CIBW_BEFORE_ALL: dnf install -y --disablerepo='epel*' ninja-build dotnet-runtime-8.0
          # Use install directory with stripped libraries, and the vcpkg tree it was
          # built against (Arrow, Boost and Eigen for the bindings).
          # PYOPENMS_THERMO_RAW_TEST_FILE enables the Thermo RAW tests in the wheel test suite.
          CIBW_ENVIRONMENT: >-
            OpenMS_ROOT=/project/install
            CMAKE_PREFIX_PATH=/project/vcpkg_installed/x64-linux:/project/install
            CMAKE_BUILD_PARALLEL_LEVEL=2
            DOTNET_ROOT=/usr/lib64/dotnet
            PYOPENMS_THERMO_RAW_TEST_FILE=/project/thermo-testdata/Angiotensin_AllScans.raw
          CIBW_BUILD_VERBOSITY: 1

      # The dependencies are linked statically, so auditwheel should have grafted only
      # OpenMS's own libraries and system ones (libgomp, libgfortran, ...).
      - name: Show the libraries bundled into the wheel
        run: |
          python3 -m venv "$RUNNER_TEMP/auditwheel"
          "$RUNNER_TEMP/auditwheel/bin/pip" install -q auditwheel
          "$RUNNER_TEMP/auditwheel/bin/auditwheel" show wheelhouse/*.whl
          unzip -l wheelhouse/*.whl | grep -E '\.libs/' || true

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-x64
          path: wheelhouse/*.whl

  # Linux ARM64: Build OpenMS and wheels in same job to preserve absolute library paths.
  # Both phases run in the stock manylinux image; the dependencies come from vcpkg,
  # built as static libraries (tools/ci/build_openms_manylinux.sh).
  build-wheels-linux-arm:
    needs: [setup]
    runs-on: ubuntu-22.04-arm
    steps:
      # Cancel older builds if still running
      - uses: rokroskar/workflow-run-cleanup-action@ee1451b869ba1e381729b3d40489997021f0d562  # v0.3.3
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        if: "!startsWith(github.ref, 'refs/tags/') && github.ref != 'refs/heads/master' && github.ref != 'refs/heads/develop'"

      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Init vcpkg submodule
        run: git submodule update --init vcpkg

      # A cold vcpkg build (Arrow with the AWS SDK, Boost, ...) needs more disk than
      # the runner image leaves free. Nothing below uses these preinstalled toolchains:
      # the build runs in the manylinux container.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      # rclone is the cache action's read-only fallback when the SSH secrets are not
      # available (pull requests from forks).
      - name: Install the cache tools
        run: sudo apt-get -qq update && sudo apt-get -qq install -y rsync rclone

      # vcpkg binary cache, as in .github/actions/dependencies but under its own key:
      # the manylinux gcc-toolset is not the compiler the main CI builds with, so the
      # two sets of binaries never match, and the cache action replaces the whole
      # remote directory of a key when it saves. Saved when the job succeeds.
      - name: vcpkg binary cache
        uses: OpenMS/ci-tools/actions/rsync-cache@b0622a9a8ecfe12fa6e896795f45fddad12faa6c
        with:
          name: vcpkg-cache
          path: ${{ runner.temp }}/vcpkg-cache
          key: manylinux_2_34-${{ runner.arch }}-vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          ssh_key: ${{ secrets.ARCHIVE_RRSYNC_SSH }}
          ssh_host: ${{ secrets.ARCHIVE_RRSYNC_HOST }}
          ssh_port: ${{ secrets.ARCHIVE_RRSYNC_PORT }}
          ssh_user: ${{ secrets.ARCHIVE_RRSYNC_USER }}

      - name: Cache Thermo bridge assets
        uses: actions/cache@v4
        with:
          path: |
            thermo-managed
            thermo-testdata
          key: thermo-assets-linux-arm64-${{ hashFiles('tools/ci/fetch_thermo_assets.sh') }}

      # Only the RAW test file is used here: the managed bridge assemblies come from
      # the openms-thermo-bridge vcpkg port. Idempotent: reuses cached files after
      # verifying their SHA-256, downloads (with retries) only what is missing.
      - name: Fetch Thermo RAW test file
        run: bash tools/ci/fetch_thermo_assets.sh linux-arm64 "$GITHUB_WORKSPACE"

      - name: Build and install OpenMS in container
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/project" \
            -v "$RUNNER_TEMP/vcpkg-cache:/vcpkg-cache" \
            -e VCPKG_BINARY_SOURCES="clear;files,/vcpkg-cache,readwrite" \
            -w /project \
            quay.io/pypa/manylinux_2_34_aarch64 \
            bash tools/ci/build_openms_manylinux.sh /project

      - name: Upload vcpkg build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-logs-linux-arm64
          path: |
            vcpkg/buildtrees/**/*.log
            vcpkg_installed/vcpkg/issue_body.md
          if-no-files-found: ignore

      - name: Set pyOpenMS version
        run: |
          # Update pyproject.toml with the calculated version (includes .devYYYYMMDD for nightlies)
          VERSION="${{ needs.setup.outputs.pyopenms-version }}"
          echo "Setting pyOpenMS version to: $VERSION"
          sed -i "s/^version = .*/version = \"${VERSION}\"/" src/pyOpenMS/pyproject.toml
          grep "^version" src/pyOpenMS/pyproject.toml

      - name: Build wheels with cibuildwheel
        uses: pypa/cibuildwheel@v3.3
        with:
          package-dir: src/pyOpenMS
          output-dir: wheelhouse
        env:
          CIBW_BUILD: ${{ needs.setup.outputs.cibw-build-linux-arm64 }}
          CIBW_MANYLINUX_AARCH64_IMAGE: quay.io/pypa/manylinux_2_34_aarch64
          # dotnet-runtime-8.0: the wheel test suite loads a Thermo RAW file. EPEL is
          # not needed and its mirrors can be out of sync (tools/ci/build_openms_manylinux.sh).
          CIBW_BEFORE_ALL: dnf install -y --disablerepo='epel*' ninja-build dotnet-runtime-8.0
          # Use install directory with stripped libraries, and the vcpkg tree it was
          # built against (Arrow, Boost and Eigen for the bindings).
          # PYOPENMS_THERMO_RAW_TEST_FILE enables the Thermo RAW tests in the wheel test suite.
          CIBW_ENVIRONMENT: >-
            OpenMS_ROOT=/project/install
            CMAKE_PREFIX_PATH=/project/vcpkg_installed/arm64-linux:/project/install
            CMAKE_BUILD_PARALLEL_LEVEL=2
            DOTNET_ROOT=/usr/lib64/dotnet
            PYOPENMS_THERMO_RAW_TEST_FILE=/project/thermo-testdata/Angiotensin_AllScans.raw
          CIBW_BUILD_VERBOSITY: 1

      # The dependencies are linked statically, so auditwheel should have grafted only
      # OpenMS's own libraries and system ones (libgomp, libgfortran, ...).
      - name: Show the libraries bundled into the wheel
        run: |
          python3 -m venv "$RUNNER_TEMP/auditwheel"
          "$RUNNER_TEMP/auditwheel/bin/pip" install -q auditwheel
          "$RUNNER_TEMP/auditwheel/bin/auditwheel" show wheelhouse/*.whl
          unzip -l wheelhouse/*.whl | grep -E '\.libs/' || true

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-arm64
          path: wheelhouse/*.whl

  # macOS: Build OpenMS and wheels in same job to preserve absolute library paths for delocate
  build-wheels-macos:
    needs: [setup]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          bash tools/ci/deps-macos.sh --skip-doc-deps --skip-gui-deps

          # These dependencies are need only in this workflow:
          brew install \
            uv

          # These are now provided by vcpkg and thus removed from
          # `tools/ci/deps-macos.sh`:
          brew install \
            apache-arrow \
            boost \
            cbc \
            cgl \
            clp \
            coinutils \
            eigen \
            libomp \
            libsvm \
            libzip \
            sqlite \
            xerces-c \
            zstd

      # OpenMSThermoBridge needs the nethost headers/library from the .NET host
      # pack for osx-arm64 to compile the native bridge and, unless pre-built
      # assemblies are available (see below), the SDK to publish the managed
      # half; the action installs the SDK and exports DOTNET_ROOT, which is also
      # what the wheel test suite uses to find the runtime.
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache Thermo bridge assets
        uses: actions/cache@v4
        with:
          path: |
            thermo-managed
            thermo-testdata
          key: thermo-assets-osx-arm64-${{ hashFiles('tools/ci/fetch_thermo_assets.sh') }}

      - name: Fetch Thermo bridge assets (prebuilt managed assemblies + RAW test file)
        run: bash tools/ci/fetch_thermo_assets.sh osx-arm64 "$GITHUB_WORKSPACE"

      - name: Build and install OpenMS
        run: |
          THERMO_MANAGED_OPT=""
          if [ -f "${{ github.workspace }}/thermo-managed/ThermoWrapperManaged.dll" ]; then
            THERMO_MANAGED_OPT="-DOPENMS_THERMO_BRIDGE_PREBUILT_MANAGED_DIR=${{ github.workspace }}/thermo-managed"
          fi
          mkdir build && cd build
          # Note: CMAKE_PREFIX_PATH uses semicolons as list separators when passed via -D
          # ARROW_USE_STATIC=OFF since static Arrow still links to shared abseil libs anyway
          # Install OpenMS so libraries are stripped and use proper install names
          # OPENMS_USE_VCPKG=OFF: the dependencies come from Homebrew, not vcpkg
          cmake .. \
            -G Ninja \
            -DOPENMS_USE_VCPKG=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install \
            -DCMAKE_PREFIX_PATH="$(brew --prefix);$(brew --prefix libomp)" \
            -DCMAKE_INSTALL_NAME_DIR=${{ github.workspace }}/install/lib \
            -DOpenMP_ROOT=$(brew --prefix libomp) \
            -DARROW_USE_STATIC=OFF \
            -DPYOPENMS=OFF \
            -DWITH_GUI=OFF \
            -DBUILD_TOPP_TOOLS=OFF \
            -DINSTALL_OPENMS_EXAMPLES=OFF \
            -DWITH_THERMO_RAW=ON \
            $THERMO_MANAGED_OPT \
            -DENABLE_TUTORIALS=OFF \
            -DENABLE_DOCS=OFF \
            -DMT_ENABLE_OPENMP=ON
          # core layer only (libOpenMS, libOpenSwathAlgo): the CLI layer is a separate install component
          ninja OpenMS OpenSwathAlgo
          cmake --install . --component library --strip
          cmake --install . --component OpenMS_headers
          cmake --install . --component OpenSwathAlgo_headers
          cmake --install . --component thirdparty_headers
          cmake --install . --component share
          cmake --install . --component cmake
          # The licenses of the Homebrew libraries delocate copies into the wheel, and of
          # Eigen, which is header-only and compiled into libOpenMS. The boost keg has no
          # license file (Homebrew does not copy LICENSE_1_0.txt), so pass the text.
          python3 ${{ github.workspace }}/tools/ci/collect_wheel_licenses.py \
            --prefix ${{ github.workspace }}/install --homebrew-formula eigen \
            --license-file boost=${{ github.workspace }}/cmake/third_party_licenses/homebrew/boost/LICENSE_1_0.txt
          # THIRD-PARTY-NOTICES.txt again, now with the licenses collected above.
          cmake -DSHARE_DIR=${{ github.workspace }}/install/share/OpenMS \
            -P ${{ github.workspace }}/cmake/third_party_notices.cmake

      - name: Set pyOpenMS version
        run: |
          # Update pyproject.toml with the calculated version (includes .devYYYYMMDD for nightlies)
          VERSION="${{ needs.setup.outputs.pyopenms-version }}"
          echo "Setting pyOpenMS version to: $VERSION"
          sed -i '' "s/^version = .*/version = \"${VERSION}\"/" src/pyOpenMS/pyproject.toml
          grep "^version" src/pyOpenMS/pyproject.toml

      - name: Build wheels with cibuildwheel
        uses: pypa/cibuildwheel@v3.3
        with:
          package-dir: src/pyOpenMS
          output-dir: wheelhouse
        env:
          CIBW_BUILD: ${{ needs.setup.outputs.cibw-build-macos-arm64 }}
          CIBW_ARCHS_MACOS: "arm64"
          # Use old mechanism: copy libraries and use @loader_path
          # NO_DEPENDENCIES=OFF enables legacy library copying for macOS (with our fix_dependencies script)
          # DOTNET_ROOT and PYOPENMS_THERMO_RAW_TEST_FILE enable the Thermo RAW tests in the wheel test suite.
          # MACOSX_DEPLOYMENT_TARGET must match src/pyOpenMS/pyproject.toml; this
          # overrides that table wholesale. The check below enforces it.
          CIBW_ENVIRONMENT: >-
            OpenMS_ROOT="${{ github.workspace }}/install"
            CMAKE_PREFIX_PATH="/opt/homebrew:/opt/homebrew/opt/libomp:${{ github.workspace }}/install"
            MACOSX_DEPLOYMENT_TARGET=15.0
            CMAKE_BUILD_PARALLEL_LEVEL=2
            DOTNET_ROOT="$DOTNET_ROOT"
            PYOPENMS_THERMO_RAW_TEST_FILE="${{ github.workspace }}/thermo-testdata/Angiotensin_AllScans.raw"
          CIBW_BUILD_VERBOSITY: 1
          #CIBW_TEST_SKIP: "*"

      - name: Check the wheels run on the macOS their tag promises
        run: python3 tools/ci/check_macos_wheel_target.py wheelhouse/*.whl

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-arm64
          path: wheelhouse/*.whl

  # Windows: Build OpenMS and wheels in same job to preserve absolute library paths
  #
  # The dependencies come from vcpkg (the repository's submodule and manifest), as
  # static libraries against the dynamic CRT: the triplet of the windows-x64-ci
  # preset. They are linked into OpenMS.dll, so the wheel carries no third-party
  # DLL, and Arrow's symbols stay out of pyarrow's way in the same process.
  build-wheels-windows:
    needs: [setup]
    runs-on: windows-latest
    env:
      VCPKG_TRIPLET: x64-windows-static-md-release
      # The submodule's vcpkg, never the one the runner image carries in C:\vcpkg.
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_DISABLE_METRICS: 1
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Visual Studio shell
        uses: egor-tensin/vs-shell@v2
        with:
          arch: x64

      # What .github/actions/dependencies needs for the cache below, installed the
      # way tools/ci/deps-windows.sh does: rsync in the version the server expects
      # (its package also provides the ssh.exe the cache action uses), and rclone
      # for the read-only HTTP fallback when the secrets are not available.
      - name: Install the binary cache tools
        shell: bash
        run: |
          choco install -y --no-progress rclone
          choco install -y --no-progress --version 6.2.7 rsync

      # The main CI's vcpkg binary cache, under the key of its Windows build
      # (compiler cl.exe): same triplet and same MSVC, so the ports are cache hits.
      # The post step writes the ports built here back.
      - name: Restore the vcpkg binary cache
        uses: OpenMS/ci-tools/actions/rsync-cache@b0622a9a8ecfe12fa6e896795f45fddad12faa6c
        with:
          name: vcpkg-cache
          path: ${{ github.workspace }}/.vcpkg-cache
          key: ${{ runner.os }}-${{ runner.arch }}-cl.exe-vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          ssh_key: ${{ secrets.ARCHIVE_RRSYNC_SSH }}
          ssh_host: ${{ secrets.ARCHIVE_RRSYNC_HOST }}
          ssh_port: ${{ secrets.ARCHIVE_RRSYNC_PORT }}
          ssh_user: ${{ secrets.ARCHIVE_RRSYNC_USER }}

      - name: Check out vcpkg
        shell: bash
        run: |
          git submodule update --init vcpkg
          mkdir -p "$GITHUB_WORKSPACE/.vcpkg-cache"

      - name: Bootstrap vcpkg
        shell: cmd
        run: vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Cache Thermo bridge assets
        uses: actions/cache@v4
        with:
          path: |
            thermo-managed
            thermo-testdata
          key: thermo-assets-win-x64-${{ hashFiles('tools/ci/fetch_thermo_assets.sh') }}

      # Only the RAW test file is used here: the bridge comes from vcpkg's
      # openms-thermo-bridge port, which publishes its managed assemblies with the
      # .NET SDK of the runner image when the binary cache misses.
      - name: Fetch Thermo RAW test file
        shell: bash
        run: bash tools/ci/fetch_thermo_assets.sh win-x64 "$GITHUB_WORKSPACE"

      # vcpkg installs the manifest's dependencies during this step, from the binary
      # cache or from source; its duration is the dependency build time.
      # The feature openms-thermo-bridge provides WITH_THERMO_RAW, and
      # CMAKE_REQUIRE_FIND_PACKAGE_OpenMSThermoBridge makes a failed lookup an error
      # rather than a silent fallback to building the bridge with FetchContent.
      # opentims is fetched and compiled in, as before.
      - name: Configure OpenMS
        shell: bash
        run: |
          ws=$(cygpath -m "$GITHUB_WORKSPACE")
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$ws/install" \
            -DOPENMS_USE_VCPKG=ON \
            -DCMAKE_TOOLCHAIN_FILE="$ws/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET="$VCPKG_TRIPLET" \
            -DVCPKG_MANIFEST_FEATURES="openms-thermo-bridge" \
            -DCMAKE_REQUIRE_FIND_PACKAGE_OpenMSThermoBridge=ON \
            -DPYOPENMS=OFF \
            -DWITH_GUI=OFF \
            -DBUILD_TOPP_TOOLS=OFF \
            -DINSTALL_OPENMS_EXAMPLES=OFF \
            -DWITH_THERMO_RAW=ON \
            -DENABLE_TUTORIALS=OFF \
            -DENABLE_DOCS=OFF

      - name: Build and install OpenMS
        shell: bash
        run: |
          cd build
          # core layer only (libOpenMS, libOpenSwathAlgo): the CLI layer is a separate install component
          cmake --build . --target OpenMS OpenSwathAlgo
          cmake --install . --component library --strip
          cmake --install . --component OpenMS_headers
          cmake --install . --component OpenSwathAlgo_headers
          cmake --install . --component thirdparty_headers
          cmake --install . --component cmake
          cmake --install . --component share

      - name: Set pyOpenMS version
        shell: bash
        run: |
          # Update pyproject.toml with the calculated version (includes .devYYYYMMDD for nightlies)
          VERSION="${{ needs.setup.outputs.pyopenms-version }}"
          echo "Setting pyOpenMS version to: $VERSION"
          sed -i "s/^version = .*/version = \"${VERSION}\"/" src/pyOpenMS/pyproject.toml
          grep "^version" src/pyOpenMS/pyproject.toml

      # The standalone pyOpenMS build needs Boost (headers, through
      # OpenMSConfig.cmake), Eigen3 and Arrow from the tree vcpkg installed above.
      # It gets them through vcpkg's own toolchain, so that the ports' CMake
      # wrappers apply as in the OpenMS build; the wrapper toolchain below points it
      # at that tree instead of letting it install anything. With this triplet
      # Arrow::arrow_static is the only Arrow target; ARROW_USE_STATIC (an option of
      # the OpenMS build, which the standalone build does not include) says so.
      #
      # delvewheel gets OpenMS's install directories and a copy of the MSVC runtime
      # of the toolset that built everything (msvcp140 and the vcomp140 OpenMP
      # runtime), and nothing else: every other library is linked statically, so a
      # DLL found anywhere else would come from the runner's PATH.
      - name: Prepare the pyOpenMS build
        shell: bash
        run: |
          ws=$(cygpath -m "$GITHUB_WORKSPACE")
          toolchain="$ws/build/pyopenms-vcpkg-toolchain.cmake"
          cat > "$toolchain" <<EOF
          set(VCPKG_TARGET_TRIPLET "$VCPKG_TRIPLET" CACHE STRING "")
          set(VCPKG_INSTALLED_DIR "$ws/build/vcpkg_installed" CACHE PATH "")
          set(VCPKG_MANIFEST_MODE OFF CACHE BOOL "")
          set(VCPKG_APPLOCAL_DEPS OFF CACHE BOOL "")
          set(ARROW_USE_STATIC ON CACHE BOOL "")
          include("$ws/vcpkg/scripts/buildsystems/vcpkg.cmake")
          EOF
          cat "$toolchain"

          if [[ -z "${VCToolsRedistDir:-}" ]]; then
            echo "::error::VCToolsRedistDir is not set; is the Visual Studio shell set up?"
            exit 1
          fi
          redist=$(cygpath -m "$VCToolsRedistDir")
          redist=${redist%/}
          shopt -s nullglob
          crt=("$redist"/x64/Microsoft.VC*.CRT)
          omp=("$redist"/x64/Microsoft.VC*.OpenMP)
          if [[ ${#crt[@]} -ne 1 || ${#omp[@]} -ne 1 ]]; then
            echo "::error::expected one CRT and one OpenMP redistributable directory in $redist/x64, found: ${crt[*]} ${omp[*]}"
            exit 1
          fi
          mkdir -p "$ws/msvc-runtime"
          cp "${crt[0]}"/*.dll "${omp[0]}"/*.dll "$ws/msvc-runtime/"
          ls -l "$ws/msvc-runtime"

          {
            echo "OPENMS_ROOT_CMAKE=$ws/install"
            echo "PYOPENMS_TOOLCHAIN=$toolchain"
            echo "MSVC_RUNTIME_DIR=$ws/msvc-runtime"
            echo "THERMO_RAW_TEST_FILE=$ws/thermo-testdata/Angiotensin_AllScans.raw"
          } >> "$GITHUB_ENV"

      - name: Build wheels with cibuildwheel
        uses: pypa/cibuildwheel@v3.3
        with:
          package-dir: src/pyOpenMS
          output-dir: wheelhouse
        env:
          CIBW_BUILD: ${{ needs.setup.outputs.cibw-build-windows-x64 }}
          # PYOPENMS_THERMO_RAW_TEST_FILE enables the Thermo RAW tests in the wheel test suite
          # (the runner image provides the .NET runtime).
          CIBW_ENVIRONMENT: >-
            OpenMS_ROOT="${{ env.OPENMS_ROOT_CMAKE }}"
            CMAKE_PREFIX_PATH="${{ env.OPENMS_ROOT_CMAKE }}"
            CMAKE_TOOLCHAIN_FILE="${{ env.PYOPENMS_TOOLCHAIN }}"
            CMAKE_BUILD_PARALLEL_LEVEL=2
            PYOPENMS_THERMO_RAW_TEST_FILE="${{ env.THERMO_RAW_TEST_FILE }}"
          # install/bin holds OpenMS.dll and OpenSwathAlgo.dll (on Windows
          # INSTALL_LIB_DIR is 'bin'). --add-path goes in front of PATH, and the check
          # after this step fails on any DLL that is not OpenMS's own or the MSVC
          # runtime. -v so the per-DLL resolution is in the log.
          CIBW_REPAIR_WHEEL_COMMAND: "delvewheel repair -v --add-path ${{ env.OPENMS_ROOT_CMAKE }}/bin;${{ env.OPENMS_ROOT_CMAKE }}/lib;${{ env.MSVC_RUNTIME_DIR }} -w {dest_dir} {wheel}"
          CIBW_BUILD_VERBOSITY: 1

      # delvewheel puts the DLLs it vendors into pyopenms.libs/ under mangled names
      # (<name>-<hash>.dll). The Thermo bridge's managed assemblies are .NET IL that
      # ships as package data under share/, which delvewheel does not touch.
      - name: Check the DLLs bundled into the wheel
        shell: bash
        run: |
          python - wheelhouse/*.whl <<'EOF'
          import re, sys, zipfile
          wheels = sys.argv[1:]
          if len(wheels) != 1:
              sys.exit(f"expected exactly one wheel, found {wheels}")
          dlls = sorted(n for n in zipfile.ZipFile(wheels[0]).namelist() if n.lower().endswith(".dll"))
          managed = [n for n in dlls if "/openms_thermo_bridge/managed/" in n]
          native = [n for n in dlls if n not in managed]
          mangled = r"(-[0-9a-f]+)?\.dll"
          allowed = re.compile(
              r"pyopenms\.libs/(OpenMS|OpenSwathAlgo|openms_thermo_bridge|nethost"
              r"|msvcp140(_\w+)?|vcomp140|concrt140|vcruntime140(_1|_threads)?)" + mangled,
              re.IGNORECASE)
          for n in native:
              print("ok        " if allowed.fullmatch(n) else "UNEXPECTED", n)
          print(len(managed), "managed Thermo bridge assemblies")
          bad = [n for n in native if not allowed.fullmatch(n)]
          missing = [lib for lib in ("OpenMS", "msvcp140")
                     if not any(re.fullmatch(rf"pyopenms\.libs/{lib}{mangled}", n, re.IGNORECASE) for n in native)]
          if not managed:
              missing.append("openms_thermo_bridge/managed")
          if bad or missing:
              sys.exit(f"unexpected DLLs: {bad}; missing: {missing}")
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-x64
          path: wheelhouse/*.whl

  #----------------------------------------------------------------------------
  # Test wheels
  #----------------------------------------------------------------------------
  test-wheels:
    needs: [setup, build-wheels-linux, build-wheels-linux-arm, build-wheels-macos, build-wheels-windows]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(needs.setup.outputs.python-versions) }}
        os: [ubuntu-latest, ubuntu-22.04-arm, macos-15, windows-latest]
        include:
          # Map os to artifact names and to the openms-thermo-bridge platform tag
          # (empty = no Thermo RAW support in that wheel)
          - os: ubuntu-latest
            artifact: wheels-linux-x64
            thermo-platform: linux-x64
          - os: ubuntu-22.04-arm
            artifact: wheels-linux-arm64
            thermo-platform: linux-arm64
          - os: macos-15
            artifact: wheels-macos-arm64
            thermo-platform: osx-arm64
          - os: windows-latest
            artifact: wheels-windows-x64
            thermo-platform: win-x64

    steps:
      - uses: actions/checkout@v6
        with:
          # src/pyOpenMS/tests and the class-test data it reads are needed here
          # because this job, not cibuildwheel, is what now runs the full suite
          # on every supported interpreter. fix_stubs.py is build tooling the
          # stub regression tests load directly; the package's own files they
          # need come from the installed wheel.
          sparse-checkout: |
            tools/ci/fetch_thermo_assets.sh
            cmake/cmake_findExternalLibs.cmake
            src/pyOpenMS/tests
            src/pyOpenMS/pyproject.toml
            src/pyOpenMS/fix_stubs.py
            src/tests/class_tests/openms/data
            src/tests/topp
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: wheelhouse

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the abi3 wheel
        shell: bash
        run: |
          # One cp<N>-abi3 wheel per platform now serves every supported
          # interpreter, so there is no per-version wheel to glob for. Require
          # exactly one candidate: more than one would mean the artifact still
          # carries per-version wheels and the wrong one could be picked, none
          # would mean the build silently produced nothing installable here.
          shopt -s nullglob
          wheels=(wheelhouse/*-abi3-*.whl)
          if [[ ${#wheels[@]} -ne 1 ]]; then
            echo "::error::expected exactly one abi3 wheel in the ${{ matrix.artifact }} artifact, found ${#wheels[@]}:"
            ls -la wheelhouse/ || true
            exit 1
          fi
          echo "Installing ${wheels[0]} on Python ${{ matrix.python-version }}"
          # Naming the wheel by path is what pins the test to the artifact just
          # built -- pip installs the file it is given and never substitutes a
          # package-index release of pyopenms for it. The index still has to stay
          # reachable for the dependencies (numpy, matplotlib, nanobind-backend),
          # which are not in wheelhouse; --no-index here would fail the install
          # with "No matching distribution found for numpy>=2.0".
          python -m pip install --only-binary=:all: --find-links wheelhouse "${wheels[0]}"
          python -c "import pyopenms; print('pyopenms version:', pyopenms.__version__)"
          python -c "import pyopenms; print(pyopenms.EmpiricalFormula('C6H12O6').getMonoWeight())"

      - name: Check the installed environment is consistent
        shell: bash
        run: python -m pip check

      # pyopenms/__init__.py catches per-domain import errors and can leave a
      # partially populated package behind, so `import pyopenms` alone is not
      # evidence that the extensions loaded. Import each one explicitly.
      - name: Import every extension module
        shell: bash
        run: |
          python - <<'EOF'
          import importlib, pyopenms
          domains = ["kernel", "metadata", "chemistry", "analysis", "featurefinder",
                     "format", "processing", "datastructures", "ml", "misc",
                     "spectrum", "chromatogram", "experiment"]
          expected = [f"pyopenms._pyopenms_{d}" for d in domains]
          expected += ["pyopenms._pyopenms", "pyopenms._arrow_zerocopy"]
          for name in expected:
              mod = importlib.import_module(name)
              print("ok", name, getattr(mod, "__file__", ""))
          print(f"all {len(expected)} extension modules imported")
          EOF

      - name: Install test dependencies
        shell: bash
        run: python -m pip install pytest pytest-cov "pandas>=3" pyarrow

      - name: Run the pyOpenMS test suite against the installed wheel
        shell: bash
        env:
          OPENMS_CLASS_TEST_DATA_PATH: ${{ github.workspace }}/src/tests/class_tests/openms/data
          OPENMS_TEST_DATA_PATH: ${{ github.workspace }}/src/tests/topp
        run: |
          # --import-mode=importlib and running from a directory without a
          # pyopenms/ source tree keep this honest: the installed wheel is what
          # gets imported, not the checkout.
          python -m pytest src/pyOpenMS/tests -q --import-mode=importlib -p no:cacheprovider

      # Thermo RAW smoke test on a fresh runner: only the .NET runtime may be
      # present, everything else (bridge library, managed assemblies) must come
      # from the wheel itself.
      - name: Install .NET runtime for the Thermo RAW smoke test
        if: matrix.thermo-platform != ''
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache Thermo RAW test file
        if: matrix.thermo-platform != ''
        uses: actions/cache@v4
        with:
          path: |
            thermo-managed
            thermo-testdata
          key: thermo-assets-${{ matrix.thermo-platform }}-${{ hashFiles('tools/ci/fetch_thermo_assets.sh') }}

      - name: Fetch Thermo RAW test file
        if: matrix.thermo-platform != ''
        shell: bash
        run: bash tools/ci/fetch_thermo_assets.sh ${{ matrix.thermo-platform }} "$GITHUB_WORKSPACE"

      - name: Smoke-test Thermo RAW reading
        if: matrix.thermo-platform != ''
        shell: bash
        env:
          PYOPENMS_THERMO_RAW_TEST_FILE: ${{ github.workspace }}/thermo-testdata/Angiotensin_AllScans.raw
        run: |
          python - <<'EOF'
          import os, pyopenms
          share = os.environ["OPENMS_DATA_PATH"]
          managed = os.path.join(share, "openms_thermo_bridge", "managed")
          assert os.path.isfile(os.path.join(managed, "ThermoWrapperManaged.dll")), managed
          exp = pyopenms.MSExperiment()
          pyopenms.FileHandler().loadExperiment(os.environ["PYOPENMS_THERMO_RAW_TEST_FILE"], exp)
          n = exp.getNrSpectra()
          print("Thermo RAW spectra loaded:", n)
          assert n > 1000, n
          EOF

  #----------------------------------------------------------------------------
  # Publish wheels
  #----------------------------------------------------------------------------
  publish-nightly-uni-tuebingen:
    name: Upload nightly to Tuebingen
    needs: [test-wheels]
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/heads/nightly')
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/

      - name: Publish to nightly PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://pypi.openms.de/
          user: openms
          password: ${{ secrets.openms_pypi_pw }}
          verbose: true

  publish-release-pypi:
    name: Upload release to PyPI
    needs: [test-wheels]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.upload-to-pypi && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/pyopenms
    permissions:
      id-token: write # For pypa/gh-action-pypi-publish
      actions: read # For actions/download-artifact
      artifact-metadata: read # For actions/download-artifact
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true

  publish-archive-openms:
    name: Upload wheels to archive.openms.de
    needs: [setup, test-wheels]
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
        (startsWith(github.ref, 'refs/heads/nightly') || startsWith(github.ref, 'refs/tags/v')))
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/

      - name: Upload wheels to archive
        shell: bash
        env:
          PASS: ${{ secrets.ARCHIVE_RRSYNC_SSH }}
          USER: ${{ secrets.ARCHIVE_RRSYNC_USER }}
          HOST: ${{ secrets.ARCHIVE_RRSYNC_HOST }}
          PORT: ${{ secrets.ARCHIVE_RRSYNC_PORT }}
          # Pass interpolations through env (GITHUB_REF/GITHUB_REF_NAME are runner
          # built-ins) so they are never expanded into the shell script directly.
          PYOPENMS_VERSION: ${{ needs.setup.outputs.pyopenms-version }}
        run: |
          # Pick destination folder mirroring the OpenMSInstaller/Documentation layout.
          # Sanitize externally-influenced values with a strict whitelist before
          # using them in a path (branch/tag names may contain shell metacharacters).
          sanitize() { printf '%s' "${1//[^a-zA-Z0-9._-]/_}"; }

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            folder="release/$(sanitize "$PYOPENMS_VERSION")"
          elif [[ "$GITHUB_REF_NAME" == "nightly" ]]; then
            folder=nightly
          else
            folder="experimental/$(sanitize "$GITHUB_REF_NAME")"
          fi
          echo "Uploading wheels to: $folder"

          mkdir -p ~/.ssh/
          echo "$PASS" > ~/.ssh/private.key
          chmod 600 ~/.ssh/private.key
          rsync --progress -avz --mkpath -e "ssh -i ~/.ssh/private.key -p $PORT -o StrictHostKeyChecking=no" dist/*.whl "$USER@$HOST:/pyopenms/${folder}/"
