# pyOpenMS wheel building using cibuildwheel
#
# This workflow builds pyOpenMS wheels for multiple Python versions and platforms
# using cibuildwheel. It requires OpenMS to be built first on each platform.
#
# Trigger: Release tags, nightly branch, develop PRs, or manual dispatch

name: pyopenms-wheels-cibuildwheel

on:
  workflow_dispatch:
    inputs:
      upload-to-pypi:
        type: boolean
        description: Upload release package to pypi.org
        default: false
  push:
    tags:
      - 'Release*'
    branches: [nightly, py_nightly_test]
  pull_request:
    branches: [develop]

jobs:
  #----------------------------------------------------------------------------
  # Setup job to read Python versions and calculate package version
  #----------------------------------------------------------------------------
  setup:
    runs-on: ubuntu-latest
    outputs:
      python-versions: ${{ steps.set-versions.outputs.versions }}
      python-versions-array: ${{ steps.set-versions.outputs.versions-array }}
      pyopenms-version: ${{ steps.set-versions.outputs.pyopenms-version }}
      is-nightly: ${{ steps.set-versions.outputs.is-nightly }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/workflows/python_versions.json
            CMakeLists.txt
          sparse-checkout-cone-mode: false

      - name: Read Python versions and calculate package version
        id: set-versions
        run: |
          # Output Python versions as JSON array for matrix (compact to single line)
          echo "versions=$(jq -c . .github/workflows/python_versions.json)" >> $GITHUB_OUTPUT
          # Output as space-separated for display
          echo "versions-array=$(jq -r '.[]' .github/workflows/python_versions.json | tr '\n' ' ')" >> $GITHUB_OUTPUT

          # Extract OpenMS version from CMakeLists.txt
          MAJOR=$(grep 'OPENMS_PACKAGE_VERSION_MAJOR' CMakeLists.txt | head -1 | sed 's/.*"\([0-9]*\)".*/\1/')
          MINOR=$(grep 'OPENMS_PACKAGE_VERSION_MINOR' CMakeLists.txt | head -1 | sed 's/.*"\([0-9]*\)".*/\1/')
          PATCH=$(grep 'OPENMS_PACKAGE_VERSION_PATCH' CMakeLists.txt | head -1 | sed 's/.*"\([0-9]*\)".*/\1/')
          BASE_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "Base OpenMS version: $BASE_VERSION"

          # For nightly builds (develop, nightly, py_nightly_test branches), append .devYYYYMMDD
          if [[ "${{ github.ref_name }}" == "develop" || "${{ github.ref_name }}" == "nightly" || "${{ github.ref_name }}" == "py_nightly_test" ]]; then
            DATE_SUFFIX=$(date +%Y%m%d)
            PYOPENMS_VERSION="${BASE_VERSION}.dev${DATE_SUFFIX}"
            echo "is-nightly=true" >> $GITHUB_OUTPUT
          else
            PYOPENMS_VERSION="${BASE_VERSION}"
            echo "is-nightly=false" >> $GITHUB_OUTPUT
          fi

          echo "pyopenms-version=${PYOPENMS_VERSION}" >> $GITHUB_OUTPUT
          echo "pyOpenMS version: $PYOPENMS_VERSION"

  #----------------------------------------------------------------------------
  # Build OpenMS on each platform first
  #----------------------------------------------------------------------------
  build-openms-linux:
    runs-on: ubuntu-latest
    container: ghcr.io/openms/contrib_manylinux_2_34:latest-amd64
    steps:
      # Cancel older builds if still running
      - uses: rokroskar/workflow-run-cleanup-action@master
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        if: "!startsWith(github.ref, 'refs/tags/') && github.ref != 'refs/heads/master' && github.ref != 'refs/heads/develop'"

      - uses: actions/checkout@v4

      - name: Build OpenMS
        run: |
          yum install -y cmake ninja-build
          mkdir build && cd build
          cmake .. \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/openms-install \
            -DCMAKE_PREFIX_PATH=/contrib-build \
            -DOPENMS_CONTRIB_LIBS=/contrib-build \
            -DPYOPENMS=OFF \
            -DWITH_GUI=OFF \
            -DENABLE_TUTORIALS=OFF \
            -DENABLE_DOCS=OFF \
            -DWITH_PARQUET=ON
          ninja OpenMS OpenSwathAlgo

      - name: Install and package OpenMS
        run: |
          cd build
          # Install OpenMS components with stripping (reduces wheel size)
          # Using cmake --install produces relocatable paths (no sed fixes needed)
          cmake --install . --component library --strip
          cmake --install . --component OpenMS_headers
          cmake --install . --component OpenSwathAlgo_headers
          cmake --install . --component thirdparty_headers
          cmake --install . --component cmake
          # Package the install directory
          cd $GITHUB_WORKSPACE/openms-install
          tar -czf ../openms-build-linux.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: openms-build-linux-x64
          path: openms-build-linux.tar.gz
          retention-days: 1

  build-openms-linux-arm:
    runs-on: ubuntu-22.04-arm
    container: ghcr.io/openms/contrib_manylinux_2_34:latest-arm64
    steps:
      # Cancel older builds if still running
      - uses: rokroskar/workflow-run-cleanup-action@master
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        if: "!startsWith(github.ref, 'refs/tags/') && github.ref != 'refs/heads/master' && github.ref != 'refs/heads/develop'"

      - uses: actions/checkout@v4

      - name: Build OpenMS
        run: |
          yum install -y cmake ninja-build
          mkdir build && cd build
          cmake .. \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/openms-install \
            -DCMAKE_PREFIX_PATH=/contrib-build \
            -DOPENMS_CONTRIB_LIBS=/contrib-build \
            -DPYOPENMS=OFF \
            -DWITH_GUI=OFF \
            -DENABLE_TUTORIALS=OFF \
            -DENABLE_DOCS=OFF \
            -DWITH_PARQUET=ON
          ninja OpenMS OpenSwathAlgo

      - name: Install and package OpenMS
        run: |
          cd build
          # Install OpenMS components with stripping (reduces wheel size)
          # Using cmake --install produces relocatable paths (no sed fixes needed)
          cmake --install . --component library --strip
          cmake --install . --component OpenMS_headers
          cmake --install . --component OpenSwathAlgo_headers
          cmake --install . --component thirdparty_headers
          cmake --install . --component cmake
          # Package the install directory
          cd $GITHUB_WORKSPACE/openms-install
          tar -czf ../openms-build-linux-arm.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: openms-build-linux-arm64
          path: openms-build-linux-arm.tar.gz
          retention-days: 1

  build-openms-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: bash tools/ci/deps-macos.sh

      - name: Build OpenMS
        run: |
          # icu4c is keg-only, so we need to add it to the library search path for linking
          # zstd is required for static Arrow/Parquet linking
          export LIBRARY_PATH="$(brew --prefix icu4c)/lib:$(brew --prefix zstd)/lib:${LIBRARY_PATH:-}"
          mkdir build && cd build
          # Note: CMAKE_PREFIX_PATH uses semicolons as list separators when passed via -D
          # BOOST_USE_STATIC_LIBS=OFF works around Boost's incomplete find_dependency calls
          cmake .. \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/openms-install \
            -DCMAKE_PREFIX_PATH="$(brew --prefix);$(brew --prefix libomp);$(brew --prefix icu4c);$(brew --prefix zstd)" \
            -DOpenMP_ROOT=$(brew --prefix libomp) \
            -DBOOST_USE_STATIC_LIBS=OFF \
            -DPYOPENMS=OFF \
            -DWITH_GUI=OFF \
            -DENABLE_TUTORIALS=OFF \
            -DENABLE_DOCS=OFF \
            -DMT_ENABLE_OPENMP=ON \
            -DWITH_PARQUET=ON
          ninja OpenMS OpenSwathAlgo

      - name: Install and package OpenMS
        run: |
          cd build
          # Install OpenMS components with stripping (reduces wheel size)
          # Using cmake --install produces relocatable paths (no sed fixes needed)
          cmake --install . --component library --strip
          cmake --install . --component OpenMS_headers
          cmake --install . --component OpenSwathAlgo_headers
          cmake --install . --component thirdparty_headers
          cmake --install . --component cmake
          # Package the install directory
          cd $GITHUB_WORKSPACE/openms-install
          tar -czf ../openms-build-macos.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: openms-build-macos-arm64
          path: openms-build-macos.tar.gz
          retention-days: 1

  build-openms-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.25.x'

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          arch: 'win64_msvc2022_64'
          target: 'desktop'
          archives: 'qtsvg qtbase'

      - name: Download contrib
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd contrib
          gh release download -R OpenMS/contrib --pattern 'contrib_build-Windows.tar.gz'
          7z x -so contrib_build-Windows.tar.gz | 7z x -si -ttar
          rm contrib_build-Windows.tar.gz

      - name: Set up Visual Studio shell
        uses: egor-tensin/vs-shell@v2
        with:
          arch: x64

      - name: Build OpenMS
        shell: bash
        env:
          # Workaround for MSVC constexpr mutex constructor bug
          CXXFLAGS: "-D_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR"
        run: |
          mkdir build && cd build
          cmake .. \
            -G "Visual Studio 17 2022" -A x64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/openms-install" \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR/lib/cmake;$QT_ROOT_DIR" \
            -DOPENMS_CONTRIB_LIBS="$GITHUB_WORKSPACE/contrib" \
            -DPYOPENMS=OFF \
            -DWITH_GUI=OFF \
            -DENABLE_TUTORIALS=OFF \
            -DENABLE_DOCS=OFF \
            -DWITH_PARQUET=ON
          cmake --build . --config Release --target OpenMS OpenSwathAlgo -j

      - name: Install and package OpenMS
        shell: bash
        run: |
          cd build
          # Install OpenMS components (no stripping on Windows)
          # Using cmake --install produces relocatable paths (no sed fixes needed)
          cmake --install . --config Release --component library
          cmake --install . --config Release --component OpenMS_headers
          cmake --install . --config Release --component OpenSwathAlgo_headers
          cmake --install . --config Release --component thirdparty_headers
          cmake --install . --config Release --component cmake
          # Package the install directory
          cd "$GITHUB_WORKSPACE/openms-install"
          7z a ../openms-build-windows.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: openms-build-windows-x64
          path: openms-build-windows.zip
          retention-days: 1

  #----------------------------------------------------------------------------
  # Build wheels using cibuildwheel
  #----------------------------------------------------------------------------
  build-wheels-linux:
    needs: [setup, build-openms-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          name: openms-build-linux-x64
          path: .

      - name: Extract OpenMS build
        run: |
          # Extract installed OpenMS (cmake --install produces relocatable paths, no sed fixes needed)
          mkdir -p openms-build
          tar -xzf openms-build-linux.tar.gz -C openms-build

      - name: Set CIBW_BUILD from python_versions.json
        run: |
          # Construct CIBW_BUILD from Python versions (e.g., "cp310-manylinux_x86_64 cp311-manylinux_x86_64 ...")
          CIBW_BUILD=$(echo '${{ needs.setup.outputs.python-versions }}' | jq -r '.[]' | sed 's/\.//g' | sed 's/^/cp/' | sed 's/$/-manylinux_x86_64/' | tr '\n' ' ')
          echo "CIBW_BUILD=$CIBW_BUILD" >> $GITHUB_ENV

      - name: Set pyOpenMS version
        run: |
          # Update pyproject.toml with the calculated version (includes .devYYYYMMDD for nightlies)
          VERSION="${{ needs.setup.outputs.pyopenms-version }}"
          echo "Setting pyOpenMS version to: $VERSION"
          sed -i "s/^version = .*/version = \"${VERSION}\"/" src/pyOpenMS/pyproject.toml
          grep "^version" src/pyOpenMS/pyproject.toml

      - name: Build wheels with cibuildwheel
        uses: pypa/cibuildwheel@v2.22
        with:
          package-dir: src/pyOpenMS
          output-dir: wheelhouse
        env:
          CIBW_MANYLINUX_X86_64_IMAGE: ghcr.io/openms/contrib_manylinux_2_34:latest-amd64
          CIBW_BEFORE_ALL: "yum install -y cmake ninja-build"
          CIBW_ENVIRONMENT: "OpenMS_ROOT=/project/openms-build CMAKE_PREFIX_PATH=/contrib-build:/project/openms-build LD_LIBRARY_PATH=/project/openms-build/lib"
          CIBW_REPAIR_WHEEL_COMMAND: "auditwheel repair -w {dest_dir} {wheel}"
          CIBW_BUILD_VERBOSITY: 1

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-x64
          path: wheelhouse/*.whl

  build-wheels-linux-arm:
    needs: [setup, build-openms-linux-arm]
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          name: openms-build-linux-arm64
          path: .

      - name: Extract OpenMS build
        run: |
          # Extract installed OpenMS (cmake --install produces relocatable paths, no sed fixes needed)
          mkdir -p openms-build
          tar -xzf openms-build-linux-arm.tar.gz -C openms-build

      - name: Set CIBW_BUILD from python_versions.json
        run: |
          # Construct CIBW_BUILD from Python versions (e.g., "cp310-manylinux_aarch64 cp311-manylinux_aarch64 ...")
          CIBW_BUILD=$(echo '${{ needs.setup.outputs.python-versions }}' | jq -r '.[]' | sed 's/\.//g' | sed 's/^/cp/' | sed 's/$/-manylinux_aarch64/' | tr '\n' ' ')
          echo "CIBW_BUILD=$CIBW_BUILD" >> $GITHUB_ENV

      - name: Set pyOpenMS version
        run: |
          # Update pyproject.toml with the calculated version (includes .devYYYYMMDD for nightlies)
          VERSION="${{ needs.setup.outputs.pyopenms-version }}"
          echo "Setting pyOpenMS version to: $VERSION"
          sed -i "s/^version = .*/version = \"${VERSION}\"/" src/pyOpenMS/pyproject.toml
          grep "^version" src/pyOpenMS/pyproject.toml

      - name: Build wheels with cibuildwheel
        uses: pypa/cibuildwheel@v2.22
        with:
          package-dir: src/pyOpenMS
          output-dir: wheelhouse
        env:
          CIBW_MANYLINUX_AARCH64_IMAGE: ghcr.io/openms/contrib_manylinux_2_34:latest-arm64
          CIBW_BEFORE_ALL: "yum install -y cmake ninja-build"
          CIBW_ENVIRONMENT: "OpenMS_ROOT=/project/openms-build CMAKE_PREFIX_PATH=/contrib-build:/project/openms-build LD_LIBRARY_PATH=/project/openms-build/lib"
          CIBW_REPAIR_WHEEL_COMMAND: "auditwheel repair -w {dest_dir} {wheel}"
          CIBW_BUILD_VERBOSITY: 1

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-arm64
          path: wheelhouse/*.whl

  build-wheels-macos:
    needs: [setup, build-openms-macos]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: openms-build-macos-arm64
          path: .

      - name: Extract OpenMS build
        run: |
          # Extract installed OpenMS (cmake --install produces relocatable paths)
          mkdir -p openms-build
          tar -xzf openms-build-macos.tar.gz -C openms-build

      - name: Install dependencies for wheel building
        run: |
          bash tools/ci/deps-macos.sh

      - name: Set CIBW_BUILD from python_versions.json
        run: |
          # Construct CIBW_BUILD from Python versions (e.g., "cp310-macosx_arm64 cp311-macosx_arm64 ...")
          CIBW_BUILD=$(echo '${{ needs.setup.outputs.python-versions }}' | jq -r '.[]' | sed 's/\.//g' | sed 's/^/cp/' | sed 's/$/-macosx_arm64/' | tr '\n' ' ')
          echo "CIBW_BUILD=$CIBW_BUILD" >> $GITHUB_ENV

      - name: Set pyOpenMS version
        run: |
          # Update pyproject.toml with the calculated version (includes .devYYYYMMDD for nightlies)
          VERSION="${{ needs.setup.outputs.pyopenms-version }}"
          echo "Setting pyOpenMS version to: $VERSION"
          sed -i '' "s/^version = .*/version = \"${VERSION}\"/" src/pyOpenMS/pyproject.toml
          grep "^version" src/pyOpenMS/pyproject.toml

      - name: Build wheels with cibuildwheel
        uses: pypa/cibuildwheel@v2.22
        with:
          package-dir: src/pyOpenMS
          output-dir: wheelhouse
        env:
          CIBW_ARCHS_MACOS: "arm64"
          CIBW_BEFORE_BUILD: "pip install delocate"
          CIBW_ENVIRONMENT: "OpenMS_ROOT=${{ github.workspace }}/openms-build CMAKE_PREFIX_PATH=/opt/homebrew:/opt/homebrew/opt/libomp:/opt/homebrew/opt/icu4c:${{ github.workspace }}/openms-build LIBRARY_PATH=/opt/homebrew/opt/icu4c/lib MACOSX_DEPLOYMENT_TARGET=14.0"
          CIBW_REPAIR_WHEEL_COMMAND: "delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}"
          CIBW_BUILD_VERBOSITY: 1

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-arm64
          path: wheelhouse/*.whl

  build-wheels-windows:
    needs: [setup, build-openms-windows]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.25.x'

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          arch: 'win64_msvc2022_64'
          target: 'desktop'
          archives: 'qtsvg qtbase'

      - name: Download contrib
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd contrib
          gh release download -R OpenMS/contrib --pattern 'contrib_build-Windows.tar.gz'
          7z x -so contrib_build-Windows.tar.gz | 7z x -si -ttar
          rm contrib_build-Windows.tar.gz

      - uses: actions/download-artifact@v4
        with:
          name: openms-build-windows-x64
          path: .

      - name: Extract OpenMS build
        shell: bash
        run: |
          # Extract installed OpenMS (cmake --install produces relocatable paths)
          mkdir -p openms-build
          7z x openms-build-windows.zip -oopenms-build

      - name: Set up Visual Studio shell
        uses: egor-tensin/vs-shell@v2
        with:
          arch: x64

      - name: Set up build environment
        shell: bash
        run: |
          # Export CMAKE_PREFIX_PATH for cibuildwheel
          # QT_ROOT_DIR is set by install-qt-action v4
          echo "PYOPENMS_CMAKE_PREFIX_PATH=${QT_ROOT_DIR}/lib/cmake;${QT_ROOT_DIR};${GITHUB_WORKSPACE}/contrib;${GITHUB_WORKSPACE}/openms-build" >> $GITHUB_ENV
          echo "PYOPENMS_OPENMS_ROOT=${GITHUB_WORKSPACE}/openms-build" >> $GITHUB_ENV
          # Construct CIBW_BUILD from Python versions (e.g., "cp310-win_amd64 cp311-win_amd64 ...")
          CIBW_BUILD=$(echo '${{ needs.setup.outputs.python-versions }}' | jq -r '.[]' | sed 's/\.//g' | sed 's/^/cp/' | sed 's/$/-win_amd64/' | tr '\n' ' ')
          echo "CIBW_BUILD=$CIBW_BUILD" >> $GITHUB_ENV

      - name: Set pyOpenMS version
        shell: bash
        run: |
          # Update pyproject.toml with the calculated version (includes .devYYYYMMDD for nightlies)
          VERSION="${{ needs.setup.outputs.pyopenms-version }}"
          echo "Setting pyOpenMS version to: $VERSION"
          sed -i "s/^version = .*/version = \"${VERSION}\"/" src/pyOpenMS/pyproject.toml
          grep "^version" src/pyOpenMS/pyproject.toml

      - name: Build wheels with cibuildwheel
        uses: pypa/cibuildwheel@v2.22
        with:
          package-dir: src/pyOpenMS
          output-dir: wheelhouse
        env:
          CIBW_BEFORE_BUILD: "pip install delvewheel"
          # Use shell variable expansion - PYOPENMS_* vars are set in previous step
          CIBW_ENVIRONMENT: "OpenMS_ROOT=$PYOPENMS_OPENMS_ROOT CMAKE_PREFIX_PATH=$PYOPENMS_CMAKE_PREFIX_PATH"
          CIBW_REPAIR_WHEEL_COMMAND: "delvewheel repair -w {dest_dir} {wheel}"
          CIBW_BUILD_VERBOSITY: 1

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-x64
          path: wheelhouse/*.whl

  #----------------------------------------------------------------------------
  # Test wheels
  #----------------------------------------------------------------------------
  test-wheels:
    needs: [setup, build-wheels-linux, build-wheels-linux-arm, build-wheels-macos, build-wheels-windows]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(needs.setup.outputs.python-versions) }}
        os: [ubuntu-latest, ubuntu-22.04-arm, macos-14, windows-latest]
        include:
          # Map os to artifact names
          - os: ubuntu-latest
            artifact: wheels-linux-x64
          - os: ubuntu-22.04-arm
            artifact: wheels-linux-arm64
          - os: macos-14
            artifact: wheels-macos-arm64
          - os: windows-latest
            artifact: wheels-windows-x64

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: wheelhouse

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Test wheel
        shell: bash
        run: |
          # Install the wheel matching this Python version
          PYVER=$(echo "${{ matrix.python-version }}" | tr -d '.')
          pip install wheelhouse/*cp${PYVER}*.whl
          python -c "import pyopenms; print('pyopenms version:', pyopenms.__version__)"
          python -c "import pyopenms; print(pyopenms.EmpiricalFormula('C6H12O6').getMonoWeight())"

  #----------------------------------------------------------------------------
  # Publish wheels
  #----------------------------------------------------------------------------
  publish:
    needs: [test-wheels]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/

      - name: List wheels
        run: ls -la dist/

      - name: Publish to nightly PyPI
        # Publish to nightly on develop/nightly branches, or Release tags without pypi flag
        if: github.ref_name == 'develop' || github.ref_name == 'nightly' || github.ref_name == 'py_nightly_test' || (startsWith(github.ref, 'refs/tags/Release') && !inputs.upload-to-pypi)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://pypi.cs.uni-tuebingen.de/
          user: openms
          password: ${{ secrets.abiservices_pypi_pw }}
          packages-dir: dist/

      - name: Publish to PyPI
        # Publish to PyPI only for Release tags with explicit pypi flag
        if: startsWith(github.ref, 'refs/tags/Release') && inputs.upload-to-pypi
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.pypi_api_token_release }}
          packages-dir: dist/
