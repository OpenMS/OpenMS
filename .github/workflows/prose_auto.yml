name: prose_auto

# Tests of the ProSE Auto Mode prototype (tools/prose_auto) on Linux, macOS and Windows.
# The tests use OpenMS test data from this repository (share/OpenMS/examples, src/tests/topp), so a full checkout.
on:
  push:
    paths: ["tools/prose_auto/**", ".github/workflows/prose_auto.yml"]
  pull_request:
    paths: ["tools/prose_auto/**", ".github/workflows/prose_auto.yml"]
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/prose_auto
            share/OpenMS/examples/BSA
            src/tests/topp
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyopenms numpy pyyaml pytest
          python -m pip install -e tools/prose_auto
      - name: Test
        working-directory: tools/prose_auto
        run: python -m pytest tests -q
