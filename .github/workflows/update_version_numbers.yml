name: Update OpenMS version numbers

# 1. Trigger when a tag matching /^v[0-9.]+/ is pushed
on:
  push:
    tags:
      - 'v[0-9]*'

# Grant permissions to write content and create PRs
permissions:
  contents: write
  pull-requests: write

jobs:
  updating_package_version_number:
    runs-on: ubuntu-latest
    steps:
      # 2. Check out the develop branch instead of the tagged commit
      - name: Checkout develop branch
        uses: actions/checkout@v6
        with:
          ref: develop

      # 3. Validate tag, parse components, and update files
      - name: Calculate next minor version and update files
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          echo "Triggered by tag: $TAG_NAME"
          
          # Regex matches: v<major>.<minor> with an optional .<patch>
          if [[ "$TAG_NAME" =~ ^v([0-9]+)\.([0-9]+)(\.[0-9]+)?$ ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            
            # Extract the raw patch match 
            PATCH_RAW="${BASH_REMATCH[3]}"
            # Strip the leading dot 
            PATCH="${PATCH_RAW#.}"
          else
            echo "Error: Invalid version tag format '$TAG_NAME'." >&2
            echo "Must strictly match 'vX.Y' or 'vX.Y.Z' (e.g., v2.0 or v4.12.4)." >&2
            exit 1
          fi
          
          # Calculate next minor version (increment minor, reset patch to 0)
          NEW_MAJOR="$MAJOR"
          NEW_MINOR=$((MINOR + 1))
          NEW_PATCH=0
          NEW_VERSION=${NEW_MAJOR}.${NEW_MINOR}.${NEW_PATCH}
          
          echo "Bumping version from $MAJOR.$MINOR.$PATCH to $NEW_VERSION"
          
          # Execute your update script
          bash tools/update_version_numbers.sh "$NEW_MAJOR" "$NEW_MINOR" "$NEW_PATCH"
          
          # Push variables to GITHUB_ENV so they populate next step seamlessly
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV

      # 4. Commit, Push, and PR updated files 
      - name: Commit, Push, and PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: update_package_number
          TAG_NAME: ${{ github.ref_name }}
        run: |
          # 1. Check for changes. If clean, exit early gracefully.
          if git diff --exit-code; then
            echo "No changes detected. Skipping PR creation."
            exit 0
          fi

          # 2. Configure Git using the actor's identity
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"

          # 3. Checkout a clean branch and commit changes
          git checkout -b "$BRANCH_NAME"
          git add .
          git commit -m "Updated OpenMS package version number to $NEW_VERSION"
          
          # 4. Force push the changes to keep the PR branch updated
          git push origin "$BRANCH_NAME" --force

          # 5. Check if an active PR already exists for this branch targeting develop
          PR_EXISTS=$(gh pr list --head "$BRANCH_NAME" --base develop --state open --json number --jq '.[].number')

          # 6. Create the PR if it doesn't exist targeting develop; otherwise let the force-push update it
          if [ -z "$PR_EXISTS" ]; then
            gh pr create \
              --title "[GHA] Updated OpenMS package version numbers to $NEW_VERSION" \
              --body "This PR was automatically generated by GitHub Actions following the tag push of **$TAG_NAME** to bump the OpenMS version number to $NEW_VERSION on \`develop\`." \
              --base develop \
              --head "$BRANCH_NAME"
          else
            echo "PR #${PR_EXISTS} already exists for branch $BRANCH_NAME. Branch was force-pushed; PR is now up to date."
          fi
