name: Check AUTHORS File
run-name: Checking if ${{ github.actor }} is in the AUTHORS file
on:
  pull_request_target:
    types: [ "opened" ]
    branches: [ "develop" ]
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Clone PR Repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Clone OpenMS CI Tools Repository
        uses: actions/checkout@v6
        with:
          repository: OpenMS/ci-tools
          path: ci-tools
      - name: Check the AUTHORS File
        run: |
          if ! ci-tools/scripts/authors.sh "$GITHUB_BASE_REF" "HEAD"; then
            ci-tools/scripts/authors.sh -p "$ACTOR" "$GITHUB_BASE_REF" "HEAD" |
              gh pr comment "$PR" --body-file -
          fi
        env:
          LC_ALL: C
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.html_url }}
          ACTOR: ${{ github.actor }}
