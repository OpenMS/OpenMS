name: "ProSE integration CI"

# Builds and tests the ProSE integration branch on Linux, macOS and Windows,
# with ONNX Runtime on (the CI presets set WITH_ONNX=ON and the vcpkg
# onnxruntime feature), and runs the prose_auto prototype's test suite.
# Meant for the okohlbacher/OpenMS fork, which has no rsync cache secrets:
# the build action then keeps the vcpkg binary cache in the Actions cache.

on:
  workflow_dispatch:
  push:
    branches:
      - 'prose/**'
  pull_request:
    branches:
      - 'prose/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            compiler: g++
          - os: macos-15
            compiler: xcode
          - os: windows-2025
            compiler: cl.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build OpenMS
        id: build
        uses: ./.github/actions/build
        with:
          compiler: ${{ matrix.compiler }}

      - name: Check that the build has ONNX Runtime
        shell: bash
        run: grep -E '^WITH_ONNX:BOOL=ON' "build/${{ steps.build.outputs.preset }}/CMakeCache.txt"

  prose-auto:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install prose_auto dependencies
        shell: bash
        run: python -m pip install pyopenms numpy pyyaml pytest

      - name: Test prose_auto
        shell: bash
        working-directory: tools/prose_auto
        run: python -m pytest tests -q
