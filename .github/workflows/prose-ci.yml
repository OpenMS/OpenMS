name: "ProSE integration CI"

# Builds and tests the ProSE integration branch on Linux, macOS and Windows,
# with ONNX Runtime on (the CI presets set WITH_ONNX=ON and the vcpkg
# onnxruntime feature). The prose_auto tests run in prose_auto.yml.
# Meant for the okohlbacher/OpenMS fork, which has no rsync cache secrets:
# the build action then keeps the vcpkg binary cache in the Actions cache.

on:
  workflow_dispatch:
  push:
    branches:
      - 'prose/**'
  pull_request:
    branches:
      - 'prose/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            compiler: g++
          - os: macos-15
            compiler: xcode
          - os: windows-2025
            compiler: cl.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build OpenMS
        id: build
        uses: ./.github/actions/build
        with:
          compiler: ${{ matrix.compiler }}

      - name: Check that the build has ONNX Runtime
        shell: bash
        run: grep -E '^WITH_ONNX:BOOL=ON' "build/${{ steps.build.outputs.preset }}/CMakeCache.txt"
