[workspace]
name = "openms"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64", "win-64"]

[dependencies]
cmake = ">=3.26,<4.0"
ninja = "*"
eigen = ">=3.4"
boost = ">=1.74"
xerces-c = "*"
sqlite = "*"
hdf5 = "*"
coin-or-clp = "*"
coin-or-cbc = "*"
coin-or-cgl = "*"
coin-or-osi = "*"
ccache = "*"
zlib = "*"
bzip2 = "*"
libsvm = ">=2.91"
libcurl = "*"
libarrow = "*"
libparquet = "*"
nlohmann_json = "*"
sqlitecpp = "*"
simde = "*"
libxml2 = "*"
doxygen = "*"
ghostscript = "*"
graphviz = "*"
lapack = "*"
blas = "*"

[target.linux-64.dependencies]
coinmp = "*"
libtool = "*"
autoconf = "*"
patch = "*"
mesalib = "*"
qt6-main = ">=6.1"

[target.linux-aarch64.dependencies]
coinmp = "*"
libtool = "*"
autoconf = "*"
patch = "*"
mesalib = "*"
qt6-main = ">=6.1"

[target.osx-arm64.dependencies]
libtool = "*"
autoconf = "*"
patch = "*"
qt6-main = ">=6.1"

[target.win-64.dependencies]
qt6-main = ">=6.1"